<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>같이 가자 ✈️</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F7F3EE;--card:#fff;--border:#E5D9CC;--bm:#D4C4B2;--text:#1A0F05;--muted:#8A6B52;--A:#BA7517;--AX:#FAF0D7;--AL:#FAC775;--ok:#1A7A5A;--no:#CC3333;--r:12px;--rl:16px}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
input,button,textarea{font-family:inherit;font-size:16px}
input,textarea{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;height:50px}
textarea{height:auto;min-height:80px}
input:focus,textarea:focus{border-color:var(--A);box-shadow:0 0 0 3px rgba(186,117,23,.12)}
input[type=date]{color:var(--text)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=password]{letter-spacing:.1em}
.bp{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--A);color:#412402;border:none;border-radius:var(--r);padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s,transform .1s}
.bp:active{opacity:.85;transform:scale(.98)}
.bp:disabled{opacity:.5;cursor:default;transform:none}
.bg{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--muted);border:1.5px solid var(--bm);border-radius:var(--r);padding:13px 18px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;font-family:inherit}
.bg:active{background:#f0ebe4}
.bt{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px 8px;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.bd{background:none;border:none;color:var(--no);cursor:pointer;font-size:14px;padding:6px 8px;opacity:.7;font-family:inherit}
.bd:active{opacity:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;letter-spacing:.2px}
.err{background:#FEE8E8;color:#B22222;border-radius:10px;padding:12px 14px;font-size:14px;display:none;margin-bottom:10px;line-height:1.5}
.chip{border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;background:transparent;color:var(--muted);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:4px;transition:all .15s;font-family:inherit}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--AX);color:var(--A);border-color:var(--A)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.tab{flex:1;border:none;background:none;padding:13px 4px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-family:inherit}
.tab.on{color:var(--A);border-bottom-color:var(--A)}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--bg)}
.page.top{justify-content:flex-start;padding-top:3rem}
.fw{width:100%;max-width:420px}
.bw{display:flex;justify-content:space-between;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--A);flex-shrink:0}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.35}
.empty p{font-size:14px;line-height:1.6}
.code-box{background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--rl);padding:16px 18px}
.big-code{font-size:22px;font-weight:900;letter-spacing:5px;color:var(--A);margin:4px 0 2px;word-break:break-all}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:#f5f0ea;border-radius:var(--r);padding:12px 8px;text-align:center}
.trip-hd{background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:30}
.content{padding:14px 14px 2rem;max-width:600px;margin:0 auto}
.act-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:flex-start}
.date-range{background:#fff;border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.date-range-row{display:grid;grid-template-columns:1fr 1px 1fr}
.date-range input{border:none;border-radius:0;box-shadow:none;padding:13px 12px;background:transparent;height:auto}
.date-range input:focus{border:none;box-shadow:none;background:var(--AX)}
.date-range-div{background:var(--border);width:1px}
.copy-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(186,117,23,.12);border:1.5px solid var(--AL);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--A);cursor:pointer;font-family:inherit;width:100%;transition:background .15s}
.copy-btn:active{background:rgba(186,117,23,.22)}
.trip-card{background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;align-items:center;gap:14px}
.trip-card:active{border-color:var(--A);box-shadow:0 2px 12px rgba(186,117,23,.15)}
.loading{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
[id^="s-"]{display:none}
#s-loading{display:flex}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media(max-width:380px){.big-code{font-size:18px;letter-spacing:3px}.tab{font-size:12px;gap:3px}}
</style>
</head>
<body>

<div id="s-loading" class="loading">
  <i class="ti ti-plane-departure" style="font-size:40px;color:var(--A);animation:spin 1.5s linear infinite"></i>
</div>

<div id="s-auth" class="page">
  <div class="fw col">
    <div style="text-align:center;margin-bottom:1rem">
      <i class="ti ti-plane-departure" style="font-size:48px;color:var(--A);display:block;margin-bottom:12px"></i>
      <h1 style="font-size:28px;font-weight:900;letter-spacing:-1px">같이 가자</h1>
      <p style="color:var(--muted);font-size:14px;margin-top:6px;line-height:1.7">친구들과 여행 일정과 비용 정산을<br>한 곳에서 관리해요</p>
    </div>
    <div style="display:flex;background:#f5f0ea;border-radius:var(--r);padding:4px;gap:4px">
      <button id="tab-login-btn" onclick="setAuthTab('login')" style="flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--A);color:#412402">로그인</button>
      <button id="tab-signup-btn" onclick="setAuthTab('signup')" style="flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)">회원가입</button>
    </div>
    <div id="err-auth" class="err"></div>
    <div><label class="lbl">이메일</label><input id="inp-email" type="email" placeholder="hello@example.com" autocomplete="email"></div>
    <div><label class="lbl">비밀번호</label><input id="inp-pw" type="password" placeholder="6자리 이상" autocomplete="current-password"></div>
    <div id="inp-pw2-wrap" style="display:none"><label class="lbl">비밀번호 확인</label><input id="inp-pw2" type="password" placeholder="비밀번호 재입력" autocomplete="new-password"></div>
    <button class="bp" id="auth-btn" onclick="doAuth()">로그인 <i class="ti ti-arrow-right"></i></button>
    <button class="bt" id="forgot-btn" onclick="doForgot()" style="justify-content:center;width:100%;font-size:13px">비밀번호를 잊으셨나요?</button>
  </div>
</div>

<div id="s-home" class="page top">
  <div class="fw">
    <div class="bw" style="margin-bottom:1.5rem">
      <div>
        <h2 style="font-size:22px;font-weight:900">내 여행</h2>
        <p id="home-email" style="font-size:13px;color:var(--muted);margin-top:2px"></p>
      </div>
      <button class="bt" onclick="doLogout()" style="font-size:13px"><i class="ti ti-logout"></i>로그아웃</button>
    </div>
    <div class="col" style="gap:8px;margin-bottom:1.5rem">
      <button class="bp" onclick="go('create')"><i class="ti ti-map-plus"></i>새 여행 만들기</button>
      <button class="bg" style="width:100%" onclick="go('join')"><i class="ti ti-key"></i>코드로 참여하기</button>
    </div>
    <div id="my-trips-wrap"></div>
  </div>
</div>

<div id="s-create" class="page">
  <div class="fw col">
    <button class="bt" onclick="go('home')" style="align-self:flex-start;padding-left:0"><i class="ti ti-arrow-left"></i>뒤로</button>
    <h2 style="font-size:24px;font-weight:900">새 여행 만들기</h2>
    <div id="err-create" class="err"></div>
    <div><label class="lbl">여행 이름</label><input id="inp-tname" placeholder="제주도 여름 여행" maxlength="10" autocomplete="off"></div>
    <div>
      <label class="lbl">여행 날짜</label>
      <div class="date-range">
        <div class="date-range-row">
          <div>
            <div style="font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 0">시작일</div>
            <input id="inp-start" type="date" onchange="onStartChange()">
          </div>
          <div class="date-range-div"></div>
          <div>
            <div style="font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 0">종료일</div>
            <input id="inp-end" type="date" onchange="updateNights()">
          </div>
        </div>
      </div>
      <p id="nights-badge" style="display:none;font-size:13px;color:var(--A);text-align:right;margin-top:6px"></p>
    </div>
    <div><label class="lbl">내 닉네임 <span style="font-weight:400;color:var(--muted)">(이 여행에서 사용)</span></label><input id="inp-creator-nick" placeholder="철수귀요미" oninput="this.value=this.value.replace(/\s/g,'').slice(0,10)" autocomplete="off"></div>
    <button class="bp" onclick="doCreate()">여행 만들기 <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<div id="s-join" class="page">
  <div class="fw col">
    <button class="bt" onclick="go('home')" style="align-self:flex-start;padding-left:0"><i class="ti ti-arrow-left"></i>뒤로</button>
    <h2 style="font-size:24px;font-weight:900">여행 참여하기</h2>
    <p style="font-size:15px;color:var(--muted)">친구에게 받은 코드를 입력해주세요</p>
    <div id="err-join" class="err"></div>
    <div><label class="lbl">여행 코드</label><input id="inp-jcode" placeholder="ABC123" style="font-size:22px;font-weight:900;letter-spacing:5px;text-align:center" oninput="this.value=this.value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6)" autocomplete="off" autocapitalize="characters"></div>
    <button class="bp" onclick="doJoin()">참여하기 <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<div id="s-nick" class="page">
  <div class="fw col">
    <h2 style="font-size:24px;font-weight:900">닉네임 설정</h2>
    <p style="font-size:14px;color:var(--muted);line-height:1.7">이 여행에서 사용할 닉네임을 설정해주세요.<br>한 번 설정하면 바꿀 수 없어요.</p>
    <div class="code-box">
      <p style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">여행 코드</p>
      <p id="disp-code" class="big-code"></p>
      <button class="copy-btn" style="margin-top:8px" onclick="copyCode()"><i class="ti ti-copy"></i>코드 공유하기</button>
    </div>
    <div id="err-nick" class="err"></div>
    <div><label class="lbl">닉네임</label><input id="inp-nick" placeholder="철수귀요미" oninput="this.value=this.value.replace(/\s/g,'').slice(0,10)" autocomplete="off" autocorrect="off"></div>
    <button class="bp" onclick="doSetNick()">입장하기 <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<div id="s-trip">
  <div class="trip-hd">
    <div class="bw" style="max-width:600px;margin:0 auto">
      <div style="flex:1;min-width:0;margin-right:10px">
        <h2 id="trip-name" style="font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></h2>
        <p id="trip-dates" style="font-size:12px;color:var(--muted);margin-top:2px"></p>
        <p id="trip-me" style="font-size:12px;color:var(--muted);margin-top:2px"></p>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button onclick="toggleCode()" style="background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--r);padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--A);font-family:inherit"><i class="ti ti-key"></i></button>
        <button onclick="go('home')" style="background:transparent;border:1.5px solid var(--border);border-radius:var(--r);padding:9px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit"><i class="ti ti-home"></i></button>
      </div>
    </div>
    <div id="code-panel" style="display:none;max-width:600px;margin:12px auto 0;background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--r);padding:14px 16px">
      <p style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">친구들에게 공유하세요</p>
      <p id="share-code" style="font-size:24px;font-weight:900;letter-spacing:8px;color:var(--A);margin-bottom:8px"></p>
      <button class="copy-btn" onclick="copyCode()"><i class="ti ti-copy"></i>코드 복사하기</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="schedule" onclick="switchTab('schedule')"><i class="ti ti-calendar" style="font-size:14px"></i>일정</button>
    <button class="tab" data-tab="expenses" onclick="switchTab('expenses')"><i class="ti ti-credit-card" style="font-size:14px"></i>비용</button>
    <button class="tab" data-tab="settle" onclick="switchTab('settle')"><i class="ti ti-receipt" style="font-size:14px"></i>정산</button>
    <button class="tab" data-tab="members" onclick="switchTab('members')"><i class="ti ti-users" style="font-size:14px"></i>멤버</button>
  </div>
  <div class="content">
    <div id="tab-schedule"></div>
    <div id="tab-expenses" style="display:none"></div>
    <div id="tab-settle" style="display:none"></div>
    <div id="tab-members" style="display:none"></div>
  </div>
</div>

<script>
// ── Firebase 초기화 ──
const firebaseConfig = {
  apiKey: "AIzaSyBQBLy_bzxZeEmkDAEtI2GP4ukCA_VMZVY",
  authDomain: "maybe-fire.firebaseapp.com",
  databaseURL: "https://maybe-fire-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "maybe-fire",
  storageBucket: "maybe-fire.firebasestorage.app",
  messagingSenderId: "692135029863",
  appId: "1:692135029863:web:5b7d0682fb6817a6dbf8c2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ── Firebase REST DB ──
const FB = "https://maybe-fire-default-rtdb.asia-southeast1.firebasedatabase.app";
function fbKey(k) { return k.replace(/:/g, '_'); }

function fixArrays(obj) {
  if (obj === null || obj === undefined) return obj;
  if (Array.isArray(obj)) return obj.map(fixArrays);
  if (typeof obj !== 'object') return obj;
  const keys = Object.keys(obj);
  const isArr = keys.length > 0 && keys.every(k => /^\d+$/.test(k));
  if (isArr) {
    const arr = [];
    keys.forEach(k => arr[parseInt(k)] = fixArrays(obj[k]));
    return arr;
  }
  const result = {};
  keys.forEach(k => result[k] = fixArrays(obj[k]));
  return result;
}

async function dbGet(k) {
  try {
    const r = await fetch(FB + '/' + fbKey(k) + '.json');
    const raw = await r.json();
    return raw !== null ? fixArrays(raw) : null;
  } catch(e) { return null; }
}

async function dbSet(k, v) {
  try {
    await fetch(FB + '/' + fbKey(k) + '.json', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(v)
    });
  } catch(e) { showToast('저장 실패. 인터넷 연결을 확인해주세요 📶'); }
}

async function dbPatch(k, v) {
  try {
    await fetch(FB + '/' + fbKey(k) + '.json', {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(v)
    });
  } catch(e) {}
}

// ── 상태 ──
var S = { user: null, trip: null, me: '', code: '', pendingCode: '' };
var authTab = 'login';
var openDayForm = false;
var openActForms = new Set();
var actMoreFields = new Set();
var editActState = {};
var EF = { open: false, title: '', amount: '', paidBy: '', split: [], cat: '식비', dayId: '', currency: 'KRW' };
var rateCache = {};
var syncTimer = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }
function mkCode() { return Math.random().toString(36).substr(2, 6).toUpperCase(); }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

// ── 토스트 ──
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1A0F05;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity .3s;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(function() { t.style.opacity = '0'; }, 2000);
}

// ── 에러 표시 ──
function showErr(id, msg) {
  var e = document.getElementById(id);
  if (e) { e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
}

// ── 네비게이션 ──
function go(screen) {
  document.querySelectorAll('[id^="s-"]').forEach(function(e) { e.style.display = 'none'; });
  var el = document.getElementById('s-' + screen);
  if (!el) return;
  el.style.display = screen === 'trip' ? 'block' : 'flex';
  if (screen === 'trip') window.scrollTo(0, 0);
  if (screen === 'home') loadMyTrips();
}

// ── Auth 상태 감지 ──
auth.onAuthStateChanged(function(user) {
  if (user) {
    S.user = user;
    document.getElementById('home-email').textContent = user.email;
    go('home');
  } else {
    S.user = null;
    go('auth');
  }
});

// ── Auth 탭 ──
function setAuthTab(tab) {
  authTab = tab;
  var isLogin = tab === 'login';
  document.getElementById('tab-login-btn').style.background = isLogin ? 'var(--A)' : 'transparent';
  document.getElementById('tab-login-btn').style.color = isLogin ? '#412402' : 'var(--muted)';
  document.getElementById('tab-signup-btn').style.background = !isLogin ? 'var(--A)' : 'transparent';
  document.getElementById('tab-signup-btn').style.color = !isLogin ? '#412402' : 'var(--muted)';
  document.getElementById('inp-pw2-wrap').style.display = isLogin ? 'none' : 'block';
  document.getElementById('forgot-btn').style.display = isLogin ? 'flex' : 'none';
  document.getElementById('auth-btn').innerHTML = isLogin ? '로그인 <i class="ti ti-arrow-right"></i>' : '회원가입 <i class="ti ti-arrow-right"></i>';
  showErr('err-auth', '');
}

// ── 로그인/회원가입 ──
async function doAuth() {
  var email = document.getElementById('inp-email').value.trim();
  var pw = document.getElementById('inp-pw').value;
  if (!email) return showErr('err-auth', '이메일을 입력해주세요');
  if (!pw) return showErr('err-auth', '비밀번호를 입력해주세요');
  var btn = document.getElementById('auth-btn');
  btn.disabled = true; btn.textContent = '처리 중...';
  showErr('err-auth', '');
  try {
    if (authTab === 'login') {
      await auth.signInWithEmailAndPassword(email, pw);
    } else {
      if (pw.length < 6) throw { code: 'auth/weak-password' };
      var pw2 = document.getElementById('inp-pw2').value;
      if (pw !== pw2) throw { code: 'pw-mismatch' };
      await auth.createUserWithEmailAndPassword(email, pw);
    }
  } catch(e) {
    var msgs = {
      'auth/user-not-found': '등록되지 않은 이메일이에요',
      'auth/wrong-password': '비밀번호가 틀렸어요',
      'auth/email-already-in-use': '이미 사용 중인 이메일이에요',
      'auth/invalid-email': '이메일 형식이 올바르지 않아요',
      'auth/weak-password': '비밀번호는 6자리 이상이어야 해요',
      'auth/too-many-requests': '잠시 후 다시 시도해주세요',
      'auth/invalid-credential': '이메일 또는 비밀번호가 틀렸어요',
      'pw-mismatch': '비밀번호가 일치하지 않아요'
    };
    showErr('err-auth', msgs[e.code] || '오류가 발생했어요: ' + e.code);
  } finally {
    btn.disabled = false;
    btn.innerHTML = authTab === 'login' ? '로그인 <i class="ti ti-arrow-right"></i>' : '회원가입 <i class="ti ti-arrow-right"></i>';
  }
}

async function doForgot() {
  var email = document.getElementById('inp-email').value.trim();
  if (!email) return showErr('err-auth', '이메일을 먼저 입력해주세요');
  try { await auth.sendPasswordResetEmail(email); showToast('비밀번호 재설정 이메일을 보냈어요 📧'); }
  catch(e) { showErr('err-auth', '이메일을 다시 확인해주세요'); }
}

async function doLogout() { stopSync(); await auth.signOut(); }

// ── 내 여행 목록 ──
async function loadMyTrips() {
  var el = document.getElementById('my-trips-wrap');
  if (!el || !S.user) return;
  el.innerHTML = '<div class="empty"><i class="ti ti-loader" style="animation:spin 1s linear infinite"></i><p>불러오는 중...</p></div>';
  var myTrips = await dbGet('user-trips:' + S.user.uid) || {};
  var codes = Object.keys(myTrips);
  if (!codes.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-plane-off"></i><p>아직 참여한 여행이 없어요<br>새 여행을 만들거나 코드로 참여해보세요!</p></div>';
    return;
  }
  el.innerHTML = '';
  for (var i = codes.length - 1; i >= 0; i--) {
    var code = codes[i];
    var t = await dbGet('trip:' + code);
    if (!t) continue;
    var nick = (myTrips[code] && myTrips[code].nickname) ? myTrips[code].nickname : '';
    var d = t.startDate ? (t.endDate ? t.startDate + ' ~ ' + t.endDate : t.startDate) : '날짜 미정';
    var memberCount = (t.members || []).length;
    var card = document.createElement('div');
    card.className = 'trip-card';
    card.innerHTML = '<div style="width:46px;height:46px;border-radius:14px;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">✈️</div>'
      + '<div style="flex:1;min-width:0">'
      + '<p style="font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + t.name + '</p>'
      + '<p style="font-size:12px;color:var(--muted);margin-top:3px">' + d + '</p>'
      + '<p style="font-size:12px;color:var(--muted);margin-top:2px"><i class="ti ti-users" style="font-size:11px;margin-right:3px"></i>' + memberCount + '명 · 내 닉네임: <span style="color:var(--A);font-weight:700">' + nick + '</span></p>'
      + '</div>'
      + '<i class="ti ti-chevron-right" style="color:var(--muted);font-size:18px;flex-shrink:0"></i>';
    (function(c) { card.onclick = function() { enterTrip(c); }; })(code);
    el.appendChild(card);
  }
}

// ── 여행 입장 ──
async function enterTrip(code) {
  showToast('입장 중...');
  try {
    var myTrips = await dbGet('user-trips:' + S.user.uid) || {};
    var myInfo = myTrips[code];
    if (myInfo && myInfo.nickname) {
      var t = await dbGet('trip:' + code);
      if (!t) { showToast('여행 데이터를 불러오지 못했어요. 잠시 후 다시 시도해주세요.'); return; }
      S.trip = t; S.code = code; S.me = myInfo.nickname;
      renderTrip(); go('trip'); startSync(code);
    } else {
      S.pendingCode = code;
      document.getElementById('disp-code').textContent = code;
      document.getElementById('inp-nick').value = '';
      showErr('err-nick', '');
      go('nick');
    }
  } catch(e) {
    showToast('오류가 발생했어요: ' + (e.message || e));
  }
}

// ── 날짜 ──
function onStartChange() {
  var s = document.getElementById('inp-start').value;
  var endInput = document.getElementById('inp-end');
  if (s) {
    var next = new Date(s + 'T00:00:00');
    next.setDate(next.getDate() + 1);
    endInput.min = next.toISOString().split('T')[0];
    if (endInput.value && endInput.value <= s) endInput.value = '';
    endInput.focus();
  }
  updateNights();
}
function updateNights() {
  var s = document.getElementById('inp-start').value;
  var e = document.getElementById('inp-end').value;
  var badge = document.getElementById('nights-badge');
  if (!badge) return;
  if (s && e && new Date(e) >= new Date(s)) {
    var nights = Math.round((new Date(e) - new Date(s)) / 86400000);
    badge.textContent = nights === 0 ? '당일치기' : (nights + '박 ' + (nights + 1) + '일');
    badge.style.display = 'block';
  } else { badge.style.display = 'none'; }
}

// ── 날짜 → 일정 자동 생성 ──
function autoPopulateDays(t) {
  if (!t.startDate || (t.itinerary && t.itinerary.length > 0)) return t;
  t.itinerary = t.itinerary || [];
  var start = new Date(t.startDate + 'T00:00:00');
  var end = t.endDate ? new Date(t.endDate + 'T00:00:00') : start;
  var cur = new Date(start), i = 1;
  while (cur <= end && i <= 31) {
    t.itinerary.push({ id: uid(), label: i + '일차', date: cur.toISOString().split('T')[0], activities: [], auto: true });
    cur.setDate(cur.getDate() + 1); i++;
  }
  return t;
}

// ── 여행 만들기 ──
async function doCreate() {
  var name = document.getElementById('inp-tname').value.trim();
  var startDate = document.getElementById('inp-start').value;
  var endDate = document.getElementById('inp-end').value;
  var nick = document.getElementById('inp-creator-nick').value.trim();
  if (!name) return showErr('err-create', '여행 이름을 입력해주세요');
  if (!startDate) return showErr('err-create', '시작일을 선택해주세요');
  if (!endDate) return showErr('err-create', '종료일을 선택해주세요');
  if (new Date(endDate) < new Date(startDate)) return showErr('err-create', '종료일이 시작일보다 빨라요');
  if (!nick) return showErr('err-create', '이 여행에서 사용할 닉네임을 입력해주세요');
  var btn = document.querySelector('#s-create .bp');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  var c = mkCode();
  var t = { name: name, code: c, startDate: startDate, endDate: endDate, members: [], itinerary: [], expenses: [], createdAt: Date.now(), createdBy: S.user.uid };
  t.members.push({ uid: S.user.uid, nickname: nick });
  t = autoPopulateDays(t);
  await dbSet('trip:' + c, t);
  var patch = {}; patch[c] = { nickname: nick, joinedAt: Date.now() };
  await dbPatch('user-trips:' + S.user.uid, patch);
  if (btn) { btn.disabled = false; btn.innerHTML = '여행 만들기 <i class="ti ti-arrow-right"></i>'; }
  showErr('err-create', '');
  S.trip = t; S.code = c; S.me = nick;
  renderTrip(); go('trip'); startSync(c);
}

// ── 코드로 참여 ──
async function doJoin() {
  var c = document.getElementById('inp-jcode').value.trim().toUpperCase();
  if (!c) return showErr('err-join', '코드를 입력해주세요');
  if (c.length < 6) return showErr('err-join', '코드는 6자리예요');
  var btn = document.querySelector('#s-join .bp');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중...'; }
  showErr('err-join', '');
  var myTrips = await dbGet('user-trips:' + S.user.uid) || {};
  if (myTrips[c] && myTrips[c].nickname) {
    if (btn) { btn.disabled = false; btn.innerHTML = '참여하기 <i class="ti ti-arrow-right"></i>'; }
    await enterTrip(c); return;
  }
  var t = await dbGet('trip:' + c);
  if (btn) { btn.disabled = false; btn.innerHTML = '참여하기 <i class="ti ti-arrow-right"></i>'; }
  if (!t) return showErr('err-join', '존재하지 않는 여행 코드예요');
  S.pendingCode = c;
  document.getElementById('disp-code').textContent = c;
  document.getElementById('inp-nick').value = '';
  showErr('err-nick', '');
  go('nick');
}

// ── 닉네임 설정 ──
async function doSetNick() {
  var nick = document.getElementById('inp-nick').value.trim();
  if (!nick) return showErr('err-nick', '닉네임을 입력해주세요');
  var btn = document.querySelector('#s-nick .bp');
  if (btn) { btn.disabled = true; btn.textContent = '입장 중...'; }
  showErr('err-nick', '');
  try {
    var t = await dbGet('trip:' + S.pendingCode);
    if (!t) throw new Error('여행을 찾을 수 없어요');
    var members = t.members || [];
    var exists = members.find(function(m) {
      return (typeof m === 'object' ? m.nickname : m) === nick && (typeof m === 'object' ? m.uid !== S.user.uid : true);
    });
    if (exists) throw new Error('이미 사용 중인 닉네임이에요');
    var myMember = members.find(function(m) { return typeof m === 'object' && m.uid === S.user.uid; });
    if (!myMember) members.push({ uid: S.user.uid, nickname: nick });
    t.members = members;
    t = autoPopulateDays(t);
    t.itinerary = t.itinerary || [];
    t.expenses = t.expenses || [];
    await dbSet('trip:' + S.pendingCode, t);
    var patch = {}; patch[S.pendingCode] = { nickname: nick, joinedAt: Date.now() };
    await dbPatch('user-trips:' + S.user.uid, patch);
    S.trip = t; S.code = S.pendingCode; S.me = nick;
    renderTrip(); go('trip'); startSync(S.code);
  } catch(e) {
    showErr('err-nick', e.message || '오류가 발생했어요');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '입장하기 <i class="ti ti-arrow-right"></i>'; }
  }
}

// ── 코드 복사 ──
function copyCode() {
  var code = S.pendingCode || S.code;
  if (!code) return;
  var txt = '같이 가자! 여행 코드: ' + code + '\n앱에서 "코드로 참여하기"를 누르고 코드를 입력해줘 👉 ' + location.origin;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function() { showToast('코드가 복사됐어요! 📋'); });
  } else {
    var el = document.createElement('textarea');
    el.value = txt; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    showToast('코드가 복사됐어요! 📋');
  }
}

function toggleCode() {
  var p = document.getElementById('code-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

// ── 멤버 헬퍼 ──
function getMembers() { return (S.trip && S.trip.members) ? S.trip.members : []; }
function getNicks() { return getMembers().map(function(m) { return typeof m === 'object' ? m.nickname : m; }); }
function getMemberName(nick) {
  var m = getMembers().find(function(m) { return (typeof m === 'object' ? m.nickname : m) === nick; });
  if (!m) return nick;
  return typeof m === 'object' ? m.nickname : m;
}

// ── 여행 렌더 ──
function renderTrip() {
  var t = S.trip; if (!t) return;
  document.getElementById('trip-name').textContent = t.name;
  document.getElementById('trip-dates').textContent = t.startDate ? (t.endDate ? t.startDate + ' ~ ' + t.endDate : t.startDate) : '';
  document.getElementById('trip-me').innerHTML = '<i class="ti ti-user" style="font-size:11px;margin-right:3px"></i>' + S.me;
  document.getElementById('share-code').textContent = S.code;
  var activeTab = (document.querySelector('.tab.on') || {}).dataset && document.querySelector('.tab.on').dataset.tab || 'schedule';
  renderTabSafe(activeTab);
}
function renderTabSafe(n) {
  if (n === 'schedule') renderSchedule();
  else if (n === 'expenses') renderExpenses();
  else if (n === 'settle') renderSettle();
  else if (n === 'members') renderMembers();
}
function switchTab(n) {
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.toggle('on', b.dataset.tab === n); });
  ['schedule','expenses','settle','members'].forEach(function(t) {
    document.getElementById('tab-' + t).style.display = t === n ? 'block' : 'none';
  });
  renderTabSafe(n);
}

// ── 동기화 ──
function startSync(code) {
  stopSync();
  syncTimer = setInterval(async function() {
    if (!code) return;
    var f = document.activeElement;
    if (f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA')) return;
    if (openDayForm || openActForms.size > 0 || EF.open) return;
    var t = await dbGet('trip:' + code);
    if (t && JSON.stringify(t) !== JSON.stringify(S.trip)) { S.trip = t; renderTrip(); }
  }, 5000);
}
function stopSync() { if (syncTimer) { clearInterval(syncTimer); syncTimer = null; } }

async function fetchRate(currency) {

function calcSettle(exps, nicks) {
  var bal = {};
  nicks.forEach(function(n) { bal[n] = 0; });
  exps.forEach(function(e) {
    var am = (e.split && e.split.length) ? e.split : nicks;
    var sh = e.amount / am.length;
    am.forEach(function(n) { if (n in bal) bal[n] -= sh; });
    if (e.paidBy in bal) bal[e.paidBy] += e.amount;
  });
  var pos = [], neg = [];
  Object.keys(bal).forEach(function(n) {
    if (bal[n] > 1) pos.push([n, bal[n]]); else if (bal[n] < -1) neg.push([n, -bal[n]]);
  });
  pos.sort(function(a,b) { return b[1]-a[1]; }); neg.sort(function(a,b) { return b[1]-a[1]; });
  var out = [];
  while (pos.length && neg.length) {
    var cn = pos[0][0], ca = pos[0][1], dn = neg[0][0], da = neg[0][1];
    var a = Math.min(ca, da);
    out.push({ from: dn, to: cn, amount: Math.round(a) });
    pos[0][1] -= a; neg[0][1] -= a;
    if (pos[0][1] < 1) pos.shift(); if (neg[0][1] < 1) neg.shift();
  }
  return out;
}

function renderSettle() {
  var el = document.getElementById('tab-settle');
  var nicks = getNicks();
  var exps = (S.trip && S.trip.expenses) ? S.trip.expenses : [];

    el.innerHTML = '<div class="card"><div class="empty"><i class="ti ti-receipt-off"></i><p>' + (!exps.length ? '지출 내역을 먼저 추가해주세요' : '멤버가 2명 이상이어야 정산할 수 있어요') + '</p></div></div>';
    return;
  }
  var total = exps.reduce(function(s,e) { return s+e.amount; }, 0);
  var txns = calcSettle(exps, nicks);
  var paid = {};
  nicks.forEach(function(n) { paid[n] = 0; });
  exps.forEach(function(e) { paid[e.paidBy] = (paid[e.paidBy] || 0) + e.amount; });
  var h = '<h3 style="font-size:17px;font-weight:900;margin-bottom:14px">정산 결과</h3>'
    + '<div class="stat-grid">'
    + '<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">총 지출</div><div style="font-size:15px;font-weight:900;color:var(--A)">' + fmt(total) + '원</div></div>'
    + '<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">인원</div><div style="font-size:15px;font-weight:900;color:var(--A)">' + nicks.length + '명</div></div>'
    + '<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">1인당</div><div style="font-size:15px;font-weight:900;color:var(--A)">' + fmt(total / nicks.length) + '원</div></div>'
    + '</div>';
  if (!txns.length) {
    h += '<div class="card" style="text-align:center;padding:2rem"><i class="ti ti-circle-check" style="font-size:40px;color:var(--ok);display:block;margin-bottom:10px"></i><p style="font-size:17px;font-weight:900;color:var(--ok)">정산 완료! 🎉</p></div>';
  } else {
    h += '<p style="font-size:13px;color:var(--muted);margin-bottom:10px">아래와 같이 정산해주세요</p>';
    txns.forEach(function(tx) {
      h += '<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<span style="font-weight:700;font-size:15px">' + getMemberName(tx.from) + '</span>'
        + '<i class="ti ti-arrow-right" style="color:var(--muted)"></i>'
        + '<span style="font-weight:700;font-size:15px">' + getMemberName(tx.to) + '</span>'
        + '<span style="margin-left:auto;font-weight:900;color:var(--A);font-size:16px;white-space:nowrap">' + fmt(tx.amount) + '원</span>'
        + '</div></div>';
    });
  }
  h += '<h3 style="font-size:16px;font-weight:900;margin:1.5rem 0 12px">멤버별 현황</h3>';
  nicks.forEach(function(n) {
    var mp = paid[n] || 0, diff = mp - total / nicks.length;
    h += '<div class="card"><div class="bw"><span style="font-weight:700">' + getMemberName(n) + '</span>'
      + '<div style="text-align:right"><p style="font-size:14px;color:var(--A);font-weight:700">' + fmt(mp) + '원 결제</p>'
      + '<p style="font-size:12px;color:' + (diff >= 0 ? 'var(--ok)' : 'var(--no)') + ';margin-top:3px">'
      + (diff >= 0 ? '+' + fmt(diff) + '원 받아야 함' : fmt(diff) + '원 내야 함') + '</p></div></div></div>';
  });
  el.innerHTML = h;
}

// ══════════════════════════════
// 멤버 탭
// ══════════════════════════════
function renderMembers() {
  var el = document.getElementById('tab-members');
  var members = getMembers();
  var h = '<h3 style="font-size:17px;font-weight:900;margin-bottom:14px">멤버 ' + members.length + '명</h3>';
  members.forEach(function(m) {
    var nick = typeof m === 'object' ? m.nickname : m;
    h += '<div class="card" style="display:flex;align-items:center;gap:12px">'
      + '<div class="av">' + nick[0].toUpperCase() + '</div>'
      + '<div style="flex:1;min-width:0"><p style="font-weight:700;font-size:15px">' + nick
      + (nick === S.me ? ' <span style="font-size:12px;color:var(--A);font-weight:700">나</span>' : '') + '</p></div></div>';
  });
  h += '<div style="margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)"><button class="bg" style="width:100%" onclick="go(\'home\')"><i class="ti ti-home"></i>홈으로 돌아가기</button></div>';
  el.innerHTML = h;
}

// ══════════════════════════════
// 드래그 앤 드롭
// ══════════════════════════════
var dragState = null, dragGhost = null, dropTargetId = null;
function startDrag(dayId, actId, e) {
  e.preventDefault(); e.stopPropagation();
  var day = S.trip.itinerary.find(function(d) { return d.id === dayId; });
  var act = day && day.activities.find(function(a) { return a.id === actId; });
  if (!act) return;
  dragState = { dayId: dayId, actId: actId, act: act }; dropTargetId = null;
  dragGhost = document.createElement('div');
  dragGhost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;opacity:.9;width:260px;background:#fff;border:2px solid var(--A);border-radius:12px;padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-family:inherit;transform:rotate(2deg)';
  dragGhost.innerHTML = '<div style="display:flex;align-items:center;gap:8px">' + (act.time ? '<span style="font-size:11px;color:var(--A);font-weight:700">' + act.time + '</span>' : '') + '<span style="font-size:14px;font-weight:700">' + act.title + '</span></div>';
  document.body.appendChild(dragGhost);
  document.querySelectorAll('.day-card').forEach(function(c) {
    if (c.dataset.dropDay !== dayId) { c.style.border = '2px dashed var(--AL)'; c.style.background = '#fdf8ef'; }
  });
  var pt = e.touches ? e.touches[0] : e;
  posGhost(pt.clientX, pt.clientY);
  if (e.touches) {
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd, { once: true });
  } else {
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd, { once: true });
  }
}
function posGhost(x, y) {
  if (!dragGhost) return;
  dragGhost.style.left = (x - 130) + 'px'; dragGhost.style.top = (y - 24) + 'px';
  dragGhost.style.display = 'none';
  var el = document.elementFromPoint(x, y);
  dragGhost.style.display = '';
  var zone = el && el.closest('[data-drop-day]');
  var newId = zone ? zone.dataset.dropDay : null;
  if (newId !== dropTargetId) {
    if (dropTargetId) {
      var prev = document.querySelector('[data-drop-day="' + dropTargetId + '"]');
      if (prev && dropTargetId !== dragState.dayId) { prev.style.border = '2px dashed var(--AL)'; prev.style.background = '#fdf8ef'; }
    }
    dropTargetId = newId;
    if (dropTargetId && dropTargetId !== dragState.dayId) {
      var cur = document.querySelector('[data-drop-day="' + dropTargetId + '"]');
      if (cur) { cur.style.border = '2px solid var(--A)'; cur.style.background = 'var(--AX)'; }
    }
  }
}
function onDragMove(e) {
  if (e.cancelable) e.preventDefault();
  var pt = e.touches ? e.touches[0] : e; posGhost(pt.clientX, pt.clientY);
}
function onDragEnd(e) {
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('mousemove', onDragMove);
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  document.querySelectorAll('.day-card').forEach(function(c) { c.style.border = ''; c.style.background = ''; });
  if (dragState && dropTargetId && dropTargetId !== dragState.dayId) {
    var srcDay = S.trip.itinerary.find(function(d) { return d.id === dragState.dayId; });
    var dstDay = S.trip.itinerary.find(function(d) { return d.id === dropTargetId; });
    if (srcDay && dstDay) {
      srcDay.activities = srcDay.activities.filter(function(a) { return a.id !== dragState.actId; });
      dstDay.activities.push(dragState.act);
      dbSet('trip:' + S.code, S.trip); renderSchedule(); showToast('일정을 이동했어요 ✈️');
    }
  }
  dragState = null; dropTargetId = null;
}
</script>
</body>
</html>
