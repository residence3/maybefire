<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="같이 가자">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#BA7517">
<link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/391/airplane_2708-fe0f.png">
<title>✈️ 같이 가자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F7F3EE;--card:#fff;--border:#E5D9CC;--bm:#D4C4B2;--text:#1A0F05;--muted:#8A6B52;--A:#BA7517;--AX:#FAF0D7;--AL:#FAC775;--ok:#1A7A5A;--no:#CC3333;--r:12px;--rl:16px}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none}
input,button,textarea{font-family:inherit;font-size:16px}
input,textarea{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;height:50px}
textarea{height:auto;min-height:80px}
input:focus,textarea:focus{border-color:var(--A);box-shadow:0 0 0 3px rgba(186,117,23,.12)}
input[type=date]{color:var(--text)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=password]{letter-spacing:.1em}
.bp{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--A);color:#412402;border:none;border-radius:var(--r);padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s,transform .1s}
.bp:active{opacity:.85;transform:scale(.98)}
.bp:disabled{opacity:.5;cursor:default;transform:none}
.bg{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--muted);border:1.5px solid var(--bm);border-radius:var(--r);padding:13px 18px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;font-family:inherit}
.bg:active{background:#f0ebe4}
.bt{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px 8px;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.bd{background:none;border:none;color:var(--no);cursor:pointer;font-size:14px;padding:6px 8px;opacity:.7;font-family:inherit}
.bd:active{opacity:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;letter-spacing:.2px}
.err{background:#FEE8E8;color:#B22222;border-radius:10px;padding:12px 14px;font-size:14px;display:none;margin-bottom:10px;line-height:1.5}
.chip{border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;background:transparent;color:var(--muted);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:4px;transition:all .15s;font-family:inherit}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--AX);color:var(--A);border-color:var(--A)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:20;height:46px;transition:top .25s ease}
.tab{flex:1;border:none;background:none;padding:13px 4px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-family:inherit}
.tab.on{color:var(--A);border-bottom-color:var(--A)}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--bg)}
.page.top{justify-content:flex-start;padding-top:3rem}
.fw{width:100%;max-width:420px}
.bw{display:flex;justify-content:space-between;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--A);flex-shrink:0}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.35}
.empty p{font-size:14px;line-height:1.6}
.code-box{background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--rl);padding:16px 18px}
.big-code{font-size:22px;font-weight:900;letter-spacing:5px;color:var(--A);margin:4px 0 2px;word-break:break-all}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:#f5f0ea;border-radius:var(--r);padding:12px 8px;text-align:center}
.trip-hd{background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:30;transition:transform .25s ease}
.content{padding:14px 14px 2rem;max-width:600px;margin:0 auto}
.act-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:flex-start}
.date-range{background:#fff;border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.date-range-row{display:grid;grid-template-columns:1fr 1px 1fr}
.date-range input{border:none;border-radius:0;box-shadow:none;padding:13px 12px;background:transparent;height:auto}
.date-range input:focus{border:none;box-shadow:none;background:var(--AX)}
.date-range-div{background:var(--border);width:1px}
.copy-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(186,117,23,.12);border:1.5px solid var(--AL);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--A);cursor:pointer;font-family:inherit;width:100%;transition:background .15s}
.copy-btn:active{background:rgba(186,117,23,.22)}
.trip-card{background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;align-items:center;gap:14px}
.trip-card:active{border-color:var(--A);box-shadow:0 2px 12px rgba(186,117,23,.15)}
.trip-card.past-trip{opacity:.45;filter:grayscale(.6)}
.loading{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
[id^="s-"]{display:none}
#s-loading{display:flex}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes takeoff{
  0%{transform:translate(0,0) rotate(-45deg);opacity:1;}
  70%{transform:translate(50px,-50px) rotate(-45deg);opacity:.7;}
  100%{transform:translate(90px,-90px) rotate(-45deg);opacity:0;}
}
@keyframes taxiIn{
  0%{transform:translate(-20px,10px) rotate(-5deg);opacity:0;}
  100%{transform:translate(0,0) rotate(-10deg);opacity:1;}
}
.plane-loader{
  position:relative;
  width:80px;height:80px;
  display:flex;align-items:center;justify-content:center;
}
.plane-loader .plane{
  font-size:44px;
  animation:takeoff 1.4s ease-in infinite;
  display:block;
}

@media(max-width:380px){.big-code{font-size:18px;letter-spacing:3px}.tab{font-size:12px;gap:3px}}

/* ── 다크 테마 ── */
body.dark-mode{--bg:#111318;--card:#1e2128;--border:#2e3340;--bm:#3e4455;--text:#e2e4ec;--muted:#7b8299;--A:#c084fc;--AX:#2a1f3d;--AL:#9333ea;--ok:#4ade80;--no:#f87171;--r:12px;--rl:16px}
body.dark-mode{background:#111318!important;color:#e2e4ec!important}
body.dark-mode .tabs{background:#1e2128!important;border-bottom:1px solid #2e3340!important}
body.dark-mode .tab{color:#7b8299!important}
body.dark-mode .tab.on{color:#c084fc!important;border-bottom-color:#c084fc!important}
body.dark-mode .trip-hd{background:#1e2128!important;border-bottom:1px solid #2e3340!important}
body.dark-mode .card{background:#1e2128!important;border-color:#2e3340!important}
body.dark-mode .trip-card{background:#1e2128!important;border-color:#2e3340!important}
body.dark-mode input,body.dark-mode textarea{background:#111318!important;color:#e2e4ec!important;border-color:#2e3340!important}
body.dark-mode .bp{background:#9333ea!important;color:#fff!important}
body.dark-mode .chip{background:#1e2128!important;color:#7b8299!important;border-color:#2e3340!important}
body.dark-mode .chip.on{background:#2a1f3d!important;color:#c084fc!important;border-color:#9333ea!important}
body.dark-mode .loading{background:#111318!important}
body.dark-mode .page{background:#111318!important}
body.dark-mode .content{background:#111318!important}
body.dark-mode .stat-card{background:#2a2a3a!important;color:#e2e4ec!important}
body.dark-mode .av{background:#2a1f3d!important;border-color:#9333ea!important;color:#c084fc!important}
body.dark-mode .copy-btn{background:rgba(192,132,252,.12)!important;border-color:#9333ea!important;color:#c084fc!important}
body.dark-mode .day-card{border-left-color:#9333ea!important}
body.dark-mode .chat-msg.me{background:#6d28d9!important;color:#fff!important}
body.dark-mode .chat-msg.other{background:#1e2128!important;border-color:#2e3340!important;color:#e2e4ec!important}
body.dark-mode .chat-inp button{background:#9333ea!important;color:#fff!important}
body.dark-mode .chat-bubble{background:#9333ea!important}
body.dark-mode .chat-win{background:#1e2128!important;border-color:#2e3340!important;border-radius:20px!important}
body.dark-mode .chat-hd{background:#1e2128!important;border-color:#2e3340!important}
body.dark-mode .chat-inp{background:#1e2128!important;border-color:#2e3340!important}
body.dark-mode .chat-inp input{background:#111318!important;color:#e2e4ec!important;border-color:#2e3340!important}
/* ── 블루 테마 ── */
body.blue-mode{--bg:#f0f7ff;--card:#fff;--border:#bfdbfe;--bm:#93c5fd;--text:#0c1a3d;--muted:#3b6cb0;--A:#0284c7;--AX:#e0f2fe;--AL:#7dd3fc;--ok:#059669;--no:#dc2626;--r:12px;--rl:16px}
body.blue-mode{background:#f0f7ff!important;color:#0c1a3d!important}
body.blue-mode .tabs{background:#0284c7!important;border-bottom:1px solid #0369a1!important}
body.blue-mode .tab{color:rgba(255,255,255,.75)!important;border-bottom-color:transparent!important}
body.blue-mode .tab.on{color:#fff!important;border-bottom-color:#fff!important;background:rgba(255,255,255,.15)!important}
body.blue-mode .trip-hd{background:#0284c7!important;border-bottom:none!important}
body.blue-mode #trip-name,body.blue-mode #trip-dates,body.blue-mode #trip-me{color:#fff!important}
body.blue-mode .trip-hd button{color:#fff!important}
body.blue-mode .card{background:#fff!important;border-color:#bfdbfe!important}
body.blue-mode .trip-card{background:#fff!important;border-color:#bfdbfe!important}
body.blue-mode .bp{background:#0284c7!important;color:#fff!important}
body.blue-mode .bg{border-color:#bfdbfe!important;color:#3b6cb0!important}
body.blue-mode .chip{border-color:#bfdbfe!important;color:#3b6cb0!important;background:#fff!important}
body.blue-mode .chip.on{background:#e0f2fe!important;color:#0284c7!important;border-color:#0284c7!important}
body.blue-mode .copy-btn{background:#e0f2fe!important;border-color:#7dd3fc!important;color:#0284c7!important}
body.blue-mode .stat-card{background:#e0f2fe!important}
body.blue-mode .av{background:#e0f2fe!important;border-color:#7dd3fc!important;color:#0284c7!important}
body.blue-mode .loading{background:#f0f7ff!important}
body.blue-mode .page{background:#f0f7ff!important}
body.blue-mode .content{background:#f0f7ff!important}
body.blue-mode .day-card{border-left-color:#0284c7!important}
body.blue-mode .chat-msg.me{background:#0284c7!important;color:#fff!important}
body.blue-mode .chat-msg.other{background:#e0f2fe!important;border-color:#7dd3fc!important;color:#0c1a3d!important}
body.blue-mode .chat-inp button{background:#0284c7!important;color:#fff!important}
body.blue-mode .chat-bubble{background:#0284c7!important}
body.blue-mode .chat-hd{background:#0284c7!important}
body.blue-mode .chat-hd span{color:#fff!important}
body.blue-mode .chat-hd span i{color:#fff!important}
body.blue-mode .chat-win{background:#f0f7ff!important;border-color:#bfdbfe!important;border-radius:20px!important}

/* ── 엑셀 테마 ── */
body.excel-mode{
  --excel-green:#107c41;--excel-dark:#0a5c2e;
  --excel-ribbon:#f3f3f3;--excel-border:#d0d0d0;
  --excel-header:#e9e9e9;--excel-hilite:#e2efda;--excel-sel:#cce8ff;
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif!important;
  background:#fff!important;color:#000!important;
}
/* ── 타이틀바: 엑셀 윈도우 제목줄 ── */
body.excel-mode .trip-hd{
  background:#fff!important;border-bottom:none!important;
  padding:4px 12px 0!important;
}
body.excel-mode #trip-name{font-size:13px!important;color:#000!important;font-weight:400!important;}
body.excel-mode #trip-name::after{content:'.xlsx';color:#888;font-size:11px}
body.excel-mode #trip-dates,body.excel-mode #trip-me{font-size:11px!important;color:#666!important;}

/* ── 리본 탭바 ── */
body.excel-mode .tabs{
  background:var(--excel-green)!important;
  border-bottom:none!important;height:auto!important;padding:0 4px!important;
  gap:0!important;
}
body.excel-mode .tab{
  color:rgba(255,255,255,.9)!important;font-size:11px!important;
  padding:6px 14px!important;border-radius:3px 3px 0 0!important;
  border:none!important;letter-spacing:0!important;height:30px!important;
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif!important;
}
body.excel-mode .tab.on{
  background:#fff!important;color:var(--excel-green)!important;
  font-weight:700!important;
}

/* ── fx 수식바 ── */
body.excel-mode .content{
  background:#fff!important;padding:0!important;
}
body.excel-mode .content::before{
  content:'A1     fx   여행 일정 데이터';
  display:block;height:22px;line-height:22px;
  padding:0 8px;font-size:11px;color:#333;
  background:#fff;border-bottom:1px solid var(--excel-border);
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif;
  letter-spacing:.2px;
}

/* ── 열 헤더 바 ── */
body.excel-mode .content::after{
  content:'#    A 제목/내용          B 날짜/시간          C 금액          D 비고';
  display:block;height:20px;line-height:20px;
  padding:0 8px;font-size:10px;color:#333;
  background:var(--excel-header);
  border-bottom:1px solid var(--excel-border);
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif;
  white-space:nowrap;overflow:hidden;
}

/* ── 카드 → 행 ── */
body.excel-mode .card{
  background:#fff!important;border:none!important;border-radius:0!important;
  border-bottom:1px solid #e8e8e8!important;
  margin:0!important;padding:5px 8px 5px 34px!important;
  box-shadow:none!important;position:relative!important;
  transition:background .1s!important;
}
body.excel-mode .card:hover{background:var(--excel-sel)!important;}

/* 행 번호 */
body.excel-mode .card::before{
  position:absolute;left:0;top:0;bottom:0;width:30px;
  background:var(--excel-header);border-right:1px solid var(--excel-border);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#444;
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif;
}
body.excel-mode .card:nth-child(1)::before{content:'1'}
body.excel-mode .card:nth-child(2)::before{content:'2'}
body.excel-mode .card:nth-child(3)::before{content:'3'}
body.excel-mode .card:nth-child(4)::before{content:'4'}
body.excel-mode .card:nth-child(5)::before{content:'5'}
body.excel-mode .card:nth-child(6)::before{content:'6'}
body.excel-mode .card:nth-child(7)::before{content:'7'}
body.excel-mode .card:nth-child(8)::before{content:'8'}
body.excel-mode .card:nth-child(9)::before{content:'9'}
body.excel-mode .card:nth-child(10)::before{content:'10'}
body.excel-mode .card:nth-child(11)::before{content:'11'}
body.excel-mode .card:nth-child(12)::before{content:'12'}
body.excel-mode .card:nth-child(13)::before{content:'13'}
body.excel-mode .card:nth-child(14)::before{content:'14'}
body.excel-mode .card:nth-child(15)::before{content:'15'}
body.excel-mode .card:nth-child(16)::before{content:'16'}
body.excel-mode .card:nth-child(17)::before{content:'17'}
body.excel-mode .card:nth-child(18)::before{content:'18'}
body.excel-mode .card:nth-child(19)::before{content:'19'}
body.excel-mode .card:nth-child(20)::before{content:'20'}

/* ── 그룹 헤더 ── */
body.excel-mode h3,body.excel-mode [data-gkey]{
  background:var(--excel-hilite)!important;
  color:var(--excel-dark)!important;font-weight:700!important;
  font-size:11px!important;padding:4px 8px 4px 34px!important;
  border:none!important;border-bottom:1px solid #b6d7a8!important;
  border-radius:0!important;margin:0!important;
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif!important;
}
/* ── day-card ── */
body.excel-mode .day-card{
  border:none!important;border-radius:0!important;margin:0!important;
  border-bottom:1px solid #e0e0e0!important;
  border-left:3px solid var(--excel-green)!important;
  background:#fff!important;padding-left:34px!important;
}

/* ── 입력창 → 셀 스타일 ── */
body.excel-mode input:not([type=checkbox]):not([type=radio]),
body.excel-mode select,body.excel-mode textarea{
  border:1px solid var(--excel-border)!important;
  border-radius:0!important;height:26px!important;
  padding:1px 5px!important;font-size:11px!important;
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif!important;
  background:#fff!important;box-shadow:none!important;
}
body.excel-mode input:focus,body.excel-mode select:focus,body.excel-mode textarea:focus{
  border:2px solid var(--excel-green)!important;
  box-shadow:0 0 0 1px rgba(16,124,65,.3)!important;
  outline:none!important;background:var(--excel-sel)!important;
}
body.excel-mode textarea{height:auto!important;min-height:44px!important;}

/* ── 버튼 ── */
body.excel-mode .bp{
  background:var(--excel-green)!important;color:#fff!important;
  border:1px solid var(--excel-dark)!important;border-radius:2px!important;
  font-size:11px!important;height:26px!important;padding:0 14px!important;
  font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif!important;
}
body.excel-mode .bg{
  background:var(--excel-ribbon)!important;color:#333!important;
  border:1px solid var(--excel-border)!important;border-radius:2px!important;
  font-size:11px!important;height:26px!important;padding:0 10px!important;
}
body.excel-mode .chip{
  border:1px solid var(--excel-border)!important;border-radius:2px!important;
  background:var(--excel-ribbon)!important;color:#333!important;
  font-size:11px!important;padding:2px 8px!important;
}
body.excel-mode .chip.on{
  background:var(--excel-hilite)!important;color:var(--excel-dark)!important;
  border-color:var(--excel-green)!important;font-weight:700!important;
}

/* ── 정산/통계 ── */
body.excel-mode .stat-card{
  background:var(--excel-hilite)!important;
  border:1px solid #b6d7a8!important;border-radius:0!important;
}
body.excel-mode .av{
  background:var(--excel-hilite)!important;border:1px solid #b6d7a8!important;
  color:var(--excel-green)!important;border-radius:2px!important;
}

/* ── 홈/카드 ── */
body.excel-mode .trip-card{
  background:#fff!important;border:none!important;
  border-bottom:1px solid #e0e0e0!important;border-radius:0!important;margin:0!important;
}
body.excel-mode .copy-btn{
  background:var(--excel-hilite)!important;border:1px solid var(--excel-green)!important;
  color:var(--excel-green)!important;border-radius:2px!important;
}

/* ── 채팅 ── */
body.excel-mode .chat-bubble{background:var(--excel-green)!important;}
body.excel-mode .chat-win{background:#fff!important;border-color:var(--excel-border)!important;border-radius:2px!important;}
body.excel-mode .chat-hd{background:var(--excel-hilite)!important;border-color:#b6d7a8!important;}
body.excel-mode .chat-msg.me{background:var(--excel-green)!important;color:#fff!important;border-radius:2px!important;}
body.excel-mode .chat-msg.other{background:var(--excel-hilite)!important;border-color:#b6d7a8!important;color:#000!important;border-radius:2px!important;}
body.excel-mode .chat-inp button{background:var(--excel-green)!important;}
body.excel-mode .chat-inp input{border-radius:0!important;}

/* ── lbl, 텍스트 ── */
body.excel-mode .lbl{font-size:10px!important;color:#555!important;text-transform:uppercase!important;letter-spacing:.3px!important;}
body.excel-mode .loading{background:#fff!important;}
body.excel-mode .page{background:#fff!important;}
body.excel-mode *{font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif!important;}

/* ── 채팅 ── */
.chat-bubble{position:fixed;bottom:24px;right:20px;z-index:100;width:48px;height:48px;border-radius:50%;background:var(--A);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:transform .15s}
.chat-bubble:active{transform:scale(.92)}
.chat-bubble .badge{position:absolute;top:-2px;right:-2px;background:#e53e3e;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;display:none}
.chat-bubble .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;background:#22c55e;border-radius:50%;display:none;border:2px solid #fff}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.chat-bubble .dot.active{display:block;animation:dotPulse 1.2s ease-in-out infinite}
.chat-win{position:fixed;z-index:200;background:var(--card);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.15);display:none;flex-direction:column}
@media(min-width:600px){
  .chat-win{bottom:84px;right:20px;width:320px;height:440px;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.18);}
  .chat-bubble{bottom:20px;right:20px;}
}
@media(max-width:599px){
  .chat-win{
    bottom:80px;right:12px;left:12px;
    height:55vh;
    border-radius:16px;
    position:fixed;
    max-height:55vh;
    transform:translateZ(0);
  }
  .chat-bubble{bottom:16px;right:16px;}
  .chat-msgs{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;}
  .chat-inp input{font-size:16px!important;}
  #tab-chat{display:flex;flex-direction:column;height:calc(100dvh - 92px)!important}
  #tab-chat .chat-inp{position:sticky;bottom:0;background:var(--card);}
}
.chat-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-radius:20px 20px 0 0}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-row{display:flex;flex-direction:column;gap:2px}
.chat-row.me{align-items:flex-end}
.chat-row.other{align-items:flex-start}
.chat-row-inner{display:flex;align-items:flex-end;gap:3px}
.chat-row.me .chat-row-inner{flex-direction:row-reverse}
.chat-msg{max-width:80%;padding:7px 12px;border-radius:10px;font-size:13px;line-height:1.4;word-break:break-word;width:fit-content}
.chat-msg.me{background:#7a4e0d;color:#fff;border-radius:18px 18px 4px 18px}
.chat-msg.other{background:#f0e8d8;border:1px solid var(--bm);color:#2d1a00;border-radius:18px 18px 18px 4px}

.chat-inp{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}

  const isArr = keys.length > 0 && keys.every(k => /^\d+$/.test(k));
  if (isArr) { const arr = []; keys.forEach(k => arr[parseInt(k)] = fixArrays(obj[k])); return arr; }
  const result = {}; keys.forEach(k => result[k] = fixArrays(obj[k])); return result;
}

async function getToken() {
  try { if (auth.currentUser) return await auth.currentUser.getIdToken(); } catch(e) {}
  return null;
}

async function dbGet(k) {
  try {
    var token = await getToken();
    var r = await fetch(FB + '/' + fbKey(k) + '.json' + (token ? '?auth=' + token : ''));
    if (!r.ok) return null;
    var raw = await r.json();
    return raw !== null ? fixArrays(raw) : null;
  } catch(e) { return null; }
}

async function dbSet(k, v) {
  try {
    var token = await getToken();
    await fetch(FB + '/' + fbKey(k) + '.json' + (token ? '?auth=' + token : ''), {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(v)
    });
  } catch(e) { showToast('저장 실패. 인터넷 연결을 확인해주세요 📶'); }
}

async function dbPatch(k, v) {
  try {
    var token = await getToken();
    await fetch(FB + '/' + fbKey(k) + '.json' + (token ? '?auth=' + token : ''), {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(v)
    });
  } catch(e) {}
}

function autoPopulateDays(t) {
  if(!t.startDate||(t.itinerary&&t.itinerary.length>0)) return t;

  var cur=new Date(start),i=1;
  while(cur<=end&&i<=31){ t.itinerary.push({id:uid(),label:i+'일차',date:cur.toISOString().split('T')[0],activities:[],auto:true}); cur.setDate(cur.getDate()+1); i++; }
  return t;
}

        var ov = document.getElementById('chat-tab-overlay');

  if(n==='chat') renderChatTab();
  else renderTabSafe(n);
}

// ── 스크롤 숨김/보임 ──
(function(){
  var lastY = 0;
  var ticking = false;
  var hidden = false;
  var tabsOnly = false;

  // 채팅탭 내부 스크롤도 감지
  document.addEventListener('scroll', handleScroll, true);

  function handleScroll(e) {
    var target = e.target;
    if (target && target.id === 'chat-msgs-tab') {
      var hd = document.querySelector('.trip-hd');
      var tabs = document.querySelector('.tabs');
      if (!hd || !tabs) return;
      var hdH = hd.offsetHeight;
      if (target.scrollTop < 30) {
        hd.style.transform = '';
        tabs.style.transform = '';
        tabs.style.top = '';
        hidden = false;
      }
    }
  }

  window.addEventListener('scroll', function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var y = window.scrollY;
      var hd = document.querySelector('.trip-hd');
      var tabs = document.querySelector('.tabs');
      if(!hd || !tabs) { ticking=false; return; }
      var hdH = hd.offsetHeight;
      var tabsH = tabs.offsetHeight;
      var atTop = y <= 4;
      if(atTop) {
        hd.style.transform = '';
        tabs.style.transform = '';
        hidden = false;
        tabsOnly = false;
      } else if(y > lastY && y > 60 && !hidden && !tabsOnly) {
        // 아래로 → 둘 다 숨김
        hd.style.transform = 'translateY(-' + (hdH + tabsH) + 'px)';
        tabs.style.transform = 'translateY(-' + (hdH + tabsH) + 'px)';
        hidden = true;
        tabsOnly = false;
      } else if(y > lastY && y > 60 && tabsOnly) {
        // 탭바만 보이다 다시 아래로
        hd.style.transform = 'translateY(-' + (hdH + tabsH) + 'px)';
        tabs.style.transform = 'translateY(-' + (hdH + tabsH) + 'px)';
        hidden = true;
        tabsOnly = false;
      } else if(y < lastY && hidden) {
        // 위로 → 탭바만 보임
        hd.style.transform = 'translateY(-' + hdH + 'px)';
        tabs.style.transform = 'translateY(-' + hdH + 'px)';
        hidden = false;
        tabsOnly = true;
      }
      lastY = y;
      ticking = false;
    });
  }, {passive:true});
})();

// ══ 일정 드래그 ══
var dragState = null;
var dragGhost = null;
var dropTargetId = null;

function startDrag(dayId, actId, e) {
  e.preventDefault();
  var day = S.trip.itinerary.find(function(d){ return d.id===dayId; });
  var act = day && day.activities.find(function(a){ return a.id===actId; });
  if (!act) return;
  dragState = { dayId:dayId, actId:actId, act:JSON.parse(JSON.stringify(act)), dropBeforeActId:null };
  // 고스트 생성
  dragGhost = document.createElement('div');
  dragGhost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;opacity:.85;min-width:200px;max-width:320px;background:#fff;border:2px solid var(--A);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-family:inherit;';
  dragGhost.innerHTML = '<div style="display:flex;align-items:center;gap:8px">'
    + (act.time ? '<span style="font-size:12px;color:var(--A);font-weight:700;flex-shrink:0">'+act.time+'</span>' : '')
    + '<span style="font-size:14px;font-weight:700">'+act.title+'</span></div>'
    + (act.location ? '<p style="font-size:12px;color:#8A6B52;margin-top:4px">📍 '+act.location+'</p>' : '');
  document.body.appendChild(dragGhost);
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  posGhost(cx, cy);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchmove', onDragMove, {passive:false});
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchend', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  if (e.cancelable) e.preventDefault();
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  posGhost(cx, cy);
}

function posGhost(x, y) {
  if (!dragGhost) return;
  dragGhost.style.left = (x+16)+'px';
  dragGhost.style.top = (y-16)+'px';
  // 플레이스홀더 제거
  document.querySelectorAll('.drag-placeholder').forEach(function(p){ p.remove(); });
  dragGhost.style.display = 'none';
  var el = document.elementFromPoint(x, y);
  dragGhost.style.display = '';
  var targetRow = el && el.closest('.act-row');
  var targetZone = el && el.closest('[data-drop-day]');
  var newDayId = targetZone ? targetZone.dataset.dropDay : null;
  // 이전 강조 제거
  document.querySelectorAll('.day-card').forEach(function(c){ c.style.border=''; c.style.background=''; });
  if (newDayId && newDayId !== dragState.dayId) {
    var dayCard = document.querySelector('[data-drop-day="'+newDayId+'"]');
    if (dayCard) { dayCard.style.border='2px solid var(--A)'; dayCard.style.background='var(--AX)'; }
  }
  if (targetRow && targetRow.dataset.actId !== dragState.actId) {
    var ph = document.createElement('div');
    ph.className = 'drag-placeholder';
    ph.style.cssText = 'height:4px;background:var(--A);border-radius:2px;margin:2px 0;opacity:.8;';
    targetRow.parentNode.insertBefore(ph, targetRow);
    dropTargetId = newDayId || dragState.dayId;
    dragState.dropBeforeActId = targetRow.dataset.actId;
  } else {
    dropTargetId = newDayId;
    dragState.dropBeforeActId = null;
  }
}

function onDragEnd(e) {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  document.removeEventListener('touchend', onDragEnd);
  if (dragGhost) { dragGhost.remove(); dragGhost=null; }
  document.querySelectorAll('.drag-placeholder').forEach(function(p){ p.remove(); });
  document.querySelectorAll('.day-card').forEach(function(c){ c.style.border=''; c.style.background=''; });
  if (!dragState) return;
  var srcDay = S.trip.itinerary.find(function(d){ return d.id===dragState.dayId; });
  if (dropTargetId && dropTargetId !== dragState.dayId) {
    var dstDay = S.trip.itinerary.find(function(d){ return d.id===dropTargetId; });
    if (srcDay && dstDay) {
      srcDay.activities = srcDay.activities.filter(function(a){ return a.id!==dragState.actId; });
      if (dragState.dropBeforeActId) {
        var bi = dstDay.activities.findIndex(function(a){ return a.id===dragState.dropBeforeActId; });
        if (bi>=0) dstDay.activities.splice(bi, 0, dragState.act);
        else dstDay.activities.push(dragState.act);
      } else { dstDay.activities.push(dragState.act); }
      dbSet('trip:'+S.code, S.trip); renderSchedule(); showToast('일정을 이동했어요');
    }
  } else if (dragState.dropBeforeActId && dragState.dropBeforeActId !== dragState.actId) {
    if (srcDay) {
      var acts = srcDay.activities;
      var fi = acts.findIndex(function(a){ return a.id===dragState.actId; });
      var ni = acts.findIndex(function(a){ return a.id===dragState.dropBeforeActId; });
      if (fi>=0 && ni>=0) {
        acts.splice(fi, 1);
        var ni2 = acts.findIndex(function(a){ return a.id===dragState.dropBeforeActId; });
        acts.splice(ni2, 0, dragState.act);
        dbSet('trip:'+S.code, S.trip); renderSchedule(); 
      }
    }
  }
  dragState = null; dropTargetId = null;
}

function toggleDF(){openDayForm=!openDayForm;renderSchedule();}
function toggleAF(id){if(openActForms.has(id))openActForms.delete(id);else openActForms.add(id);renderSchedule();}
function addDay(){
  var lbl=(document.getElementById('df-label').value.trim())||(S.trip.itinerary.length+1+'일차');
  S.trip.itinerary.push({id:uid(),label:lbl,date:document.getElementById('df-date').value,activities:[]});
  S.trip.itinerary.sort(function(a,b){if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date);});
  openDayForm=false; dbSet('trip:'+S.code,S.trip); renderSchedule();
}
function removeDay(id){openActForms.delete(id);S.trip.itinerary=S.trip.itinerary.filter(function(d){return d.id!==id;});dbSet('trip:'+S.code,S.trip);renderSchedule();}
function addAct(dayId){
  var titleEl=document.getElementById('an-'+dayId); if(!titleEl) return;
  var title=titleEl.value.trim(); if(!title) return;
  var day=S.trip.itinerary.find(function(d){return d.id===dayId;});
  if(day) {
    var newAct = {id:uid(),time:(document.getElementById('at-'+dayId)||{}).value||'',title:title,location:(document.getElementById('al-'+dayId)||{}).value||'',note:(document.getElementById('am-'+dayId)||{}).value||''};
    if(newAct.time) {
      // 시간 있으면 적절한 위치에 삽입
      var insertIdx = day.activities.length;
      for(var i=0;i<day.activities.length;i++){
        if(day.activities[i].time && day.activities[i].time > newAct.time){insertIdx=i;break;}
      }
      day.activities.splice(insertIdx, 0, newAct);
    } else {
      day.activities.push(newAct);
    }
  }
  openActForms.delete(dayId); actMoreFields.delete(dayId+'_loc'); actMoreFields.delete(dayId+'_note');
  dbSet('trip:'+S.code,S.trip); renderSchedule();
}
function removeAct(dayId,actId){var day=S.trip.itinerary.find(function(d){return d.id===dayId;});if(day)day.activities=day.activities.filter(function(a){return a.id!==actId;});dbSet('trip:'+S.code,S.trip);renderSchedule();}
function fmtTime(input){var v=input.value.replace(/[^0-9]/g,'');if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2,4);input.value=v;}
function toggleMoreFields(key){
  actMoreFields.add(key);
  var dayId=key.replace('_loc','').replace('_note','');
  var field=document.getElementById((key.endsWith('_loc')?'loc-field-':'note-field-')+dayId);
  if(field)field.style.display='block';
  var parent=field&&field.parentElement;
  if(parent)parent.querySelectorAll('button').forEach(function(btn){if((key.endsWith('_loc')&&btn.textContent.includes('장소'))||(key.endsWith('_note')&&btn.textContent.includes('메모')))btn.style.display='none';});
}
function showEditField(btn, inputId, label) {
  btn.parentElement.innerHTML = '<label class="lbl">'+label+'</label><input id="'+inputId+'" placeholder="'+(label==='장소'?'한라산 국립공원':'준비물, 예약번호...')+'" autocomplete="off">';
  var inp = document.getElementById(inputId);
  if (inp) inp.focus();
}

function startEditAct(key){editActState[key]=true;renderSchedule();}
function cancelEditAct(key){delete editActState[key];renderSchedule();}
function saveEditAct(dayId,actId,key){
  var title=(document.getElementById('en-'+key)||{}).value;
  if(!title||!title.trim()) return;
  var day=S.trip.itinerary.find(function(d){return d.id===dayId;});
  var act=day&&day.activities.find(function(a){return a.id===actId;});
  if(act){act.title=title.trim();act.time=(document.getElementById('et-'+key)||{}).value||'';act.location=(document.getElementById('el-'+key)||{}).value||'';act.note=(document.getElementById('em-'+key)||{}).value||'';}
  delete editActState[key];
  // 시간 수정 후 재정렬
  dbSet('trip:'+S.code,S.trip); renderSchedule();
}

// 모바일 탭 스와이프
(function(){
  var tabOrder = ['schedule','expenses','chat','settings'];
  var touchStartX = 0;
  var touchStartY = 0;

  document.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(!document.getElementById('s-trip') || document.getElementById('s-trip').style.display==='none') return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)*0.8) return;
    // 채팅 입력창이나 슬라이더 조작 중 무시
    var target = e.target;
    if(target.closest('#chat-msgs-tab') || target.closest('.chat-inp') || target.closest('#settle-slider')) return;
    var curTab = (document.querySelector('.tab.on')||{}).dataset;
    var cur = curTab && curTab.tab || 'schedule';
    // 채팅탭이 숨겨진 경우 제외
    var visibleTabs = tabOrder.filter(function(t){
      if(t==='chat') return document.getElementById('chat-tab-btn') && document.getElementById('chat-tab-btn').style.display!=='none';
      return true;
    });
    var idx = visibleTabs.indexOf(cur);
    if(dx < -60 && idx < visibleTabs.length-1) switchTab(visibleTabs[idx+1]);
    else if(dx > 60 && idx > 0) switchTab(visibleTabs[idx-1]);
  }, {passive:true});
})();

var expDragState = null;
var expDragGhost = null;

function startExpDrag(e, expId, gkey) {
  e.preventDefault();
  var exp = (S.trip.expenses||[]).find(function(ex){return ex.id===expId;});
  if (!exp) return;
  expDragState = { expId:expId, gkey:gkey, exp:JSON.parse(JSON.stringify(exp)) };

  expDragGhost = document.createElement('div');
  expDragGhost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;opacity:.85;min-width:180px;max-width:300px;background:var(--card);border:2px solid var(--A);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-family:inherit;font-size:14px;font-weight:700;';
  expDragGhost.textContent = exp.title + ' · ' + exp.amount.toLocaleString() + '원';
  document.body.appendChild(expDragGhost);

  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  posExpGhost(cx, cy);

  document.addEventListener('mousemove', onExpDragMove);
  document.addEventListener('touchmove', onExpDragMove, {passive:false});
  document.addEventListener('mouseup', onExpDragEnd);
  document.addEventListener('touchend', onExpDragEnd);
}

function onExpDragMove(e) {
  if (!expDragState) return;
  if (e.cancelable) e.preventDefault();
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cy = e.touches ? e.touches[0].clientY : e.clientY;
  posExpGhost(cx, cy);
}

function posExpGhost(x, y) {
  if (!expDragGhost) return;
  expDragGhost.style.left = (x+12) + 'px';
  expDragGhost.style.top = (y-16) + 'px';

  // 플레이스홀더 제거
  document.querySelectorAll('.exp-drag-placeholder').forEach(function(p){p.remove();});

  expDragGhost.style.display = 'none';
  var el = document.elementFromPoint(x, y);
  expDragGhost.style.display = '';

  var targetCard = el && el.closest('[data-exp-id]');
  if (targetCard && targetCard.dataset.expId !== expDragState.expId &&
      targetCard.dataset.expGkey === expDragState.gkey) {
    var ph = document.createElement('div');
    ph.className = 'exp-drag-placeholder';
    ph.style.cssText = 'height:3px;background:var(--A);border-radius:2px;margin:2px 0;';
    targetCard.parentNode.insertBefore(ph, targetCard);
    expDragState.dropBeforeId = targetCard.dataset.expId;
  } else {
    expDragState.dropBeforeId = null;
  }
}

function onExpDragEnd(e) {
  document.removeEventListener('mousemove', onExpDragMove);
  document.removeEventListener('touchmove', onExpDragMove);
  document.removeEventListener('mouseup', onExpDragEnd);
  document.removeEventListener('touchend', onExpDragEnd);
  document.querySelectorAll('.exp-drag-placeholder').forEach(function(p){p.remove();});
  if (expDragGhost) { expDragGhost.remove(); expDragGhost = null; }
  if (!expDragState) return;

  if (expDragState.dropBeforeId && expDragState.dropBeforeId !== expDragState.expId) {
    var exps = S.trip.expenses;
    var fi = exps.findIndex(function(ex){return ex.id===expDragState.expId;});
    var ti = exps.findIndex(function(ex){return ex.id===expDragState.dropBeforeId;});
    if (fi>=0 && ti>=0) {
      var moved = exps.splice(fi, 1)[0];
      var ni = exps.findIndex(function(ex){return ex.id===expDragState.dropBeforeId;});
      exps.splice(ni, 0, moved);
      dbSet('trip:'+S.code, S.trip);
      renderExpenses();
      
    }
  }
  expDragState = null;
}

async function saveNick() {
  var inp = document.getElementById('new-nick-input');
  if (!inp) return;
  var newNick = inp.value.trim();
  if (!newNick) return showToast('닉네임을 입력해주세요');
  if (newNick === S.me) return showToast('현재 닉네임과 동일해요');
  var nicks = getNicks();
  if (nicks.indexOf(newNick) >= 0) return showToast('이미 사용 중인 닉네임이에요');
  var used = (S.trip.nickChanges && S.trip.nickChanges[S.user.uid]) || 0;
  if (used >= 3) return showToast('변경 횟수를 모두 사용했어요');
  var oldNick = S.me;
  // 멤버 닉네임 변경
  S.trip.members = S.trip.members.map(function(m){
    if (typeof m === 'object' && m.uid === S.user.uid) m.nickname = newNick;
    return m;
  });
  // 지출 기록 닉네임 변경
  (S.trip.expenses||[]).forEach(function(e){
    if (e.paidBy === oldNick) e.paidBy = newNick;
    if (e.split) e.split = e.split.map(function(n){ return n===oldNick?newNick:n; });
  });
  // 변경 횟수 기록
  if (!S.trip.nickChanges) S.trip.nickChanges = {};
  S.trip.nickChanges[S.user.uid] = used + 1;
  // 채팅 닉네임 변경
  try {
    var token = await getToken();
    var r = await fetch(FB+'/chat_'+S.code+'.json?auth='+token);
    if (r.ok) {
      var chats = await r.json();
      if (chats) {
        var updates = {};
        Object.keys(chats).forEach(function(k){
          if (chats[k].nickname === oldNick) {
            updates[k+'/nickname'] = newNick;
          }
        });
        if (Object.keys(updates).length > 0) {
          await fetch(FB+'/chat_'+S.code+'.json?auth='+token, {
            method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(updates)
          });
        }
      }
    }
  } catch(e) {}
  // user-trips 닉네임 업데이트
  var token2 = await getToken();
  await fetch(FB+'/user-trips_'+S.user.uid+'/'+S.code+'/nickname.json?auth='+token2, {

  });

function renderSettlePanelHTML(){

  var slider=document.getElementById('settle-slider');

    });

  var catIcons={'식비':'tools-kitchen-2','숙박':'bed','교통':'car','관광':'camera','쇼핑':'shopping-cart','기타':'music'};
  var catTotals={};
  exps.forEach(function(e){ catTotals[e.cat||'기타']=(catTotals[e.cat||'기타']||0)+e.amount; });
  var catList=Object.keys(catTotals).sort(function(a,b){return catTotals[b]-catTotals[a];});

  // 잔액 계산
  var bal={};
  nicks.forEach(function(n){bal[n]=0;});
  exps.forEach(function(e){
    if(e.paidBy==='individual') return;
    var sl=(e.split&&e.split.length)?e.split:nicks;
    var vs=sl.filter(function(n){return bal.hasOwnProperty(n);});
    if(!vs.length) vs=nicks;
    var sh=e.amount/vs.length;
    vs.forEach(function(n){bal[n]-=sh;});
    if(bal.hasOwnProperty(e.paidBy)) bal[e.paidBy]+=e.amount;
  });
  var pos=[],neg=[];
  Object.keys(bal).forEach(function(n){
    if(bal[n]>0.5) pos.push([n,bal[n]]);
    else if(bal[n]<-0.5) neg.push([n,-bal[n]]);
  });
  pos.sort(function(a,b){return b[1]-a[1];});
  neg.sort(function(a,b){return b[1]-a[1];});
  var txns=[];
  while(pos.length&&neg.length){
    var a=Math.min(pos[0][1],neg[0][1]);
    txns.push({from:neg[0][0],to:pos[0][0],amount:Math.round(a)});
    pos[0][1]-=a; neg[0][1]-=a;
    if(pos[0][1]<0.5) pos.shift();
    if(neg[0][1]<0.5) neg.shift();
  }
  var total=exps.reduce(function(s,e){return s+e.amount;},0);
  var paid={};
  nicks.forEach(function(n){paid[n]=0;});
  exps.forEach(function(e){if(e.paidBy&&e.paidBy!=='individual') paid[e.paidBy]=(paid[e.paidBy]||0)+e.amount;});

    +'<button class="bt" onclick="toggleSettle()" style="color:var(--muted);font-size:12px"><i class="ti ti-x"></i></button>'
    +'</div>';

  // 슬라이더
  h+='<div style="position:relative;overflow:hidden;margin-bottom:14px">'
    +'<div id="settle-slider" style="display:flex;transition:transform .3s ease">'
    // 패널1: 요약
    +'<div style="min-width:100%;box-sizing:border-box">'
    +'<div class="stat-grid" style="margin-bottom:0">'
    +'<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px">총 지출</div><div style="font-size:14px;font-weight:900;color:var(--A)">'+fmt(total)+'원</div></div>'
    +'<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px">인원</div><div style="font-size:14px;font-weight:900;color:var(--A)">'+nicks.length+'명</div></div>'
    +'<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px">1인당</div><div style="font-size:14px;font-weight:900;color:var(--A)">'+fmt(Math.round(total/nicks.length))+'원</div></div>'
    +'</div></div>'
    // 패널2: 카테고리 누적 바
    +'<div style="min-width:100%;box-sizing:border-box;padding:2px 0">';

  // 누적 바
  h+='<div style="height:26px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:12px">';
  catList.forEach(function(cat){
    var pct=(catTotals[cat]/total)*100;
    h+='<div style="height:100%;width:'+pct+'%;background:'+(catColors[cat]||'#888')+'"></div>';
  });
  h+='</div>';

  // 범례
  catList.forEach(function(cat){
    var pct=Math.round((catTotals[cat]/total)*100);
    var color=catColors[cat]||'#888';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">'
      +'<div style="display:flex;align-items:center;gap:6px">'
      +'<div style="width:10px;height:10px;border-radius:2px;background:'+color+';flex-shrink:0"></div>'
      +'<i class="ti ti-'+catIcons[cat]+'" style="font-size:12px;color:'+color+'"></i>'
      +'<span style="font-size:12px;font-weight:700">'+cat+'</span>'
      +'</div>'
      +'<span style="font-size:12px;color:var(--muted)">'+fmt(catTotals[cat])+'원 · '+pct+'%</span>'
      +'</div>';
  });

  h+='</div></div>'
    // 화살표

    +'<div style="display:flex;justify-content:center;gap:8px;margin-top:10px">'
    +'<div id="dot-0" onclick="goSettle(0)" style="width:20px;height:8px;border-radius:4px;background:var(--A);cursor:pointer;transition:all .2s"></div>'
    +'<div id="dot-1" onclick="goSettle(1)" style="width:8px;height:8px;border-radius:4px;background:var(--border);cursor:pointer;transition:all .2s"></div>'
    +'</div></div>';

  h+='<h3 style="font-size:15px;font-weight:900;color:var(--A);margin-top:16px;margin-bottom:8px">멤버별 결제내역</h3>';

      +'<span style="font-size:13px;font-weight:700">'+n+'</span>'

  h+='<h3 style="font-size:15px;font-weight:900;color:var(--A);margin-top:16px;margin-bottom:8px">멤버별 정산</h3>';

  } else {
    txns.forEach(function(tx){
      var key=tx.from+'_'+tx.to+'_'+tx.amount;
      var done=!!checked[key];
      h+='<div data-skey="'+key+'" onclick="toggleSettleItem(this.dataset.skey)" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer'+(done?';opacity:.6':'') +'">'
        +'<div style="width:18px;height:18px;border-radius:50%;flex-shrink:0;border:1.5px solid '+(done?'var(--ok)':'var(--border)')+';background:'+(done?'var(--ok)':'transparent')+';display:flex;align-items:center;justify-content:center">'
        +(done?'<i class="ti ti-check" style="color:#fff;font-size:9px"></i>':'')

function makeDateDivider(ts) {
  var d = new Date(ts);
  var now = new Date();
  var diff = Math.floor((now - d) / 86400000);
  var label;
  if (diff === 0) label = '오늘';
  else if (diff === 1) label = '어제';
  else label = d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일';
  var div = document.createElement('div');
  div.className = 'chat-date-divider';
  div.dataset.date = d.toDateString();
  div.style.cssText = 'display:flex;align-items:center;gap:8px;margin:8px 0;';
  div.innerHTML = '<div style="flex:1;height:1px;background:var(--border)"></div>'
    + '<span style="font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap">'+label+'</span>'
    + '<div style="flex:1;height:1px;background:var(--border)"></div>';
  return div;
}

var lastChatDate = '';

function renderChatMsg(msg, isMe) {
  var t = new Date(msg.ts);
  var timeStr = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');

  var row = document.createElement('div');
  row.className = 'chat-row ' + (isMe ? 'me' : 'other');

  // 닉네임 (상대방만)
  if (!isMe) {
    var sender = document.createElement('div');
    sender.className = 'chat-msg sender';
    sender.style.cssText = 'background:none;padding:0 4px;font-size:10px;font-weight:700;color:var(--muted)';
    sender.textContent = msg.nickname;
    row.appendChild(sender);
  }

  var inner = document.createElement('div');
  inner.className = 'chat-row-inner';

  var bubble = document.createElement('div');
  bubble.className = 'chat-msg ' + (isMe ? 'me' : 'other');
  bubble.innerHTML = '<div>' + msg.text.replace(/</g,'&lt;') + '</div>';

  var time = document.createElement('span');
  time.className = 'chat-time';
  time.textContent = timeStr;

  inner.appendChild(bubble);
  inner.appendChild(time);
  row.appendChild(inner);
  return row;
}

function requestNotifPerm() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendNotif(nickname, text) {
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    new Notification('💬 ' + nickname, {
      body: text,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text y="28" font-size="28">✈️</text></svg>'
    });
  }
}

var chatAllMsgs = [];
var chatLoadedIdx = 0;
var chatPageSize = 30;
var chatLoadingMore = false;

async function loadChatHistory(code) {
  try {
    var token = await getToken();
    var r = await fetch(FB + '/chat_' + code + '.json?auth=' + token);
    if (!r.ok) return;
    var data = await r.json();
    if (!data) return;
    chatAllMsgs = Object.values(data).sort(function(a,b){return a.ts-b.ts;});
    chatAllMsgs.forEach(function(m){ chatSeenIds[m.id] = true; });
    var container = document.getElementById('chat-msgs');
    if (!container) return;
    container.innerHTML = '';
    // 최근 30개만 먼저 표시
    var startIdx = Math.max(0, chatAllMsgs.length - chatPageSize);
    chatLoadedIdx = startIdx;
    if (startIdx > 0) {
      var loadMore = document.createElement('div');
      loadMore.id = 'chat-load-more';
      loadMore.style.cssText = 'text-align:center;padding:8px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:700';
      loadMore.textContent = '▲ 이전 메시지 보기';
      loadMore.onclick = loadMoreChat;
      container.appendChild(loadMore);
    }
    var prevDate = '';
    chatAllMsgs.slice(startIdx).forEach(function(m) {
      var d = new Date(m.ts).toDateString();
      if (d !== prevDate) {
        container.appendChild(makeDateDivider(m.ts));
        prevDate = d;
      }
      container.appendChild(renderChatMsg(m, m.nickname === S.me));
    });
    setTimeout(function(){ container.scrollTop = container.scrollHeight; }, 100);
    // 스크롤 상단 감지
    container.addEventListener('scroll', function() {
      if (container.scrollTop < 60 && chatLoadedIdx > 0 && !chatLoadingMore) {
        loadMoreChat();
      }
    });
  } catch(e) {}
}

function loadMoreChat() {
  var container = document.getElementById('chat-msgs');
  if (!container || chatLoadedIdx <= 0 || chatLoadingMore) return;
  chatLoadingMore = true;
  var prevHeight = container.scrollHeight;
  var newStartIdx = Math.max(0, chatLoadedIdx - chatPageSize);
  var msgsToAdd = chatAllMsgs.slice(newStartIdx, chatLoadedIdx);
  chatLoadedIdx = newStartIdx;
  var loadMoreBtn = document.getElementById('chat-load-more');
  // 오래된 메시지를 맨 위에 삽입
  var insertAfter = loadMoreBtn || container.firstChild;
  msgsToAdd.reverse().forEach(function(m) {
    var el = renderChatMsg(m, m.nickname === S.me);
    if (loadMoreBtn) container.insertBefore(el, loadMoreBtn.nextSibling);
    else container.insertBefore(el, container.firstChild);
  });
  // 더 없으면 버튼 제거
  if (newStartIdx <= 0 && loadMoreBtn) loadMoreBtn.remove();
  // 스크롤 위치 유지
  container.scrollTop = container.scrollHeight - prevHeight;
  chatLoadingMore = false;
}

function startChatSync(code) {
  if (chatListener) clearInterval(chatListener);
  // 새 방 입장 시 초기화
  chatSeenIds = {};
  chatAllMsgs = [];
  chatLoadedIdx = 0;
  var msgs = document.getElementById('chat-msgs');
  if (msgs) msgs.innerHTML = '';
  var msgsTab = document.getElementById('chat-msgs-tab');
  if (msgsTab) msgsTab.innerHTML = '';
  var tabChat = document.getElementById('tab-chat');
  if (tabChat) tabChat.innerHTML = '';
  requestNotifPerm();
  // 입장 시 전체 히스토리 로드
  loadChatHistory(code);
  var lastTs = Date.now();
  chatListener = setInterval(async function() {
    if (!S.code) return;
    try {
      var token = await getToken();
      var r = await fetch(FB + '/chat_' + code + '.json?auth=' + token);
      if (!r.ok) return;
      var data = await r.json();
      if (!data) return;
      var msgs = Object.values(data).sort(function(a,b){return a.ts-b.ts;});
      var newMsgs = msgs.filter(function(m){ return m.ts > lastTs && !chatSeenIds[m.id]; });
      if (!newMsgs.length) return;
      newMsgs.forEach(function(m) { chatSeenIds[m.id] = true; });
      lastTs = newMsgs[newMsgs.length-1].ts;
      var container = document.getElementById('chat-msgs');
      if (!container) return;
      newMsgs.forEach(function(m) {
        var isMe = m.nickname === S.me;
        var d = new Date(m.ts).toDateString();
        // 날짜 구분선 - 컨테이너의 마지막 구분선 날짜와 비교
        var allDivs = container.querySelectorAll('.chat-date-divider');
        var lastDiv = allDivs[allDivs.length - 1];
        if (!lastDiv || lastDiv.dataset.date !== d) {
          container.appendChild(makeDateDivider(m.ts));
        }
        container.appendChild(renderChatMsg(m, isMe));
        var tabContainer = document.getElementById('chat-msgs-tab');
        if(tabContainer) {
          var allDivsTab = tabContainer.querySelectorAll('.chat-date-divider');
          var lastDivTab = allDivsTab[allDivsTab.length - 1];
          if (!lastDivTab || lastDivTab.dataset.date !== d) tabContainer.appendChild(makeDateDivider(m.ts));
          tabContainer.appendChild(renderChatMsg(m, isMe));
          var isNearBottom = tabContainer.scrollHeight - tabContainer.scrollTop - tabContainer.clientHeight < 80;
          if (isNearBottom) tabContainer.scrollTop = tabContainer.scrollHeight;
        }
        if (!isMe) {
          if (!chatOpen) {
            chatUnread++;
            updateChatBadge();
            var curTab=(document.querySelector('.tab.on')||{}).dataset;
            var isOnChat = curTab && curTab.tab==='chat';
            var chatWinOpen = chatOpen; // PC 플로팅 창
            if (!isOnChat && !chatWinOpen) {
              // 채팅 탭도 아니고 PC창도 안 열렸을 때만 알림
              var tabDot=document.getElementById('chat-tab-dot');
              if(tabDot) tabDot.style.display='block';
              var dotEl=document.getElementById('chat-dot');
              if(dotEl) dotEl.classList.add('active');
            }
            // 브라우저 탭 백그라운드면 브라우저 알림
            sendNotif(m.nickname, m.text);
          }
        }
      });
      if (chatOpen) container.scrollTop = container.scrollHeight;
    } catch(e) { console.error('chat sync error:', e); }
  }, 2000);
}

function stopChatSync() {
  if (chatListener) { clearInterval(chatListener); chatListener = null; }
  // 채팅 메시지 초기화
  chatSeenIds = {};
  chatAllMsgs = [];
  chatLoadedIdx = 0;
  var msgs = document.getElementById('chat-msgs');
  if (msgs) msgs.innerHTML = '';
  var msgsTab = document.getElementById('chat-msgs-tab');
  if (msgsTab) msgsTab.innerHTML = '';
  // 채팅탭 재렌더 강제
  var tabChat = document.getElementById('tab-chat');
  if (tabChat) tabChat.innerHTML = '';
}

function showChatBubble(show) {
  var isMobile = window.innerWidth < 600 || (window.screen && window.screen.width < 600);
  var b = document.getElementById('chat-bubble');
  var t = document.getElementById('chat-tab-btn');
  var addBtn = document.getElementById('add-exp-btn');
  if (isMobile) {
    if (b) b.style.display = 'none';
    if (t) t.style.display = show ? 'flex' : 'none';
    if (addBtn) addBtn.style.display = 'none';
  } else {
    if (b) b.style.display = show ? 'flex' : 'none';
    if (t) t.style.display = 'none';
    if (addBtn) addBtn.style.display = show ? 'flex' : 'none';
  }
}

function renderChatTab() {
  var el = document.getElementById('tab-chat');
  if (!el) return;

  // dot 끄기
  var dot = document.getElementById('chat-tab-dot');
  if (dot) dot.style.display = 'none';
  var dotBubble = document.getElementById('chat-dot');
  if (dotBubble) dotBubble.classList.remove('active');
  chatUnread = 0;

  // 제목바 숨기고 탭바 맨 위로
  var hd = document.querySelector('.trip-hd');
  var tabs = document.querySelector('.tabs');
  if (hd) hd.style.top = '-' + (hd.offsetHeight || 60) + 'px';
  if (tabs) tabs.style.top = '0';

  // 이미 렌더됐으면 스크롤만
  if (document.getElementById('chat-msgs-tab')) {
    var m = document.getElementById('chat-msgs-tab');
    if (m) setTimeout(function(){ m.scrollTop = m.scrollHeight; }, 80);
    return;
  }

  // 채팅 컨테이너 - body 전체 활용
  el.style.cssText = '';
  el.style.display = 'block';

  // tab-chat 자체를 안 쓰고 body에 직접 오버레이 생성
  var overlay = document.getElementById('chat-tab-overlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'chat-tab-overlay';
  overlay.style.cssText = [
    'position:fixed',
    'top:46px',
    'left:0',
    'right:0',
    'bottom:0',
    'display:flex',
    'flex-direction:column',
    'background:var(--bg)',
    'z-index:25'
  ].join(';');

  overlay.innerHTML =
    '<div id="chat-msgs-tab" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;"></div>'
    + '<div id="chat-inp-tab" style="display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;">'
    + '<input id="chat-input-tab" placeholder="메시지를 입력하세요..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1;height:42px;border-radius:24px;font-size:16px;padding:0 16px;border:1.5px solid var(--border);background:var(--card);color:var(--text);outline:none;-webkit-appearance:none;">'
    + '<button onclick="sendChatTab()" style="width:42px;height:42px;border-radius:50%;background:var(--A);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-arrow-up" style="font-size:18px;color:#fff;font-weight:900"></i></button>'
    + '</div>';

  document.body.appendChild(overlay);

  // 기존 메시지 복사
  var srcMsgs = document.getElementById('chat-msgs');
  var dstMsgs = document.getElementById('chat-msgs-tab');
  if (srcMsgs && dstMsgs) {
    Array.from(srcMsgs.children).forEach(function(child){
      dstMsgs.appendChild(child.cloneNode(true));
    });
  }
  setTimeout(function(){
    var m = document.getElementById('chat-msgs-tab');
    if (m) m.scrollTop = m.scrollHeight;
  }, 80);

  // iOS 키보드 - visualViewport로 오버레이 높이 조정
  if (window.visualViewport) {
    var onVV = function() {
      var ov = document.getElementById('chat-tab-overlay');
      if (!ov) return;
      var vvH = window.visualViewport.height;
      // 탭바 항상 맨 위 고정
      var tabs = document.querySelector('.tabs');
      if (tabs) { tabs.style.top = '0'; tabs.style.transform = 'none'; }
      // overlay: 탭바(46px) 아래~키보드 위까지
      ov.style.position = 'fixed';
      ov.style.top = '46px';
      ov.style.height = (vvH - 46) + 'px';
      ov.style.bottom = 'auto';
      var msgs = document.getElementById('chat-msgs-tab');
      if (msgs) msgs.scrollTop = msgs.scrollHeight;
    };
    window.visualViewport.addEventListener('resize', onVV);
    window.visualViewport.addEventListener('scroll', onVV);
    overlay._vv = onVV;
  }
}

async function sendChatTab() {
  var inp = document.getElementById('chat-input-tab');
  if (!inp) return;
  var text = inp.value.trim();
  if (!text || !S.code || !S.me) return;
  inp.value = '';
  inp.focus();
  var msg = { id: uid(), nickname: S.me, text: text, ts: Date.now() };
  chatSeenIds[msg.id] = true;
  // 탭 메시지 컨테이너에 추가
  var container = document.getElementById('chat-msgs-tab') || document.getElementById('chat-msgs');
  if (container) { container.appendChild(renderChatMsg(msg, true)); container.scrollTop = container.scrollHeight; }
  var token = await getToken();
  await fetch(FB + '/chat_' + S.code + '/' + msg.id + '.json?auth=' + token, {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(msg)
  });
}

</script>
