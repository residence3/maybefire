<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>같이 가자 ✈️</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F7F3EE;--card:#fff;--border:#E5D9CC;--bm:#D4C4B2;--text:#1A0F05;--muted:#8A6B52;--A:#BA7517;--AX:#FAF0D7;--AL:#FAC775;--ok:#1A7A5A;--no:#CC3333;--r:12px;--rl:16px}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
input,button,textarea{font-family:inherit;font-size:16px}
input,textarea{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;height:50px}
textarea{height:auto;min-height:80px}
input:focus,textarea:focus{border-color:var(--A);box-shadow:0 0 0 3px rgba(186,117,23,.12)}
input[type=date]{color:var(--text)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=password]{letter-spacing:.1em}
.bp{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--A);color:#412402;border:none;border-radius:var(--r);padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s,transform .1s}
.bp:active{opacity:.85;transform:scale(.98)}
.bp:disabled{opacity:.5;cursor:default;transform:none}
.bg{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--muted);border:1.5px solid var(--bm);border-radius:var(--r);padding:13px 18px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;font-family:inherit}
.bg:active{background:#f0ebe4}
.bt{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px 8px;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.bd{background:none;border:none;color:var(--no);cursor:pointer;font-size:14px;padding:6px 8px;opacity:.7;font-family:inherit}
.bd:active{opacity:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;letter-spacing:.2px}
.err{background:#FEE8E8;color:#B22222;border-radius:10px;padding:12px 14px;font-size:14px;display:none;margin-bottom:10px;line-height:1.5}
.chip{border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;background:transparent;color:var(--muted);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:4px;transition:all .15s;font-family:inherit}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--AX);color:var(--A);border-color:var(--A)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;height:46px}
.tab{flex:1;border:none;background:none;padding:13px 4px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-family:inherit}
.tab.on{color:var(--A);border-bottom-color:var(--A)}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--bg)}
.page.top{justify-content:flex-start;padding-top:3rem}
.fw{width:100%;max-width:420px}
.bw{display:flex;justify-content:space-between;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--A);flex-shrink:0}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.35}
.empty p{font-size:14px;line-height:1.6}
.code-box{background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--rl);padding:16px 18px}
.big-code{font-size:22px;font-weight:900;letter-spacing:5px;color:var(--A);margin:4px 0 2px;word-break:break-all}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:#f5f0ea;border-radius:var(--r);padding:12px 8px;text-align:center}
.trip-hd{background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:30}
.content{padding:14px 14px 2rem;max-width:600px;margin:0 auto}
.act-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:flex-start}
.date-range{background:#fff;border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.date-range-row{display:grid;grid-template-columns:1fr 1px 1fr}
.date-range input{border:none;border-radius:0;box-shadow:none;padding:13px 12px;background:transparent;height:auto}
.date-range input:focus{border:none;box-shadow:none;background:var(--AX)}
.date-range-div{background:var(--border);width:1px}
.copy-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(186,117,23,.12);border:1.5px solid var(--AL);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--A);cursor:pointer;font-family:inherit;width:100%;transition:background .15s}
.copy-btn:active{background:rgba(186,117,23,.22)}
.trip-card{background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;align-items:center;gap:14px}
.trip-card:active{border-color:var(--A);box-shadow:0 2px 12px rgba(186,117,23,.15)}
.loading{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
[id^="s-"]{display:none}
#s-loading{display:flex}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes takeoff{
  0%{transform:translate(0,0);opacity:1;}
  70%{transform:translate(50px,-50px);opacity:.7;}
  100%{transform:translate(90px,-90px);opacity:0;}
}
@keyframes taxiIn{
  0%{transform:translate(-20px,10px) rotate(-5deg);opacity:0;}
  100%{transform:translate(0,0) rotate(-10deg);opacity:1;}
}
.plane-loader{
  position:relative;
  width:80px;height:80px;
  display:flex;align-items:center;justify-content:center;
}
.plane-loader .plane{
  font-size:44px;
  animation:takeoff 1.4s ease-in infinite;
  display:block;
}
.plane-loader .runway{
  position:absolute;
  bottom:0px;left:50%;transform:translateX(-50%);
  width:70px;height:3px;
  background:linear-gradient(90deg,transparent,var(--A),transparent);
  border-radius:2px;
  animation:runwayPulse 1.4s ease-in infinite;
}
@keyframes runwayPulse{
  0%{opacity:.8;width:60px;}
  60%{opacity:.4;width:80px;}
  100%{opacity:0;width:40px;}
}
@media(max-width:380px){.big-code{font-size:18px;letter-spacing:3px}.tab{font-size:12px;gap:3px}}

/* ── 다크 테마 ── */
body.dark-mode{–bg:#1a1a2e;–card:#16213e;–border:#2a2a4a;–bm:#3a3a5a;–text:#e8e8f0;–muted:#8888aa;–A:#a78bfa;–AX:#2d2550;–AL:#6d5fd0;–ok:#34d399;–no:#f87171;–r:12px;–rl:16px}
body.dark-mode .tabs{background:#16213e!important;border-bottom:1px solid #2a2a4a!important}
body.dark-mode .tab.on{color:var(–A)!important;border-bottom-color:var(–A)!important}
body.dark-mode .trip-hd{background:#16213e!important;border-bottom:1px solid #2a2a4a!important}
body.dark-mode input,body.dark-mode textarea{background:#0f0f23!important;color:#e8e8f0!important;border-color:#2a2a4a!important}
body.dark-mode .copy-btn{background:rgba(167,139,250,.12)!important;border-color:var(–AL)!important}
body.dark-mode .chip{background:#0f0f23!important;color:var(–muted)!important}
body.dark-mode .trip-card{background:#16213e!important}
body.dark-mode .loading{background:#1a1a2e!important}
/* ── 블루 테마 ── */
body.blue-mode{–bg:#EEF4FF;–card:#fff;–border:#C7D8F8;–bm:#9BB8EE;–text:#0D1B4B;–muted:#4A6BB5;–A:#2563EB;–AX:#DBEAFE;–AL:#93C5FD;–ok:#059669;–no:#DC2626;–r:12px;–rl:16px}
body.blue-mode .tabs{background:#1D4ED8!important;border-bottom:1px solid #1E40AF!important}
body.blue-mode .tab{color:rgba(255,255,255,.8)!important}
body.blue-mode .tab.on{color:#fff!important;border-bottom-color:#fff!important}
body.blue-mode .trip-hd{background:#1D4ED8!important;border-bottom:none!important}
body.blue-mode #trip-name,body.blue-mode #trip-dates,body.blue-mode #trip-me{color:#fff!important}
body.blue-mode .copy-btn{background:rgba(37,99,235,.1)!important}

/* ── 엑셀 테마 ── */
body.excel-mode {
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
background: #fff !important;
color: #000 !important;
}
/* 포뮬라 바 */
body.excel-mode::before {
content: ‘’;
display: block;
}
body.excel-mode .trip-hd {
background: #f2f2f2 !important;
border-bottom: none !important;
padding: 0 !important;
}
body.excel-mode .trip-hd > .bw {
background: #e8e8e8 !important;
border-bottom: 1px solid #bbb !important;
padding: 3px 6px !important;
font-size: 11px !important;
}
body.excel-mode #trip-name {
font-size: 12px !important;
color: #000 !important;
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
font-weight: 400 !important;
}
body.excel-mode #trip-dates, body.excel-mode #trip-me {
font-size: 10px !important; color: #666 !important;
}
/* 포뮬라 바 효과 */
body.excel-mode #code-panel {
background: #fff !important;
border: none !important;
border-bottom: 1px solid #bbb !important;
border-radius: 0 !important;
padding: 2px 8px !important;
font-size: 11px !important;
display: flex !important;
align-items: center !important;
gap: 6px !important;
}
body.excel-mode #code-panel::before {
content: ‘fx’;
color: #217346;
font-weight: 700;
font-size: 13px;
font-style: italic;
border-right: 1px solid #bbb;
padding-right: 6px;
}
/* 리본 탭 */
body.excel-mode .tabs {
background: #217346 !important;
border-bottom: 2px solid #185a2e !important;
height: 46px !important;
}
body.excel-mode .tab {
color: rgba(255,255,255,0.85) !important;
font-size: 11px !important;
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
border-bottom: none !important;
padding: 6px 14px !important;
border-radius: 0 !important;
letter-spacing: 0 !important;
border-right: 1px solid rgba(255,255,255,0.15) !important;
}
body.excel-mode .tab.on {
background: #fff !important;
color: #217346 !important;
font-weight: 700 !important;
border-top: 2px solid #217346 !important;
margin-top: -2px !important;
}
/* 행/열 헤더 */
body.excel-mode .content {
background: #fff !important;
padding: 0 !important;
}
body.excel-mode #tab-schedule,
body.excel-mode #tab-expenses,
body.excel-mode #tab-settings {
min-height: 60vh;
}
/* 셀 그리드 */
body.excel-mode .card {
background: #fff !important;
border: none !important;
border-bottom: 1px solid #d0d7be !important;
border-right: 1px solid #d0d7de !important;
border-radius: 0 !important;
margin: 0 !important;
padding: 4px 8px 4px 32px !important;
box-shadow: none !important;
position: relative !important;
}
/* 행 번호 */
body.excel-mode .card::before {
content: attr(data-row);
position: absolute;
left: 0;
top: 0;
bottom: 0;
width: 28px;
background: #f2f2f2;
border-right: 1px solid #bbb;
display: flex;
align-items: center;
justify-content: center;
font-size: 10px;
color: #666;
font-family: ‘Calibri’,‘Arial’,sans-serif;
}
body.excel-mode .card:nth-child(even) {
background: #fff !important;
}
body.excel-mode .card:nth-child(odd) {
background: #fff !important;
}
/* 선택된 셀 효과 */
body.excel-mode .card:focus-within {
outline: 2px solid #0070C0 !important;
z-index: 1 !important;
}
/* 섹션 제목 → 열 헤더 */
body.excel-mode h3 {
font-size: 11px !important;
font-weight: 700 !important;
color: #000 !important;
background: #d6e4bc !important;
padding: 4px 8px 4px 32px !important;
border: 1px solid #a8c08a !important;
border-radius: 0 !important;
margin: 0 !important;
text-transform: uppercase !important;
letter-spacing: 0.3px !important;
position: relative !important;
}
body.excel-mode h3::before {
content: ‘▶’;
position: absolute;
left: 8px;
font-size: 8px;
color: #217346;
}
/* 행 번호 자동 부여 */
body.excel-mode .card:nth-child(1)::before  { content: ‘1’; }
body.excel-mode .card:nth-child(2)::before  { content: ‘2’; }
body.excel-mode .card:nth-child(3)::before  { content: ‘3’; }
body.excel-mode .card:nth-child(4)::before  { content: ‘4’; }
body.excel-mode .card:nth-child(5)::before  { content: ‘5’; }
body.excel-mode .card:nth-child(6)::before  { content: ‘6’; }
body.excel-mode .card:nth-child(7)::before  { content: ‘7’; }
body.excel-mode .card:nth-child(8)::before  { content: ‘8’; }
body.excel-mode .card:nth-child(9)::before  { content: ‘9’; }
body.excel-mode .card:nth-child(10)::before { content: ‘10’; }
body.excel-mode .card:nth-child(11)::before { content: ‘11’; }
body.excel-mode .card:nth-child(12)::before { content: ‘12’; }
body.excel-mode .card:nth-child(13)::before { content: ‘13’; }
body.excel-mode .card:nth-child(14)::before { content: ‘14’; }
body.excel-mode .card:nth-child(15)::before { content: ‘15’; }
/* 입력 → 셀 */
body.excel-mode input, body.excel-mode textarea {
border: 1px solid #bbb !important;
border-radius: 0 !important;
height: 24px !important;
padding: 1px 4px !important;
font-size: 11px !important;
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
background: #fff !important;
box-shadow: none !important;
}
body.excel-mode input:focus, body.excel-mode textarea:focus {
border: 2px solid #0070C0 !important;
box-shadow: none !important;
background: #fff !important;
outline: none !important;
}
body.excel-mode textarea { height: auto !important; min-height: 48px !important; }
body.excel-mode input[type=date] { height: 24px !important; }
/* 버튼 */
body.excel-mode .bp {
background: #217346 !important;
color: #fff !important;
border: 1px solid #185a2e !important;
border-radius: 1px !important;
font-size: 11px !important;
padding: 4px 12px !important;
height: auto !important;
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
}
body.excel-mode .bg {
background: #f2f2f2 !important;
border: 1px solid #bbb !important;
border-radius: 1px !important;
font-size: 11px !important;
padding: 4px 10px !important;
color: #333 !important;
}
body.excel-mode .bt, body.excel-mode .bd {
font-size: 11px !important;
padding: 2px 5px !important;
}
/* 칩 → 셀 드롭다운 */
body.excel-mode .chip {
border: 1px solid #bbb !important;
border-radius: 0 !important;
font-size: 11px !important;
padding: 3px 7px !important;
background: #f9f9f9 !important;
color: #333 !important;
}
body.excel-mode .chip.on {
background: #d6e4bc !important;
color: #217346 !important;
border-color: #217346 !important;
}
/* 레이블 */
body.excel-mode .lbl {
font-size: 10px !important;
color: #555 !important;
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
text-transform: uppercase !important;
letter-spacing: 0.3px !important;
}
/* 아코디언 */
body.excel-mode [data-gkey] {
border-radius: 0 !important;
background: #e2efda !important;
border: 1px solid #a8c08a !important;
padding-left: 32px !important;
}
/* 통계 */
body.excel-mode .stat-card {
border: 1px solid #bbb !important;
border-radius: 0 !important;
background: #f2f8ee !important;
}
body.excel-mode .stat-grid {
border-top: 1px solid #bbb !important;
border-left: 1px solid #bbb !important;
}
body.excel-mode .stat-card {
border-top: none !important;
border-left: none !important;
}
/* day-card */
body.excel-mode .day-card {
border: 1px solid #a8c08a !important;
border-left: 3px solid #217346 !important;
margin: 4px 0 !important;
border-radius: 0 !important;
padding-left: 32px !important;
}
/* 엑셀 토글 버튼 */
body.excel-mode #excel-toggle-btn {
color: #fff !important;
border-color: rgba(255,255,255,0.5) !important;
background: rgba(255,255,255,0.15) !important;
}
/* 텍스트 */
body.excel-mode p, body.excel-mode span {
font-family: ‘Calibri’,‘Arial’,sans-serif !important;
font-size: 12px !important;
}
/* 셀 선택 시 이름 상자 (좌상단 셀 주소) */
body.excel-mode .content::before {
content: ‘A1’;
display: block;
background: #f2f2f2;
border: 1px solid #bbb;
border-top: none;
padding: 2px 8px;
font-size: 11px;
font-family: ‘Calibri’,‘Arial’,sans-serif;
color: #333;
width: 60px;
}
</style>

</head>
<body>
<div id="s-loading" class="loading">
  <div class="plane-loader">
    <i class="ti ti-plane-departure plane" style="font-size:44px;color:var(--A)"></i>
    <div class="runway"></div>
  </div>
</div>
<div id="s-auth" class="page">
  <div class="fw col">
    <div style="text-align:center;margin-bottom:1rem">
      <i class="ti ti-plane-departure" style="font-size:48px;color:var(--A);display:block;margin-bottom:12px"></i>
      <h1 style="font-size:28px;font-weight:900;letter-spacing:-1px">같이 가자</h1>
      <p style="color:var(--muted);font-size:14px;margin-top:6px;line-height:1.7">친구들과 여행 일정과 비용 정산을<br>한 곳에서 관리해요</p>
    </div>
    <div style="display:flex;background:#f5f0ea;border-radius:var(--r);padding:4px;gap:4px">
      <button id="tab-login-btn" onclick="setAuthTab('login')" style="flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--A);color:#412402">로그인</button>
      <button id="tab-signup-btn" onclick="setAuthTab('signup')" style="flex:1;padding:10px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)">회원가입</button>
    </div>
    <div id="err-auth" class="err"></div>
    <div><label class="lbl">이메일</label><input id="inp-email" type="email" placeholder="hello@example.com" autocomplete="email"></div>
    <div><label class="lbl">비밀번호</label><input id="inp-pw" type="password" placeholder="6자리 이상" autocomplete="current-password"></div>
    <div id="inp-pw2-wrap" style="display:none"><label class="lbl">비밀번호 확인</label><input id="inp-pw2" type="password" placeholder="비밀번호 재입력" autocomplete="new-password"></div>
    <button class="bp" id="auth-btn" onclick="doAuth()">로그인 <i class="ti ti-arrow-right"></i></button>
    <button class="bt" id="forgot-btn" onclick="doForgot()" style="justify-content:center;width:100%;font-size:13px">비밀번호를 잊으셨나요?</button>
  </div>
</div>
<div id="s-home" class="page top">
  <div class="fw">
    <div class="bw" style="margin-bottom:1.5rem">
      <div>
        <h2 style="font-size:22px;font-weight:900">내 여행</h2>
        <p id="home-email" style="font-size:13px;color:var(--muted);margin-top:2px"></p>
      </div>
      <button class="bt" onclick="doLogout()" style="font-size:13px"><i class="ti ti-logout"></i>로그아웃</button>
    </div>
    <div class="col" style="gap:8px;margin-bottom:1.5rem">

<script>

// ── Firebase 초기화 ──
const firebaseConfig = {
  apiKey: "AIzaSyBQBLy_bzxZeEmkDAEtI2GP4ukCA_VMZVY",
  authDomain: "maybe-fire.firebaseapp.com",
  databaseURL: "https://maybe-fire-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "maybe-fire",
  storageBucket: "maybe-fire.firebasestorage.app",
  messagingSenderId: "692135029863",
  appId: "1:692135029863:web:5b7d0682fb6817a6dbf8c2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const FB = "https://maybe-fire-default-rtdb.asia-southeast1.firebasedatabase.app";
function fbKey(k) { return k.replace(/:/g, '_'); }

function fixArrays(obj) {
  if (obj === null || obj === undefined) return obj;
  if (Array.isArray(obj)) return obj.map(fixArrays);
  if (typeof obj !== 'object') return obj;
  const keys = Object.keys(obj);
  const isArr = keys.length > 0 && keys.every(k => /^\d+$/.test(k));
  if (isArr) { const arr = []; keys.forEach(k => arr[parseInt(k)] = fixArrays(obj[k])); return arr; }
  const result = {}; keys.forEach(k => result[k] = fixArrays(obj[k])); return result;
}

async function getToken() {
  try { if (auth.currentUser) return await auth.currentUser.getIdToken(); } catch(e) {}
  return null;
}

async function dbGet(k) {
  try {
    var token = await getToken();
    var r = await fetch(FB + '/' + fbKey(k) + '.json' + (token ? '?auth=' + token : ''));
    if (!r.ok) return null;
    var raw = await r.json();
    return raw !== null ? fixArrays(raw) : null;
  } catch(e) { return null; }
}

async function dbSet(k, v) {
  try {
    var token = await getToken();
    await fetch(FB + '/' + fbKey(k) + '.json' + (token ? '?auth=' + token : ''), {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(v)
    });
  } catch(e) { showToast('저장 실패. 인터넷 연결을 확인해주세요 📶'); }
}

async function dbPatch(k, v) {
  try {
    var token = await getToken();
    await fetch(FB + '/' + fbKey(k) + '.json' + (token ? '?auth=' + token : ''), {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(v)
    });
  } catch(e) {}
}

// ── 상태 ──
var S = { user: null, trip: null, me: '', code: '', pendingCode: '' };
var authTab = 'login';
var openDayForm = false;
var openActForms = new Set();
var actMoreFields = new Set();
var editActState = {};
var EF = { open: false, title: '', amount: '', paidBy: '', split: [], cat: '식비', dayId: '', currency: 'KRW' };
var editExpId = null;
var openExpGroups = {};
var settleOpen = false;
var rateCache = {};
var syncTimer = null;

function normalizeTripData(t) {
  if (!t) return t;
  var m = t.members || [];
  t.members = Array.isArray(m) ? m : Object.values(m);
  t.itinerary = t.itinerary || [];
  if (!Array.isArray(t.itinerary)) t.itinerary = Object.values(t.itinerary);
  t.expenses = t.expenses || [];
  if (!Array.isArray(t.expenses)) t.expenses = Object.values(t.expenses);
  t.settleChecked = t.settleChecked || {};
  t.itinerary.forEach(function(day) {
    day.activities = day.activities || [];
    if (!Array.isArray(day.activities)) day.activities = Object.values(day.activities);
  });
  return t;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,4); }
function mkCode() { return Math.random().toString(36).substr(2,6).toUpperCase(); }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1A0F05;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity .3s;white-space:nowrap'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._t); t._t=setTimeout(function(){t.style.opacity='0';},2000);
}

function showErr(id,msg) { var e=document.getElementById(id); if(e){e.textContent=msg;e.style.display=msg?'block':'none';} }

function go(screen) {
  document.querySelectorAll('[id^="s-"]').forEach(function(e){e.style.display='none';});
  var el=document.getElementById('s-'+screen); if(!el) return;
  el.style.display=screen==='trip'?'block':'flex';
  if(screen==='trip') window.scrollTo(0,0);
  if(screen==='home') loadMyTrips();
  if(screen==='nick'||screen==='create') setNickPlaceholders();
}

// 저장된 테마 복원
(function(){ var t=localStorage.getItem('app-theme'); if(t) applyTheme(t); })();

auth.onAuthStateChanged(function(user) {
  if(user){ S.user=user; document.getElementById('home-email').textContent=user.email; go('home'); }
  else { S.user=null; go('auth'); }
});

function setAuthTab(tab) {
  authTab=tab; var isLogin=tab==='login';
  document.getElementById('tab-login-btn').style.background=isLogin?'var(--A)':'transparent';
  document.getElementById('tab-login-btn').style.color=isLogin?'#412402':'var(--muted)';
  document.getElementById('tab-signup-btn').style.background=!isLogin?'var(--A)':'transparent';
  document.getElementById('tab-signup-btn').style.color=!isLogin?'#412402':'var(--muted)';
  document.getElementById('inp-pw2-wrap').style.display=isLogin?'none':'block';
  document.getElementById('forgot-btn').style.display=isLogin?'flex':'none';
  document.getElementById('auth-btn').innerHTML=isLogin?'로그인 <i class="ti ti-arrow-right"></i>':'회원가입 <i class="ti ti-arrow-right"></i>';
  showErr('err-auth','');
}

async function doAuth() {
  var email=document.getElementById('inp-email').value.trim();
  var pw=document.getElementById('inp-pw').value;
  if(!email) return showErr('err-auth','이메일을 입력해주세요');
  if(!pw) return showErr('err-auth','비밀번호를 입력해주세요');
  var btn=document.getElementById('auth-btn'); btn.disabled=true; btn.textContent='처리 중...';
  showErr('err-auth','');
  try {
    if(authTab==='login'){ await auth.signInWithEmailAndPassword(email,pw); }
    else {
      if(pw.length<6) throw {code:'auth/weak-password'};
      var pw2=document.getElementById('inp-pw2').value;
      if(pw!==pw2) throw {code:'pw-mismatch'};
      await auth.createUserWithEmailAndPassword(email,pw);
    }
  } catch(e) {
    var msgs={'auth/user-not-found':'등록되지 않은 이메일이에요','auth/wrong-password':'비밀번호가 틀렸어요','auth/email-already-in-use':'이미 사용 중인 이메일이에요','auth/invalid-email':'이메일 형식이 올바르지 않아요','auth/weak-password':'비밀번호는 6자리 이상이어야 해요','auth/too-many-requests':'잠시 후 다시 시도해주세요','auth/invalid-credential':'이메일 또는 비밀번호가 틀렸어요','pw-mismatch':'비밀번호가 일치하지 않아요'};
    showErr('err-auth',msgs[e.code]||'오류가 발생했어요: '+e.code);
  } finally { btn.disabled=false; btn.innerHTML=authTab==='login'?'로그인 <i class="ti ti-arrow-right"></i>':'회원가입 <i class="ti ti-arrow-right"></i>'; }
}

async function doForgot() {
  var email=document.getElementById('inp-email').value.trim();
  if(!email) return showErr('err-auth','이메일을 먼저 입력해주세요');
  try { await auth.sendPasswordResetEmail(email); showToast('비밀번호 재설정 이메일을 보냈어요'); }
  catch(e) { showErr('err-auth','이메일을 다시 확인해주세요'); }
}

async function doLogout() { stopSync(); await auth.signOut(); }

async function loadMyTrips() {
  var el=document.getElementById('my-trips-wrap'); if(!el||!S.user) return;
  el.innerHTML='<div class="empty"><i class="ti ti-loader" style="animation:spin 1s linear infinite"></i><p>불러오는 중...</p></div>';
  var myTrips=await dbGet('user-trips:'+S.user.uid)||{};
  var codes=Object.keys(myTrips);
  if(!codes.length){ el.innerHTML='<div class="empty"><i class="ti ti-plane-off"></i><p>아직 참여한 여행이 없어요<br>새 여행을 만들거나 코드로 참여해보세요!</p></div>'; return; }
  // 여행 데이터 로드 후 출발일 빠른 순으로 정렬
  var tripList=[];
  for(var i=0;i<codes.length;i++){
    var t2=await dbGet('trip:'+codes[i]); if(!t2) continue;
    tripList.push({code:codes[i],trip:t2,nick:(myTrips[codes[i]]&&myTrips[codes[i]].nickname)?myTrips[codes[i]].nickname:''});
  }
  tripList.sort(function(a,b){
    if(!a.trip.startDate) return 1;
    if(!b.trip.startDate) return -1;
    return a.trip.startDate.localeCompare(b.trip.startDate);
  });
  el.innerHTML='';
  for(var i=0;i<tripList.length;i++) {
    var code=tripList[i].code; var t=tripList[i].trip;
    var nick=tripList[i].nick;
    var d=t.startDate?(t.endDate?t.startDate+' ~ '+t.endDate:t.startDate):'날짜 미정';
    var memberCount=(t.members||[]).length;
    var card=document.createElement('div'); card.className='trip-card';
    var ICON_MAP={'plane':'ti-plane','beach':'ti-beach','mountain':'ti-mountain','map':'ti-map','luggage':'ti-luggage','ship':'ti-ship','train':'ti-train','tent':'ti-tent','world':'ti-world','rollercoaster':'ti-roller-skating','building':'ti-building-castle','tower':'ti-tower','bowl':'ti-bowl','backpack':'ti-backpack','motorbike':'ti-motorbike','camper':'ti-camper'};
var iconCls = ICON_MAP[t.icon] || 'ti-plane';
var iconHtml = '<i class="ti '+iconCls+'" style="font-size:22px;color:var(--A)"></i>';
card.innerHTML='<div style="width:46px;height:46px;border-radius:14px;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+iconHtml+'</div>'
      +'<div style="flex:1;min-width:0"><p style="font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+t.name+'</p>'
      +'<p style="font-size:12px;color:var(--muted);margin-top:3px">'+d+'</p>'
      +'<p style="font-size:12px;color:var(--muted);margin-top:2px"><i class="ti ti-users" style="font-size:11px;margin-right:3px"></i>'+memberCount+'명 · 내 닉네임: <span style="color:var(--A);font-weight:700">'+nick+'</span></p></div>'
      +'<i class="ti ti-chevron-right" style="color:var(--muted);font-size:18px;flex-shrink:0"></i>';
    (function(c){card.onclick=function(){enterTrip(c);};})(code);
    el.appendChild(card);
  }
}

async function enterTrip(code) {
  showToast('입장 중...');
  try {
    var myTrips=await dbGet('user-trips:'+S.user.uid)||{};
    var myInfo=myTrips[code];
    if(myInfo&&myInfo.nickname) {
      var t=await dbGet('trip:'+code);
      if(!t){showToast('여행 데이터를 불러오지 못했어요.');return;}
      S.trip=normalizeTripData(t); S.code=code; S.me=myInfo.nickname;
      switchTab('schedule'); renderTrip(); go('trip'); startSync(code);
    } else {
      S.pendingCode=code;
      document.getElementById('disp-code').textContent=code;
      document.getElementById('inp-nick').value='';
      showErr('err-nick',''); go('nick');
    }
  } catch(e) { showToast('입장 실패: '+(e.message||String(e))); }
}

function onStartChange() {
  var s=document.getElementById('inp-start').value;
  var endInput=document.getElementById('inp-end');
  if(s){ endInput.min=s; if(endInput.value&&endInput.value<s) endInput.value=''; endInput.focus(); }
  updateNights();
}
function updateNights() {
  var s=document.getElementById('inp-start').value;
  var e=document.getElementById('inp-end').value;
  var badge=document.getElementById('nights-badge'); if(!badge) return;
  if(s&&e&&new Date(e)>=new Date(s)){
    var nights=Math.round((new Date(e)-new Date(s))/86400000);
    badge.textContent=nights===0?'당일치기':(nights+'박 '+(nights+1)+'일');
    badge.style.display='block';
  } else {badge.style.display='none';}
}

function autoPopulateDays(t) {
  if(!t.startDate||(t.itinerary&&t.itinerary.length>0)) return t;
  t.itinerary=t.itinerary||[];
  var start=new Date(t.startDate+'T00:00:00'), end=t.endDate?new Date(t.endDate+'T00:00:00'):start;
  var cur=new Date(start),i=1;
  while(cur<=end&&i<=31){ t.itinerary.push({id:uid(),label:i+'일차',date:cur.toISOString().split('T')[0],activities:[],auto:true}); cur.setDate(cur.getDate()+1); i++; }
  return t;
}

async function doCreate() {
  var name=document.getElementById('inp-tname').value.trim();
  var startDate=document.getElementById('inp-start').value;
  var endDate=document.getElementById('inp-end').value;
  var nick=document.getElementById('inp-creator-nick').value.trim();
  if(!name) return showErr('err-create','여행 이름을 입력해주세요');
  if(!startDate) return showErr('err-create','시작일을 선택해주세요');
  if(!endDate) return showErr('err-create','종료일을 선택해주세요');
  if(new Date(endDate)<new Date(startDate)) return showErr('err-create','종료일이 시작일보다 빨라요');
  if(!nick) return showErr('err-create','닉네임을 입력해주세요');
  var btn=document.querySelector('#s-create .bp');
  if(btn){btn.disabled=true;btn.textContent='저장 중...';}
  var c=mkCode();
  var t={name:name,code:c,startDate:startDate,endDate:endDate,members:[],itinerary:[],expenses:[],createdAt:Date.now(),createdBy:S.user.uid};
  t.members.push({uid:S.user.uid,nickname:nick,email:S.user.email||''});
  t=autoPopulateDays(t);
  await dbSet('trip:'+c,t);
  var patch={}; patch[c]={nickname:nick,joinedAt:Date.now()};
  await dbPatch('user-trips:'+S.user.uid,patch);
  if(btn){btn.disabled=false;btn.innerHTML='여행 만들기 <i class="ti ti-arrow-right"></i>';}
  showErr('err-create','');
  S.trip=normalizeTripData(t); S.code=c; S.me=nick;
  switchTab('schedule'); renderTrip(); go('trip'); startSync(c);
}

async function doJoin() {
  var c=document.getElementById('inp-jcode').value.trim().toUpperCase();
  if(!c) return showErr('err-join','코드를 입력해주세요');
  if(c.length<6) return showErr('err-join','코드는 6자리예요');
  var btn=document.querySelector('#s-join .bp');
  if(btn){btn.disabled=true;btn.textContent='확인 중...';}
  showErr('err-join','');
  var myTrips=await dbGet('user-trips:'+S.user.uid)||{};
  if(myTrips[c]&&myTrips[c].nickname){if(btn){btn.disabled=false;btn.innerHTML='참여하기 <i class="ti ti-arrow-right"></i>';}await enterTrip(c);return;}
  var t=await dbGet('trip:'+c);
  if(btn){btn.disabled=false;btn.innerHTML='참여하기 <i class="ti ti-arrow-right"></i>';}
  if(!t) return showErr('err-join','존재하지 않는 여행 코드예요');
  S.pendingCode=c; document.getElementById('disp-code').textContent=c;
  document.getElementById('inp-nick').value=''; showErr('err-nick',''); go('nick');
}

async function doSetNick() {
  var nick=document.getElementById('inp-nick').value.trim();
  if(!nick) return showErr('err-nick','닉네임을 입력해주세요');
  var btn=document.querySelector('#s-nick .bp');
  if(btn){btn.disabled=true;btn.textContent='입장 중...';}
  showErr('err-nick','');
  try {
    var t=await dbGet('trip:'+S.pendingCode);
    if(!t) throw new Error('여행을 찾을 수 없어요');
    var members=t.members||[];
    if(!Array.isArray(members)) members=Object.values(members);
    var exists=members.find(function(m){return (typeof m==='object'?m.nickname:m)===nick&&(typeof m==='object'?m.uid!==S.user.uid:true);});
    if(exists) throw new Error('이미 사용 중인 닉네임이에요');
    var myMember=members.find(function(m){return typeof m==='object'&&m.uid===S.user.uid;});
    if(!myMember) members.push({uid:S.user.uid,nickname:nick,email:S.user.email||''});
    t.members=members; t=autoPopulateDays(t); t.itinerary=t.itinerary||[]; t.expenses=t.expenses||[];
    await dbSet('trip:'+S.pendingCode,t);
    var patch={}; patch[S.pendingCode]={nickname:nick,joinedAt:Date.now()};
    await dbPatch('user-trips:'+S.user.uid,patch);
    S.trip=normalizeTripData(t); S.code=S.pendingCode; S.me=nick;
    switchTab('schedule'); renderTrip(); go('trip'); startSync(S.code);
  } catch(e) { showErr('err-nick',e.message||'오류가 발생했어요'); }
  finally { if(btn){btn.disabled=false;btn.innerHTML='입장하기 <i class="ti ti-arrow-right"></i>';} }
}

function toggleDF(){openDayForm=!openDayForm;renderSchedule();}
function toggleAF(id){if(openActForms.has(id))openActForms.delete(id);else openActForms.add(id);renderSchedule();}
function addDay(){
  var lbl=(document.getElementById('df-label').value.trim())||(S.trip.itinerary.length+1+'일차');
  S.trip.itinerary.push({id:uid(),label:lbl,date:document.getElementById('df-date').value,activities:[]});
  S.trip.itinerary.sort(function(a,b){if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date);});
  openDayForm=false; dbSet('trip:'+S.code,S.trip); renderSchedule();
}
function removeDay(id){openActForms.delete(id);S.trip.itinerary=S.trip.itinerary.filter(function(d){return d.id!==id;});dbSet('trip:'+S.code,S.trip);renderSchedule();}
function addAct(dayId){
  var titleEl=document.getElementById('an-'+dayId); if(!titleEl) return;
  var title=titleEl.value.trim(); if(!title) return;
  var day=S.trip.itinerary.find(function(d){return d.id===dayId;});
  if(day) day.activities.push({id:uid(),time:(document.getElementById('at-'+dayId)||{}).value||'',title:title,location:(document.getElementById('al-'+dayId)||{}).value||'',note:(document.getElementById('am-'+dayId)||{}).value||''});
  openActForms.delete(dayId); actMoreFields.delete(dayId+'_loc'); actMoreFields.delete(dayId+'_note');
  // 시간 있는 것 먼저 시간순, 없는 건 뒤에
  if(day) day.activities.sort(function(a,b){
    if(!a.time && !b.time) return 0;
    if(!a.time) return 1;
    if(!b.time) return -1;
    return a.time.localeCompare(b.time);
  });
  dbSet('trip:'+S.code,S.trip); renderSchedule();
}
function removeAct(dayId,actId){var day=S.trip.itinerary.find(function(d){return d.id===dayId;});if(day)day.activities=day.activities.filter(function(a){return a.id!==actId;});dbSet('trip:'+S.code,S.trip);renderSchedule();}
function fmtTime(input){var v=input.value.replace(/[^0-9]/g,'');if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2,4);input.value=v;}
function toggleMoreFields(key){
  actMoreFields.add(key);
  var dayId=key.replace('_loc','').replace('_note','');
  var field=document.getElementById((key.endsWith('_loc')?'loc-field-':'note-field-')+dayId);
  if(field)field.style.display='block';
  var parent=field&&field.parentElement;
  if(parent)parent.querySelectorAll('button').forEach(function(btn){if((key.endsWith('_loc')&&btn.textContent.includes('장소'))||(key.endsWith('_note')&&btn.textContent.includes('메모')))btn.style.display='none';});
}
function startEditAct(key){editActState[key]=true;renderSchedule();}
function cancelEditAct(key){delete editActState[key];renderSchedule();}
function saveEditAct(dayId,actId,key){
  var title=(document.getElementById('en-'+key)||{}).value;
  if(!title||!title.trim()) return;
  var day=S.trip.itinerary.find(function(d){return d.id===dayId;});
  var act=day&&day.activities.find(function(a){return a.id===actId;});
  if(act){act.title=title.trim();act.time=(document.getElementById('et-'+key)||{}).value||'';act.location=(document.getElementById('el-'+key)||{}).value||'';act.note=(document.getElementById('em-'+key)||{}).value||'';}
  delete editActState[key];
  // 시간 수정 후 재정렬
  var sortDay = S.trip.itinerary.find(function(d){return d.id===dayId;});
  if(sortDay) sortDay.activities.sort(function(a,b){
    if(!a.time && !b.time) return 0;
    if(!a.time) return 1;
    if(!b.time) return -1;
    return a.time.localeCompare(b.time);
  });
  dbSet('trip:'+S.code,S.trip); renderSchedule();
}

      +(editExpId?'<button class="bg" onclick="cancelEditExp()">취소</button><button class="bp" style="width:auto;padding:12px 20px" onclick="saveEditExp()">저장</button>'
                :'<button class="bg" onclick="EF.open=false;renderExpenses()">취소</button><button class="bp" style="width:auto;padding:12px 20px" onclick="addExp()">추가</button>')
      +'</div></div></div>';
  }

  if(!EF.open){
    h+='<button onclick="openEF()" style="width:100%;border:2px dashed var(--border);background:transparent;border-radius:var(--r);padding:11px 14px;color:var(--A);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;margin-bottom:14px"><i class="ti ti-plus"></i>지출 추가</button>';
  }
  if(!EF.open&&exps.length>0){
    var groups={}, groupOrder=[];
    exps.forEach(function(e){var gkey=e.dayId||'none';if(!groups[gkey]){groups[gkey]=[];groupOrder.push(gkey);}groups[gkey].push(e);});
    groupOrder.sort(function(a,b){
      if(a==='pre'&&b!=='pre')return -1; if(b==='pre'&&a!=='pre')return 1;
      if(a==='none')return 1; if(b==='none')return -1;
      var ia=(S.trip.itinerary||[]).findIndex(function(d){return d.id===a;});
      var ib=(S.trip.itinerary||[]).findIndex(function(d){return d.id===b;});
      return ia-ib;
    });
    groupOrder.forEach(function(gkey){
      var gexps=groups[gkey].slice().reverse();
      var gtotal=groups[gkey].reduce(function(s,e){return s+e.amount;},0);
      var glabel=gkey==='pre'?'사전 예약':gkey==='none'?'날짜 미정':((S.trip.itinerary||[]).find(function(d){return d.id===gkey;})||{}).label||gkey;
      var isOpen=openExpGroups[gkey]!==false;
      h+='<div style="margin-bottom:8px">'
        +'<div data-gkey="'+gkey+'" onclick="toggleExpGroup(this.dataset.gkey)" style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--r);cursor:pointer;user-select:none">'
        +'<div><span style="font-weight:900;font-size:14px;color:var(--A)">'+glabel+'</span>'
        +'<span style="font-size:12px;color:var(--muted);margin-left:10px">'+groups[gkey].length+'건 · '+fmt(gtotal)+'원</span></div>'
        +'<span style="color:var(--A);font-size:13px;line-height:1">'+(isOpen?'▲':'▼')+'</span>'
        +'</div>';
      if(isOpen){
        gexps.forEach(function(exp){
          h+='<div class="card" data-exp-id="'+exp.id+'" data-exp-gkey="'+gkey+'" style="margin-top:4px;margin-bottom:0">'
            +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
            +'<div style="display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0">'
            +'<button onmousedown="startExpDrag(event,\'' + exp.id + '\',\'' + gkey + '\')" ontouchstart="startExpDrag(event,\'' + exp.id + '\',\'' + gkey + '\')" style="background:none;border:none;cursor:grab;padding:4px 2px;color:#ccc;font-size:16px;touch-action:none;flex-shrink:0;align-self:center"><i class="ti ti-grip-vertical"></i></button>'
            +'<i class="ti ti-'+(CI[exp.cat]||'credit-card')+'" style="font-size:20px;color:var(--A);flex-shrink:0;padding-top:3px"></i>'
            +'<div style="min-width:0"><p style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+exp.title+'</p>'
            +(exp.origAmount?'<p style="font-size:11px;color:var(--muted);margin-top:2px">'+exp.origAmount.toLocaleString()+' '+exp.origCurrency+' → '+fmt(exp.amount)+'원</p>':'')
            +'<p style="font-size:12px;color:var(--muted);margin-top:3px">'+(exp.paidBy==='individual'?'개별결제':getMemberName(exp.paidBy)+' 결제')+'</p>'
            +'<p style="font-size:11px;color:var(--muted);margin-top:2px">1인당 '+fmt(Math.round(exp.amount/((exp.split||[]).length||1)))+'원</p>'

            +'</div></div>'
            +'<div style="display:flex;align-items:center;gap:4px;flex-shrink:0">'
            +'<span style="font-weight:900;font-size:15px;color:var(--A);white-space:nowrap">'+fmt(exp.amount)+'원</span>'
            +'<button class="bt" data-eid="'+exp.id+'" onclick="startEditExp(this.dataset.eid)" style="color:var(--muted);padding:4px 5px"><i class="ti ti-pencil" style="font-size:14px"></i></button>'
            +'<button class="bd" data-eid="'+exp.id+'" onclick="removeExp(this.dataset.eid)" style="padding:4px 5px"><i class="ti ti-x" style="font-size:14px"></i></button>'
            +'</div></div></div>';
        });
      }
      h+='</div>';
    });
  }

  el.innerHTML=h;

  if(EF.open){
    var dc=el.querySelector('#day-chips');
    if(dc){
      var preB=document.createElement('button');preB.className='chip'+(EF.dayId==='pre'?' on':'');preB.innerHTML='<i class="ti ti-calendar-event"></i> 사전 예약';preB.onclick=function(){EF.dayId='pre';renderExpenses();};dc.appendChild(preB);
      (S.trip.itinerary||[]).forEach(function(d){var b=document.createElement('button');b.className='chip'+(d.id===EF.dayId?' on':'');b.innerHTML=d.label+(d.date?'<span style="font-size:11px;font-weight:400;margin-left:3px">'+d.date.slice(5).replace('-','/')+'</span>':'');b.onclick=function(){EF.dayId=d.id;renderExpenses();};dc.appendChild(b);});
    }
    var cc=el.querySelector('#currency-chips');
    if(cc){CURRENCIES.forEach(function(c){var b=document.createElement('button');b.className='chip'+(c.code===EF.currency?' on':'');b.textContent=c.label;b.onclick=function(){selectCurrency(c.code);};cc.appendChild(b);});var pb=document.createElement('button');pb.className='chip';pb.innerHTML='<i class="ti ti-plus"></i> 기타';pb.onclick=pickCustomCurrency;cc.appendChild(pb);}
    var catC=el.querySelector('#cat-chips');
    if(catC){['식비','숙박','교통','관광','쇼핑','기타'].forEach(function(c){var b=document.createElement('button');b.className='chip'+(EF.cat===c?' on':'');b.innerHTML='<i class="ti ti-'+CI[c]+'"></i>'+c;b.onclick=function(){EF.cat=c;renderExpenses();};catC.appendChild(b);});}
    var pc=el.querySelector('#paidby-chips');
    if(pc){
      var indBtn=document.createElement('button');indBtn.className='chip'+(EF.paidBy==='individual'?' on':'');indBtn.innerHTML='<i class="ti ti-users" style="font-size:12px"></i>개별결제';indBtn.onclick=function(){EF.paidBy='individual';renderExpenses();};pc.appendChild(indBtn);
      nicks.forEach(function(n){var b=document.createElement('button');b.className='chip'+(EF.paidBy===n?' on':'');b.textContent=getMemberName(n);b.onclick=function(){EF.paidBy=n;renderExpenses();};pc.appendChild(b);});
    }
    var sc=el.querySelector('#split-chips');
    if(sc){nicks.forEach(function(n){var b=document.createElement('button');var inc=EF.split.includes(n);b.className='chip'+(inc?' on':'');b.innerHTML=(inc?'<i class="ti ti-check" style="font-size:11px"></i>':'<i class="ti ti-x" style="font-size:11px;opacity:.5"></i>')+getMemberName(n);b.onclick=function(){toggleSplit(n);};sc.appendChild(b);});}
  }
  } catch(err){el.innerHTML='<div class="card" style="border-color:var(--no)"><p style="color:var(--no);font-weight:700">오류: '+err.message+'</p></div>';console.error('renderExpenses:',err);}
}

function toggleSettle(){
  settleOpen=!settleOpen;
  renderExpenses();
}

function renderSettlePanel(){
  var panel=document.getElementById('settle-panel');
  if(!panel) return;
  panel.innerHTML=renderSettlePanelHTML();
}

function renderSettlePanelHTML(){
  var nicks=getNicks();
  var exps=S.trip.expenses||[];
  var checked=S.trip.settleChecked||{};
  // 잔액 계산
  var bal={};
  nicks.forEach(function(n){bal[n]=0;});
  exps.forEach(function(e){
    if(e.paidBy==='individual') return;
    var sl=(e.split&&e.split.length)?e.split:nicks;
    var vs=sl.filter(function(n){return bal.hasOwnProperty(n);});
    if(!vs.length) vs=nicks;
    var sh=e.amount/vs.length;
    vs.forEach(function(n){bal[n]-=sh;});
    if(bal.hasOwnProperty(e.paidBy)) bal[e.paidBy]+=e.amount;
  });
  var pos=[],neg=[];
  Object.keys(bal).forEach(function(n){
    if(bal[n]>0.5) pos.push([n,bal[n]]);
    else if(bal[n]<-0.5) neg.push([n,-bal[n]]);
  });
  pos.sort(function(a,b){return b[1]-a[1];});
  neg.sort(function(a,b){return b[1]-a[1];});
  var txns=[];
  while(pos.length&&neg.length){
    var a=Math.min(pos[0][1],neg[0][1]);
    txns.push({from:neg[0][0],to:pos[0][0],amount:Math.round(a)});
    pos[0][1]-=a; neg[0][1]-=a;
    if(pos[0][1]<0.5) pos.shift();
    if(neg[0][1]<0.5) neg.shift();
  }
  var total=exps.reduce(function(s,e){return s+e.amount;},0);
  var paid={};
  nicks.forEach(function(n){paid[n]=0;});
  exps.forEach(function(e){if(e.paidBy&&e.paidBy!=='individual') paid[e.paidBy]=(paid[e.paidBy]||0)+e.amount;});

  var h='<div class="card" style="border-color:var(--A)">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
    +'<p style="font-size:15px;font-weight:900">정산 결과</p>'
    +'<button class="bt" onclick="toggleSettle()" style="color:var(--muted);font-size:12px"><i class="ti ti-x"></i></button>'
    +'</div>'
    +'<div class="stat-grid" style="margin-bottom:12px">'
    +'<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px">총 지출</div><div style="font-size:14px;font-weight:900;color:var(--A)">'+fmt(total)+'원</div></div>'
    +'<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px">인원</div><div style="font-size:14px;font-weight:900;color:var(--A)">'+nicks.length+'명</div></div>'
    +'<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px">1인당</div><div style="font-size:14px;font-weight:900;color:var(--A)">'+fmt(Math.round(total/nicks.length))+'원</div></div>'
    +'</div>';
  if(!txns.length){
    h+='<div style="text-align:center;padding:1rem 0"><i class="ti ti-circle-check" style="font-size:32px;color:var(--ok);display:block;margin-bottom:6px"></i><p style="font-weight:900;color:var(--ok)">정산 완료!</p></div>';
  } else {
    txns.forEach(function(tx){
      var key=tx.from+'_'+tx.to+'_'+tx.amount;
      var done=!!checked[key];
      h+='<div data-skey="'+key+'" onclick="toggleSettleItem(this.dataset.skey)" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer'+(done?';opacity:.6':'') +'">'
        +'<div style="width:24px;height:24px;border-radius:50%;flex-shrink:0;border:2px solid '+(done?'var(--ok)':'var(--border)')+';background:'+(done?'var(--ok)':'transparent')+';display:flex;align-items:center;justify-content:center">'
        +(done?'<i class="ti ti-check" style="color:#fff;font-size:11px"></i>':'')
        +'</div>'
        +'<span style="font-weight:700;font-size:14px'+(done?';color:var(--muted)':'')+'">'+tx.from+'</span>'
        +'<i class="ti ti-arrow-right" style="color:var(--muted);font-size:13px"></i>'
        +'<span style="font-weight:700;font-size:14px'+(done?';color:var(--muted)':'')+'">'+tx.to+'</span>'
        +'<span style="margin-left:auto;font-weight:900;color:'+(done?'var(--muted)':'var(--A)')+';font-size:15px">'+fmt(tx.amount)+'원</span>'
        +'</div>';
    });
    var allDone=txns.every(function(tx){return checked[tx.from+'_'+tx.to+'_'+tx.amount];});
    if(allDone) h+='<p style="text-align:center;font-size:13px;color:var(--ok);font-weight:700;padding-top:8px">🎉 전체 송금 완료!</p>';
  }
  // 멤버별 현황
  h+='<p style="font-size:12px;font-weight:700;color:var(--muted);margin-top:12px;margin-bottom:6px">멤버별 현황</p>';
  nicks.forEach(function(n){
    var mp=paid[n]||0, diff=mp-total/nicks.length;
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--border)">'
      +'<span style="font-size:13px;font-weight:700">'+n+'</span>'
      +'<div style="text-align:right"><span style="font-size:12px;color:var(--A);font-weight:700">'+fmt(mp)+'원 결제</span>'
      +'<span style="font-size:11px;color:'+(diff>=0?'var(--ok)':'var(--no)')+';margin-left:8px">'+(diff>=0?'+'+fmt(Math.round(diff))+'원 받아야 함':fmt(Math.round(diff))+'원 내야 함')+'</span></div>'
      +'</div>';
  });
  h+='</div>';
  return h;
}

async function toggleSettleItem(key){
  if(!S.trip.settleChecked) S.trip.settleChecked={};
  if(S.trip.settleChecked[key]) delete S.trip.settleChecked[key];
  else S.trip.settleChecked[key]=true;
  await dbSet('trip:'+S.code,S.trip);
  renderExpenses();
}

function toggleExpGroup(key){openExpGroups[key]=openExpGroups[key]===false?true:false;renderExpenses();}

function openEF(){
  editExpId=null; var nicks=getNicks();
  EF.open=true;EF.title='';EF.amount='';EF.paidBy=S.me||(nicks[0]||'');
  EF.split=nicks.slice();EF.cat='식비';EF.dayId='';EF.currency='KRW';
  renderExpenses();
}

function startEditExp(id){
  var exp=(S.trip.expenses||[]).find(function(e){return e.id===id;});
  if(!exp) return;
  EF.open=true; EF.title=exp.title;
  EF.amount=String(exp.origAmount||exp.amount);
  EF.paidBy=exp.paidBy; EF.split=(exp.split||[]).slice();
  EF.cat=exp.cat||'식비'; EF.dayId=exp.dayId||''; EF.currency=exp.origCurrency||'KRW';
  editExpId=id; renderExpenses();
}

function cancelEditExp(){editExpId=null;EF.open=false;renderExpenses();}

async function saveEditExp(){
  var tEl=document.getElementById('ef-t'), aEl=document.getElementById('ef-a');
  var title=(tEl&&tEl.value.trim())||(EF.title?EF.title.trim():'');
  var rawAmt=EF.amount||(aEl?aEl.value.replace(/[^0-9]/g,''):'');
  var a=parseFloat(rawAmt);
  if(!title||isNaN(a)||a<=0) return;
  var nicks=getNicks();
  var krwAmt=EF.currency==='KRW'?a:(rateCache[EF.currency]?Math.round(a*rateCache[EF.currency]):a);
  var idx=S.trip.expenses.findIndex(function(e){return e.id===editExpId;});
  if(idx>=0){S.trip.expenses[idx]={id:editExpId,title:title,amount:krwAmt,origAmount:EF.currency!=='KRW'?a:null,origCurrency:EF.currency!=='KRW'?EF.currency:null,paidBy:EF.paidBy,split:EF.split.length?EF.split.slice():nicks,cat:EF.cat,dayId:EF.dayId};}
  await dbSet('trip:'+S.code,S.trip);
  editExpId=null;EF.open=false;renderExpenses();showToast('수정됐어요 ✅');
}

function toggleSplit(n){
  var amt=document.getElementById('ef-a'); if(amt)EF.amount=amt.value.replace(/[^0-9]/g,'');
  var idx=EF.split.indexOf(n); if(idx>=0)EF.split.splice(idx,1);else EF.split.push(n);
  renderExpenses();
}

function addExp(){
  var tEl=document.getElementById('ef-t'), aEl=document.getElementById('ef-a');
  var title=(tEl&&tEl.value.trim())||(EF.title?EF.title.trim():'');
  var rawAmt=EF.amount||(aEl?aEl.value.replace(/[^0-9]/g,''):'');
  var a=parseFloat(rawAmt);
  if(!title||isNaN(a)||a<=0) return;
  var nicks=getNicks();
  var krwAmt=EF.currency==='KRW'?a:(rateCache[EF.currency]?Math.round(a*rateCache[EF.currency]):a);
  S.trip.expenses.push({id:uid(),title:title,amount:krwAmt,origAmount:EF.currency!=='KRW'?a:null,origCurrency:EF.currency!=='KRW'?EF.currency:null,paidBy:EF.paidBy,split:EF.split.length?EF.split.slice():nicks,cat:EF.cat,dayId:EF.dayId});
  dbSet('trip:'+S.code,S.trip);EF.open=false;renderExpenses();
}

function removeExp(id){S.trip.expenses=S.trip.expenses.filter(function(e){return e.id!==id;});dbSet('trip:'+S.code,S.trip);renderExpenses();}

async function fetchRate(currency){if(currency==='KRW'||rateCache[currency])return;try{var r=await fetch('https://open.er-api.com/v6/latest/'+currency);var d=await r.json();if(d.rates&&d.rates.KRW)rateCache[currency]=d.rates.KRW;}catch(e){}}

function fmtInput(input){var raw=input.value.replace(/[^0-9]/g,'');var num=parseInt(raw,10);if(!raw){input.value='';EF.amount='';return;}input.value=num.toLocaleString('ko-KR');EF.amount=String(num);var p=document.getElementById('currency-preview');if(p)p.textContent=getCurrencyPreview();}

function getCurrencyPreview(){var a=parseFloat(EF.amount);if(!a||EF.currency==='KRW'||!rateCache[EF.currency])return '';return '≈ '+fmt(Math.round(a*rateCache[EF.currency]))+'원';}

function selectCurrency(code){EF.currency=code;if(code!=='KRW')fetchRate(code).then(function(){var p=document.getElementById('currency-preview');if(p)p.textContent=getCurrencyPreview();});renderExpenses();}

function pickCustomCurrency(){var code=prompt('통화 코드를 입력해주세요 (예: THB, VND, GBP)');if(!code)return;code=code.trim().toUpperCase();if(!CURRENCIES.find(function(c){return c.code===code;}))CURRENCIES.push({code:code,label:code});selectCurrency(code);}

  } else {
    h+='<div class="bw" style="padding:4px 0;margin-bottom:12px">'
      +'<div><p style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px">여행 이름</p><p style="font-size:16px;font-weight:900">'+(S.trip.name||'')+'</p></div>'
      +(isCreator?'<button class="bt" onclick="editingName=true;renderSettings()"><i class="ti ti-pencil" style="font-size:16px"></i></button>':'')

  }

      +'<div style="display:flex;align-items:center;justify-content:space-between"><label class="lbl" style="margin:0">여행 날짜</label>'
      +'<button class="bt" style="font-size:12px;color:var(--no)" onclick="editingDate=false;renderSettings()">취소</button></div>'

      +'<div><div style="font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 0">시작일</div><input id="set-start" type="date" value="'+(S.trip.startDate||'')+'" onchange="updateSettingNights()"></div>'
      +'<div class="date-range-div"></div>'
      +'<div><div style="font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 0">종료일</div><input id="set-end" type="date" value="'+(S.trip.endDate||'')+'" onchange="updateSettingNights()"></div>'
      +'</div></div>'
      +'<p id="set-nights" style="font-size:13px;color:var(--A);text-align:right"></p>'
      +'<button class="bp" style="padding:10px" onclick="saveDate()">저장</button>'
      +'</div>';
  } else {
    var d=S.trip.startDate?(S.trip.endDate?S.trip.startDate+' ~ '+S.trip.endDate:S.trip.startDate):'날짜 미정';
    h+='<div class="bw" style="padding-top:12px;border-top:1px solid var(--border)">'
      +'<div><p style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px">여행 날짜</p><p style="font-size:15px;font-weight:700">'+d+'</p></div>'
      +(isCreator?'<button class="bt" onclick="editingDate=true;renderSettings()"><i class="ti ti-pencil" style="font-size:16px"></i></button>':'')
      +'</div>';
    // 코드 공유 - 날짜 아래
    h+='<div class="bw" style="padding-top:12px;border-top:1px solid var(--border);gap:12px">'
      +'<div><p style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px">여행 코드</p>'
      +'<p style="font-size:22px;font-weight:900;letter-spacing:6px;color:var(--A)">'+S.code+'</p></div>'
      +'<button class="copy-btn" style="flex-shrink:0;width:auto;padding:8px 14px;font-size:13px;white-space:nowrap" onclick="copyCode()"><i class="ti ti-copy"></i>복사</button>'
      +'</div>';
  }
  h+='</div>';
  // 테마 선택
  var curTheme = localStorage.getItem('app-theme')||'default';
  var themes=[
    {id:'default',label:'기본',icon:'ti-leaf'},
    {id:'dark',label:'다크',icon:'ti-moon'},
    {id:'blue',label:'블루',icon:'ti-drop'},
    {id:'excel',label:'엑셀',icon:'ti-table'}
  ];
  h+='<h3 style="font-size:17px;font-weight:900;margin:20px 0 14px">테마</h3>';
  h+='<div class="card"><div style="display:flex;gap:8px">';
  themes.forEach(function(t){
    var isOn=curTheme===t.id;
    h+='<button onclick="setTheme(\''+t.id+'\')" style="flex:1;padding:12px 4px;border:1.5px solid '+(isOn?'var(--A)':'var(--border)')+';background:'+(isOn?'var(--AX)':'transparent')+';border-radius:var(--r);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px">'
      +'<i class="ti '+t.icon+'" style="font-size:20px;color:'+(isOn?'var(--A)':'var(--muted)')+'"></i>'
      +'<span style="font-size:11px;font-weight:700;color:'+(isOn?'var(--A)':'var(--muted)')+'">' +t.label+'</span>'
      +'</button>';
  });
  h+='</div></div>';
  // 위험 구역 (방장만, 맨 아래)
  if (isCreator) {
    h += '<div style="margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)">'
      + '<button onclick="deleteTrip()" style="width:100%;padding:13px;background:transparent;border:1.5px solid var(--no);border-radius:var(--r);color:var(--no);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px"><i class="ti ti-trash"></i>여행 삭제하기</button>'
      + '</div>';
  }
  el.innerHTML=h;
  updateSettingNights();
}

function updateSettingNights(){var s=(document.getElementById('set-start')||{}).value,e=(document.getElementById('set-end')||{}).value,badge=document.getElementById('set-nights');if(!badge)return;if(s&&e&&new Date(e)>=new Date(s)){var n=Math.round((new Date(e)-new Date(s))/86400000);badge.textContent=n===0?'당일치기':(n+'박 '+(n+1)+'일');}else badge.textContent='';}

async function saveName(){var name=(document.getElementById('set-name')||{}).value;if(name)name=name.trim();if(!name)return showToast('여행 이름을 입력해주세요');S.trip.name=name;await dbSet('trip:'+S.code,S.trip);editingName=false;renderTrip();showToast('저장됐어요 ✅');}

async function saveDate(){var s=(document.getElementById('set-start')||{}).value,e=(document.getElementById('set-end')||{}).value;if(!s||!e)return showToast('날짜를 선택해주세요');if(new Date(e)<new Date(s))return showToast('종료일이 시작일보다 빨라요');S.trip.startDate=s;S.trip.endDate=e;await dbSet('trip:'+S.code,S.trip);editingDate=false;renderTrip();showToast('저장됐어요 ✅');}

async function deleteTrip(){
  if(!confirm('정말로 이 여행을 삭제할까요? 모든 데이터가 사라져요.')) return;
  try{
    var code=S.code, myUid=S.user.uid;
    await fetch(FB+'/trip_'+code+'.json?auth='+(await getToken()),{method:'DELETE'});
    var members=getMembers();
    for(var i=0;i<members.length;i++){var m=members[i];var mUid=typeof m==='object'?m.uid:null;if(mUid){var tok=await getToken();await fetch(FB+'/user-trips_'+mUid+'/'+code+'.json?auth='+tok,{method:'DELETE'});}}
    var myTok=await getToken();await fetch(FB+'/user-trips_'+myUid+'/'+code+'.json?auth='+myTok,{method:'DELETE'});
    stopSync();S.trip=null;S.code='';S.me='';showToast('여행이 삭제됐어요');go('home');
  }catch(e){showToast('삭제 실패: '+(e.message||e));}
}

// ══ 지출 드래그 앤 드롭 ══
function startExpDrag(e, expId, gkey) {
  e.preventDefault(); e.stopPropagation();
  var exp = (S.trip.expenses||[]).find(function(ex){return ex.id===expId;});
  if(!exp) return;
  expDragState = {expId:expId, gkey:gkey};
  expDragGhost = document.createElement('div');
  expDragGhost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;opacity:.9;background:#fff;border:2px solid var(--A);border-radius:12px;padding:10px 14px;box-shadow:0 4px 20px rgba(0,0,0,.2);font-family:inherit;white-space:nowrap;transform:rotate(1deg);font-size:14px;font-weight:700;color:var(--text)';
  expDragGhost.textContent = exp.title + ' · ' + Math.round(exp.amount).toLocaleString('ko-KR') + '원';
  document.body.appendChild(expDragGhost);
  var pt = e.touches?e.touches[0]:e;
  expDragGhost.style.left=(pt.clientX-60)+'px'; expDragGhost.style.top=(pt.clientY-20)+'px';
  if(e.touches){document.addEventListener('touchmove',onExpDragMove,{passive:false});document.addEventListener('touchend',onExpDragEnd,{once:true});}
  else{document.addEventListener('mousemove',onExpDragMove);document.addEventListener('mouseup',onExpDragEnd,{once:true});}
}
function onExpDragMove(e){
  if(e.cancelable) e.preventDefault();
  var pt=e.touches?e.touches[0]:e;
  if(expDragGhost){expDragGhost.style.left=(pt.clientX-60)+'px';expDragGhost.style.top=(pt.clientY-20)+'px';}
  // 드롭 대상 강조
  if(expDragGhost) expDragGhost.style.display='none';
  var el=document.elementFromPoint(pt.clientX,pt.clientY);
  if(expDragGhost) expDragGhost.style.display='';
  var card=el&&el.closest('[data-exp-id]');
  document.querySelectorAll('[data-exp-id]').forEach(function(c){c.style.outline='';});
  if(card&&card.dataset.expId!==expDragState.expId&&card.dataset.expGkey===expDragState.gkey){
    card.style.outline='2px solid var(--A)';
  }
}
function onExpDragEnd(e){
  document.removeEventListener('touchmove',onExpDragMove);
  document.removeEventListener('mousemove',onExpDragMove);
  if(expDragGhost){expDragGhost.remove();expDragGhost=null;}
  document.querySelectorAll('[data-exp-id]').forEach(function(c){c.style.outline='';});
  if(!expDragState) return;
  var pt=e.touches?e.changedTouches[0]:e;
  var el=document.elementFromPoint(pt.clientX,pt.clientY);
  var targetCard=el&&el.closest('[data-exp-id]');
  if(targetCard&&targetCard.dataset.expId!==expDragState.expId&&targetCard.dataset.expGkey===expDragState.gkey){
    var targetId=targetCard.dataset.expId;
    var exps=S.trip.expenses;
    // 같은 그룹 내 순서 변경
    var srcIdx=exps.findIndex(function(ex){return ex.id===expDragState.expId;});
    var tgtIdx=exps.findIndex(function(ex){return ex.id===targetId;});
    if(srcIdx>=0&&tgtIdx>=0){
      var item=exps.splice(srcIdx,1)[0];
      var newTgt=exps.findIndex(function(ex){return ex.id===targetId;});
      exps.splice(newTgt,0,item);
      dbSet('trip:'+S.code,S.trip);
      renderExpenses();
      showToast('순서를 변경했어요');
    }
  }
  expDragState=null;
}

// ══ 드래그 앤 드롭 ══
var dragState=null,dragGhost=null,dropTargetId=null;
var expDragState=null,expDragGhost=null;
function startDrag(dayId,actId,e){
  e.preventDefault();e.stopPropagation();
  var day=S.trip.itinerary.find(function(d){return d.id===dayId;});
  var act=day&&day.activities.find(function(a){return a.id===actId;});
  if(!act) return;
  dragState={dayId:dayId,actId:actId,act:act};dropTargetId=null;
  dragGhost=document.createElement('div');
  dragGhost.style.cssText='position:fixed;z-index:9999;pointer-events:none;opacity:.85;min-width:200px;max-width:320px;background:#fff;border:2px solid var(--A);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-family:inherit;';
  dragGhost.innerHTML='<div style="display:flex;align-items:center;gap:8px">'+(act.time?'<span style="font-size:12px;color:var(--A);font-weight:700;flex-shrink:0">'+act.time+'</span>':'')+'<span style="font-size:14px;font-weight:700">'+act.title+'</span></div>'+(act.location?'<p style="font-size:12px;color:#8A6B52;margin-top:4px">📍 '+act.location+'</p>':'');
  document.body.appendChild(dragGhost);
  document.querySelectorAll('.day-card').forEach(function(c){if(c.dataset.dropDay!==dayId){c.style.border='2px dashed var(--AL)';c.style.background='#fdf8ef';}});
  var pt=e.touches?e.touches[0]:e;posGhost(pt.clientX,pt.clientY);
  if(e.touches){document.addEventListener('touchmove',onDragMove,{passive:false});document.addEventListener('touchend',onDragEnd,{once:true});}
  else{document.addEventListener('mousemove',onDragMove);document.addEventListener('mouseup',onDragEnd,{once:true});}
}
function posGhost(x,y){
  if(!dragGhost) return;
  dragGhost.style.left=(x+16)+'px'; dragGhost.style.top=(y-16)+'px';
  // 기존 플레이스홀더 제거
  document.querySelectorAll('.drag-placeholder').forEach(function(p){p.remove();});
  dragGhost.style.display='none';
  var el=document.elementFromPoint(x,y);
  dragGhost.style.display='';
  var targetRow=el&&el.closest('.act-row');
  var targetZone=el&&el.closest('[data-drop-day]');
  var newDayId=targetZone?targetZone.dataset.dropDay:null;
  // 이전 강조 제거
  document.querySelectorAll('.day-card').forEach(function(c){c.style.border='';c.style.background='';});
  if(newDayId&&newDayId!==dragState.dayId){
    // 다른 날 카드 강조
    var dayCard=document.querySelector('[data-drop-day="'+newDayId+'"]');
    if(dayCard){dayCard.style.border='2px solid var(--A)';dayCard.style.background='var(--AX)';}
  }
  // 같은 날 내 플레이스홀더
  if(targetRow&&targetRow.dataset.actId!==dragState.actId){
    var ph=document.createElement('div');
    ph.className='drag-placeholder';
    ph.style.cssText='height:4px;background:var(--A);border-radius:2px;margin:2px 0;opacity:.8;';
    targetRow.parentNode.insertBefore(ph,targetRow);
    dropTargetId=newDayId||dragState.dayId;
    dragState.dropBeforeActId=targetRow.dataset.actId;
  } else {
    dropTargetId=newDayId;
    dragState.dropBeforeActId=null;
  }
}
function onDragMove(e){if(e.cancelable)e.preventDefault();var pt=e.touches?e.touches[0]:e;posGhost(pt.clientX,pt.clientY);}
function onDragEnd(e){
  document.removeEventListener('touchmove',onDragMove);document.removeEventListener('mousemove',onDragMove);
  if(dragGhost){dragGhost.remove();dragGhost=null;}
  document.querySelectorAll('.drag-placeholder').forEach(function(p){p.remove();});
  document.querySelectorAll('.day-card').forEach(function(c){c.style.border='';c.style.background='';});
  if(!dragState){return;}
  var srcDay=S.trip.itinerary.find(function(d){return d.id===dragState.dayId;});
  if(dropTargetId&&dropTargetId!==dragState.dayId){
    // 다른 날로 이동
    var dstDay=S.trip.itinerary.find(function(d){return d.id===dropTargetId;});
    if(srcDay&&dstDay){
      srcDay.activities=srcDay.activities.filter(function(a){return a.id!==dragState.actId;});
      if(dragState.dropBeforeActId){
        var bi=dstDay.activities.findIndex(function(a){return a.id===dragState.dropBeforeActId;});
        if(bi>=0) dstDay.activities.splice(bi,0,dragState.act);
        else dstDay.activities.push(dragState.act);
      } else { dstDay.activities.push(dragState.act); }
      dbSet('trip:'+S.code,S.trip); renderSchedule(); showToast('일정을 이동했어요');
    }
  } else if(dragState.dropBeforeActId&&dragState.dropBeforeActId!==dragState.actId){
    // 같은 날 내 순서 변경
    if(srcDay){
      var acts=srcDay.activities;
      var fi=acts.findIndex(function(a){return a.id===dragState.actId;});
      var ti=acts.findIndex(function(a){return a.id===dragState.dropBeforeActId;});
      if(fi>=0&&ti>=0){
        acts.splice(fi,1);
        var ni=acts.findIndex(function(a){return a.id===dragState.dropBeforeActId;});
        acts.splice(ni,0,dragState.act);
        dbSet('trip:'+S.code,S.trip); renderSchedule(); showToast('순서를 변경했어요');
      }
    }
  }
  dragState=null; dropTargetId=null;
}

</script>
