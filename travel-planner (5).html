<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>같이 가자 ✈️</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F7F3EE;--card:#fff;--border:#E5D9CC;--bm:#D4C4B2;--text:#1A0F05;--muted:#8A6B52;--A:#BA7517;--AX:#FAF0D7;--AL:#FAC775;--ok:#1A7A5A;--no:#CC3333;--r:12px;--rl:16px}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
input,button,textarea{font-family:inherit;font-size:16px}
input,textarea{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;height:50px}
textarea{height:auto;min-height:80px}
input:focus,textarea:focus{border-color:var(--A);box-shadow:0 0 0 3px rgba(186,117,23,.12)}
input[type=date]{color:var(--text)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
.bp{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--A);color:#412402;border:none;border-radius:var(--r);padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s,transform .1s}
.bp:active{opacity:.85;transform:scale(.98)}
.bg{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--muted);border:1.5px solid var(--bm);border-radius:var(--r);padding:13px 18px;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;font-family:inherit}
.bg:active{background:#f0ebe4}
.bt{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px 8px;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.bd{background:none;border:none;color:var(--no);cursor:pointer;font-size:14px;padding:6px 8px;opacity:.7;font-family:inherit}
.bd:active{opacity:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:10px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;letter-spacing:.2px}
.err{background:#FEE8E8;color:#B22222;border-radius:10px;padding:12px 14px;font-size:14px;display:none;margin-bottom:10px;line-height:1.5}
.chip{border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;background:transparent;color:var(--muted);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:4px;transition:all .15s;font-family:inherit}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--AX);color:var(--A);border-color:var(--A)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.tab{flex:1;border:none;background:none;padding:13px 4px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;font-family:inherit}
.tab.on{color:var(--A);border-bottom-color:var(--A)}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem 2rem;background:var(--bg)}
.page.top{justify-content:flex-start;padding-top:3rem}
.fw{width:100%;max-width:420px}
.bw{display:flex;justify-content:space-between;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--A);flex-shrink:0}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.35}
.empty p{font-size:14px;line-height:1.6}
.code-box{background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--rl);padding:16px 18px}
.big-code{font-size:22px;font-weight:900;letter-spacing:5px;color:var(--A);margin:4px 0 2px;word-break:break-all}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:#f5f0ea;border-radius:var(--r);padding:12px 8px;text-align:center}
.more-btn{width:100%;padding:12px;background:transparent;border:1.5px dashed var(--bm);border-radius:var(--r);color:var(--muted);font-size:13px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:2px;font-family:inherit}
.trip-hd{background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:30}
.content{padding:14px 14px 2rem;max-width:600px;margin:0 auto}
.recent-item{background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s,box-shadow .15s;-webkit-user-select:none;user-select:none}
.recent-item:active{border-color:var(--A);box-shadow:0 2px 12px rgba(186,117,23,.15)}
.act-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);align-items:flex-start}
.act-time{font-size:11px;color:var(--A);font-weight:700;min-width:38px;padding-top:3px;flex-shrink:0}
/* 날짜 범위 */
.date-range{background:#fff;border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.date-range-row{display:grid;grid-template-columns:1fr 1px 1fr}
.date-range input{border:none;border-radius:0;box-shadow:none;padding:13px 12px;background:transparent}
.date-range input:focus{border:none;box-shadow:none;background:var(--AX)}
.date-range-div{background:var(--border);width:1px}
.nights-badge{text-align:center;padding:8px 12px;background:#f5f0ea;font-size:13px;font-weight:700;color:var(--A);border-top:1px solid var(--border)}
/* 복사 버튼 */
.copy-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(186,117,23,.12);border:1.5px solid var(--AL);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--A);cursor:pointer;font-family:inherit;width:100%;transition:background .15s}
.copy-btn:active{background:rgba(186,117,23,.22)}
[id^="s-"]{display:none}
#s-land{display:flex}
@media(max-width:380px){.big-code{font-size:26px;letter-spacing:5px}.tab{font-size:12px;gap:3px}}
</style>
</head>
<body>

<!-- LANDING -->
<div id="s-land" class="page top">
  <div class="fw">
    <div style="text-align:center;margin-bottom:2rem">
      <i class="ti ti-plane-departure" style="font-size:52px;color:var(--A);margin-bottom:14px;display:block"></i>
      <h1 style="font-size:30px;font-weight:900;margin-bottom:8px;letter-spacing:-1px">같이 가자</h1>
      <p style="color:var(--muted);font-size:15px;line-height:1.8">친구들과 여행 일정과 비용 정산을<br>한 곳에서 관리해요</p>
    </div>
    <div class="col" style="gap:10px;margin-bottom:2rem">
      <button class="bp" onclick="go('create')"><i class="ti ti-map-plus"></i>새 여행 만들기</button>
      <button class="bg" style="width:100%" onclick="go('join')"><i class="ti ti-key"></i>코드로 참여하기</button>
    </div>
    <div id="recent-wrap"></div>
  </div>
</div>

<!-- CREATE -->
<div id="s-create" class="page">
  <div class="fw col">
    <button class="bt" onclick="go('land')" style="align-self:flex-start;padding-left:0"><i class="ti ti-arrow-left"></i>뒤로</button>
    <h2 style="font-size:24px;font-weight:900">새 여행 만들기</h2>
    <div id="err-create" class="err"></div>
    <div>
      <label class="lbl">여행 이름</label>
      <input id="inp-tname" placeholder="제주도 여름 여행" maxlength="10" autocomplete="off">
    </div>
    <div>
      <label class="lbl">여행 날짜</label>
      <div class="date-range">
        <div class="date-range-row">
          <div>
            <div style="font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 0;letter-spacing:.3px">시작일</div>
            <input id="inp-start" type="date" onchange="onStartChange()">
          </div>
          <div class="date-range-div"></div>
          <div>
            <div style="font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 0;letter-spacing:.3px">종료일</div>
            <input id="inp-end" type="date" onchange="updateNights()">
          </div>
        </div>

      </div>
    </div>
    <p id="nights-badge" style="display:none;font-size:13px;color:var(--A);text-align:right"></p>
    <button class="bp" onclick="doCreate()">여행 만들기 <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<!-- JOIN -->
<div id="s-join" class="page">
  <div class="fw col">
    <button class="bt" onclick="go('land')" style="align-self:flex-start;padding-left:0"><i class="ti ti-arrow-left"></i>뒤로</button>
    <h2 style="font-size:24px;font-weight:900">여행 참여하기</h2>
    <p style="font-size:15px;color:var(--muted)">친구에게 받은 코드를 입력해주세요</p>
    <div id="err-join" class="err"></div>
    <div>
      <label class="lbl">여행 코드</label>
      <input id="inp-jcode" placeholder="ABC123" style="font-size:22px;font-weight:900;letter-spacing:5px;text-align:center" oninput="this.value=this.value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,6)" autocomplete="off" autocapitalize="characters">
    </div>
    <button class="bp" onclick="doJoin()">참여하기 <i class="ti ti-arrow-right"></i></button>
  </div>
</div>

<!-- NICKNAME -->
<div id="s-nick" class="page">
  <div class="fw col">
    <h2 style="font-size:24px;font-weight:900">입장하기</h2>
    <div id="err-nick" class="err"></div>
    <div>
      <label class="lbl">닉네임</label>
      <input id="inp-nick" placeholder="철수귀요미" oninput="this.value=this.value.replace(/\s/g,'').slice(0,10)" autocomplete="off" autocorrect="off" autocapitalize="off">
    </div>
    <div>
      <label class="lbl">이름</label>
      <input id="inp-name" placeholder="김철수" oninput="this.value=this.value.replace(/\s/g,'').slice(0,10)" autocomplete="off">
    </div>
    <button class="bp" onclick="doNick()">입장하기 <i class="ti ti-arrow-right"></i></button>
    <div class="code-box" style="margin-top:4px">
      <p style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">여행 코드</p>
      <p id="disp-code" class="big-code"></p>
      <button class="copy-btn" style="margin-top:8px" onclick="copyCode()">
        <i class="ti ti-copy"></i>여행 코드 공유하기
      </button>
    </div>
  </div>
</div>

<!-- TRIP -->
<div id="s-trip">
  <div class="trip-hd">
    <div class="bw" style="max-width:600px;margin:0 auto">
      <div style="flex:1;min-width:0;margin-right:10px">
        <h2 id="trip-name" style="font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></h2>
        <p id="trip-dates" style="font-size:12px;color:var(--muted);margin-top:2px"></p>
        <p id="trip-me" style="font-size:12px;color:var(--muted);margin-top:2px"></p>
      </div>
      <button onclick="toggleCode()" style="background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--r);padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--A);white-space:nowrap;font-family:inherit;flex-shrink:0"><i class="ti ti-key"></i> 코드</button>
    </div>
    <div id="code-panel" style="display:none;max-width:600px;margin:12px auto 0;background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--r);padding:14px 16px">
      <p style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">친구들에게 공유하세요</p>
      <p id="share-code" style="font-size:26px;font-weight:900;letter-spacing:8px;color:var(--A);margin-bottom:8px"></p>
      <button class="copy-btn" onclick="copyCode()" style="background:rgba(186,117,23,.08)"><i class="ti ti-copy"></i>코드 복사하기</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="schedule" onclick="switchTab('schedule')"><i class="ti ti-calendar" style="font-size:14px"></i>일정</button>
    <button class="tab" data-tab="expenses" onclick="switchTab('expenses')"><i class="ti ti-credit-card" style="font-size:14px"></i>비용</button>
    <button class="tab" data-tab="settle" onclick="switchTab('settle')"><i class="ti ti-receipt" style="font-size:14px"></i>정산</button>
    <button class="tab" data-tab="members" onclick="switchTab('members')"><i class="ti ti-users" style="font-size:14px"></i>멤버</button>
  </div>
  <div class="content">
    <div id="tab-schedule"></div>
    <div id="tab-expenses" style="display:none"></div>
    <div id="tab-settle" style="display:none"></div>
    <div id="tab-members" style="display:none"></div>
  </div>
</div>

<script>
// ── 상태 ──
const MEM = new Map();
const S = { trip: null, me: '', myName: '', code: '', pendingCode: '' };
let showAllRecent = false;
// 일정 폼 상태 (5초 재렌더 시 유지용)
let openDayForm = false;
let openActForms = new Set();
let actMoreFields = new Set(); // 장소/메모 펼친 dayId
let editActState = {}; // {dayId_actId: true}
// 비용 폼 상태
let EF = { open: false, title: '', amount: '', paidBy: '', split: [], cat: '식비', dayId: '', currency: 'KRW' };
let rateCache = {}; // { USD: 1350, JPY: 9.2, ... }

const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
const mkCode = () => Math.random().toString(36).substr(2, 6).toUpperCase();
const fmt = n => Math.round(n).toLocaleString('ko-KR');

// ── Firebase REST API ──
const FB = "https://maybe-fire-default-rtdb.asia-southeast1.firebasedatabase.app";
function fbKey(k) { return k.replace(/:/g, '_'); }

function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

async function dbGetFresh(k) {
  MEM.delete(k);
  return dbGet(k);
}

async function dbGet(k) {
  if (MEM.has(k)) return JSON.parse(MEM.get(k));
  const ls = lsGet(k); if (ls !== null) { MEM.set(k, JSON.stringify(ls)); return ls; }
  try {
    const r = await fetch(FB + '/' + fbKey(k) + '.json');
    const val = await r.json();
    if (val !== null && val !== undefined) {
      MEM.set(k, JSON.stringify(val));
      lsSet(k, val);
      return val;
    }
  } catch(e) { console.warn('dbGet fail', e); }
  return null;
}

async function dbSet(k, v) {
  MEM.set(k, JSON.stringify(v));
  lsSet(k, v);
  try {
    await fetch(FB + '/' + fbKey(k) + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(v)
    });
  } catch(e) {
    console.warn('dbSet fail', e);
    showToast('저장 실패. 인터넷 연결을 확인해주세요 📶');
  }
}

// ── 멤버 헬퍼 ──
function getMembers() { return S.trip?.members || []; }
function getNicks() { return getMembers().map(m => typeof m === 'object' ? m.nickname : m); }
function getMemberName(nick) {
  const m = getMembers().find(m => (typeof m === 'object' ? m.nickname : m) === nick);
  if (!m) return nick;
  return typeof m === 'object' ? (m.name || m.nickname) : m;
}

// ── 날짜 → 일정 자동 생성 ──
function autoPopulateDays(t) {
  if (!t.startDate || t.itinerary.length > 0) return t;
  const start = new Date(t.startDate + 'T00:00:00');
  const end = t.endDate ? new Date(t.endDate + 'T00:00:00') : start;
  let cur = new Date(start), i = 1;
  while (cur <= end && i <= 31) {
    t.itinerary.push({ id: uid(), label: i + '일차', date: cur.toISOString().split('T')[0], activities: [], auto: true });
    cur.setDate(cur.getDate() + 1); i++;
  }
  return t;
}

// ── 박/일 계산 ──
function onStartChange() {
  const s = document.getElementById('inp-start').value;
  const endInput = document.getElementById('inp-end');
  if (s) {
    // 종료일 최소값을 시작일 다음날로 설정
    const next = new Date(s + 'T00:00:00');
    next.setDate(next.getDate() + 1);
    const minEnd = next.toISOString().split('T')[0];
    endInput.min = minEnd;
    // 종료일이 시작일보다 같거나 이전이면 초기화
    if (endInput.value && endInput.value <= s) endInput.value = '';
    // 종료일 자동 포커스
    endInput.focus();
  }
  updateNights();
}

function updateNights() {
  const s = document.getElementById('inp-start').value;
  const e = document.getElementById('inp-end').value;
  const badge = document.getElementById('nights-badge');
  if (!badge) return;
  if (s && e) {
    const ms = new Date(e) - new Date(s);
    if (ms >= 0) {
      const nights = Math.round(ms / 86400000);
      const days = nights + 1;
      badge.textContent = nights === 0 ? '당일치기' : `${nights}박 ${days}일`;
      badge.style.display = 'block';
      return;
    }
  }
  badge.style.display = 'none';
}

// ── 코드 복사 ──
function copyCode() {
  const code = S.pendingCode || S.code;
  if (!code) return;
  const txt = `같이 가자! 여행 코드: ${code}\n앱에서 "코드로 참여하기"를 누르고 코드를 입력해줘 👉 ${location.href}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => showToast('코드가 복사됐어요! 📋'));
  } else {
    const el = document.createElement('textarea');
    el.value = txt; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    showToast('코드가 복사됐어요! 📋');
  }
}

// ── 토스트 ──
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1A0F05;color:#fff;padding:12px 20px;border-radius:100px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:opacity .3s;white-space:nowrap'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = '0', 2000);
}

// ── 네비게이션 ──
function go(screen) {
  document.querySelectorAll('[id^="s-"]').forEach(e => e.style.display = 'none');
  const el = document.getElementById('s-' + screen); if (!el) return;
  el.style.display = screen === 'trip' ? 'block' : 'flex';
  if (screen === 'trip') window.scrollTo(0, 0);
  if (screen === 'land') renderRecent();
}
function showErr(id, msg) { const e = document.getElementById(id); if (e) { e.textContent = msg; e.style.display = msg ? 'block' : 'none'; } }

// ── 여행 만들기 ──
async function doCreate() {
  const name = document.getElementById('inp-tname').value.trim();
  const startDate = document.getElementById('inp-start').value;
  const endDate = document.getElementById('inp-end').value;
  if (!name) return showErr('err-create', '여행 이름을 입력해주세요');
  if (!startDate) return showErr('err-create', '시작일을 선택해주세요');
  if (!endDate) return showErr('err-create', '종료일을 선택해주세요');
  if (new Date(endDate) < new Date(startDate)) return showErr('err-create', '종료일이 시작일보다 빨라요');
  const btn = document.querySelector('#s-create .bp');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  const c = mkCode();
  const t = { name, code: c, startDate, endDate, members: [], itinerary: [], expenses: [], createdAt: Date.now() };
  await dbSet('trip:' + c, t);
  if (btn) { btn.disabled = false; btn.innerHTML = '여행 만들기 <i class="ti ti-arrow-right"></i>'; }
  S.pendingCode = c;
  document.getElementById('disp-code').textContent = c;
  document.getElementById('inp-nick').value = '';
  document.getElementById('inp-name').value = '';
  showErr('err-create', ''); go('nick');
}

// ── 코드 참여 ──
async function doJoin() {
  const c = document.getElementById('inp-jcode').value.trim().toUpperCase();
  if (!c) return showErr('err-join', '코드를 입력해주세요');
  if (c.length < 6) return showErr('err-join', '코드는 6자리예요');
  const btn = document.querySelector('#s-join .bp');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중...'; }
  showErr('err-join', '');
  const t = await dbGet('trip:' + c);
  if (btn) { btn.disabled = false; btn.innerHTML = '참여하기 <i class="ti ti-arrow-right"></i>'; }
  if (!t) return showErr('err-join', '존재하지 않는 여행 코드예요. 코드를 다시 확인해주세요.');
  S.pendingCode = c;
  document.getElementById('disp-code').textContent = c;
  document.getElementById('inp-nick').value = '';
  document.getElementById('inp-name').value = '';
  showErr('err-join', ''); go('nick');
}

// ── 입장 ──
async function doNick() {
  const nick = document.getElementById('inp-nick').value.trim();
  const realName = document.getElementById('inp-name').value.trim();
  if (!nick) return showErr('err-nick', '닉네임을 입력해주세요');
  if (!realName) return showErr('err-nick', '이름을 입력해주세요');

  const btn = document.querySelector('#s-nick .bp');
  if (btn) { btn.disabled = true; btn.textContent = '입장 중...'; }
  showErr('err-nick', '');

  try {
    let t = await dbGet('trip:' + S.pendingCode);
    if (!t) {
      // MEM/localStorage에 없으면 Firebase에서 강제로 다시 가져오기
      MEM.delete('trip:' + S.pendingCode);
      t = await dbGet('trip:' + S.pendingCode);
    }
    if (!t) throw new Error('여행을 찾을 수 없어요. 코드를 다시 확인해주세요.');
    const existing = t.members.find(m => (typeof m === 'object' ? m.nickname : m) === nick);
    if (!existing) t.members.push({ nickname: nick, name: realName });
    t = autoPopulateDays(t);
    t.itinerary = t.itinerary || [];
    t.expenses = t.expenses || [];
    t.members = t.members || [];
    await dbSet('trip:' + S.pendingCode, t);
    await dbSet('profile:' + S.pendingCode, { nickname: nick, name: realName });
    S.trip = t; S.code = S.pendingCode; S.me = nick; S.myName = realName;
    saveRecent(S.pendingCode, t.name);
    go('trip');
    renderTrip();
    startSync(S.code);
  } catch(e) {
    showErr('err-nick', e.message || '오류가 발생했어요. 다시 시도해주세요.');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '입장하기 <i class="ti ti-arrow-right"></i>'; }
  }
}

// ── 최근 여행 ──
async function saveRecent(code, name) {
  let list = await dbGet('recent-trips') || [];
  list = list.filter(r => r.code !== code);
  list.unshift({ code, name, at: Date.now() });
  if (list.length > 10) list = list.slice(0, 10);
  dbSet('recent-trips', list);
}
async function renderRecent() {
  const el = document.getElementById('recent-wrap'); if (!el) return;
  const rawList = await dbGet('recent-trips') || [];
  const list = [];
  for (const r of rawList) { const t = await dbGet('trip:' + r.code); if (t) list.push(r); }
  if (!list.length) { el.innerHTML = ''; return; }
  const visible = showAllRecent ? list : list.slice(0, 2);
  const hiddenCount = list.length - visible.length;
  let h = '<p style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px">최근 여행</p>';
  for (const r of visible) {
    const t = await dbGet('trip:' + r.code);
    if (!t) continue;
    const d = t.startDate ? (t.endDate ? t.startDate + ' ~ ' + t.endDate : t.startDate) : '날짜 미정';
    h += `<div class="recent-item" onclick="quickJoin('${r.code}')">
      <div style="width:44px;height:44px;border-radius:50%;background:var(--AX);border:1.5px solid var(--AL);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">✈️</div>
      <div style="flex:1;min-width:0">
        <p style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</p>
        <p style="font-size:12px;color:var(--muted);margin-top:3px">${d} · <span style="font-weight:700;color:var(--A);letter-spacing:1px">${r.code}</span></p>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--muted);font-size:18px;flex-shrink:0"></i>
    </div>`;
  }
  if (hiddenCount > 0) h += `<button class="more-btn" onclick="toggleMore()"><i class="ti ti-chevron-down"></i>더보기 (${hiddenCount}개)</button>`;
  else if (list.length > 2 && showAllRecent) h += `<button class="more-btn" onclick="toggleMore()"><i class="ti ti-chevron-up"></i>접기</button>`;
  el.innerHTML = h;
}
function toggleMore() { showAllRecent = !showAllRecent; renderRecent(); }
async function quickJoin(code) {
  const profile = await dbGet('profile:' + code);
  if (profile) {
    let t = await dbGet('trip:' + code);
    if (t) {
      const existing = t.members.find(m => (typeof m === 'object' ? m.nickname : m) === profile.nickname);
      if (!existing) t.members.push({ nickname: profile.nickname, name: profile.name });
      t = autoPopulateDays(t);
      dbSet('trip:' + code, t);
      S.trip = t; S.code = code; S.me = profile.nickname; S.myName = profile.name;
      S.pendingCode = code;
      saveRecent(code, t.name);
      renderTrip(); go('trip');
      startSync(code); return;
    }
  }
  S.pendingCode = code;
  document.getElementById('disp-code').textContent = code;
  document.getElementById('inp-nick').value = '';
  document.getElementById('inp-name').value = '';
  showErr('err-nick', ''); go('nick');
}

// ── 코드 패널 ──
function toggleCode() { const p = document.getElementById('code-panel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }

// ── 여행 헤더 ──
function renderTrip() {
  const t = S.trip;
  document.getElementById('trip-name').textContent = t.name;
  document.getElementById('trip-dates').textContent = t.startDate ? (t.endDate ? t.startDate + ' ~ ' + t.endDate : t.startDate) : '';
  document.getElementById('trip-me').innerHTML = `<i class="ti ti-user" style="font-size:11px;margin-right:3px"></i>${S.me} · ${S.myName}`;
  document.getElementById('share-code').textContent = S.code;
  // 현재 탭만 렌더링
  const activeTab = document.querySelector('.tab.on')?.dataset.tab || 'schedule';
  renderTabSafe(activeTab);
}
function renderTabSafe(n) {
  if (n === 'schedule') renderSchedule();
  else if (n === 'expenses') renderExpenses();
  else if (n === 'settle') renderSettle();
  else if (n === 'members') renderMembers();
}
function switchTab(n) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === n));
  ['schedule', 'expenses', 'settle', 'members'].forEach(t => { document.getElementById('tab-' + t).style.display = t === n ? 'block' : 'none'; });
  renderTabSafe(n);
}

// ══════════════════════════════════════════════════
// 일정 탭
// ══════════════════════════════════════════════════
function renderSchedule() {
  // 폼 열려있으면 스킵 (타이핑 중 사라지는 버그 방지)
  if (openDayForm || openActForms.size > 0) {
    const focused = document.activeElement;
    if (focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA')) return;
  }

  const el = document.getElementById('tab-schedule');
  const days = S.trip.itinerary || [];
  let h = `<div class="bw" style="margin-bottom:14px">
    <h3 style="font-size:17px;font-weight:900">여행 일정</h3>
    <button class="bt" onclick="toggleDF()"><i class="ti ti-plus"></i> 날 추가</button>
  </div>
  <div id="day-form" class="card" style="display:${openDayForm ? 'block' : 'none'}">
    <p style="font-size:15px;font-weight:700;margin-bottom:14px">새 날 추가</p>
    <div class="col">
      <div><label class="lbl">날 이름</label><input id="df-label" placeholder="${days.length + 1}일차" autocomplete="off"></div>
      <div><label class="lbl">날짜 (선택)</label><input id="df-date" type="date" style="width:100%;min-width:0"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="bg" onclick="toggleDF()">취소</button>
        <button class="bp" style="width:auto;padding:12px 20px" onclick="addDay()">추가</button>
      </div>
    </div>
  </div>`;

  if (!days.length) h += `<div class="card"><div class="empty"><i class="ti ti-calendar-off"></i><p>"날 추가" 버튼으로 일정을 시작해보세요</p></div></div>`;

  days.forEach(day => {
    const actOpen = openActForms.has(day.id);
    h += `<div class="card day-card" data-drop-day="${day.id}" style="transition:background .2s,border-color .2s">
      <div class="bw" style="margin-bottom:10px">
        <div style="flex:1;min-width:0">
          <span style="font-weight:900;font-size:15px;color:var(--A)">${day.label}</span>
          ${day.date ? `<span style="font-size:13px;color:var(--muted);margin-left:8px">${day.date}</span>` : ''}
        </div>
        <div style="display:flex;gap:2px;flex-shrink:0">
          <button class="bt" onclick="toggleAF('${day.id}')"><i class="ti ti-plus"></i> 일정</button>
          ${day.auto ? '' : `<button class="bd" onclick="removeDay('${day.id}')"><i class="ti ti-trash"></i></button>`}
        </div>
      </div>`;

    if (!day.activities.length && !actOpen) h += `<p style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">아직 일정이 없어요</p>`;

    day.activities.forEach(act => {
      const editKey = day.id + '_' + act.id;
      if (editActState[editKey]) {
        // 인라인 수정 폼
        h += `<div style="padding:12px 0;border-top:1px solid var(--border)" id="edit-${editKey}">
          <p style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--A)">일정 수정</p>
          <div class="col">
            <div><label class="lbl">내용 *</label><input id="en-${editKey}" value="${act.title}" autocomplete="off"></div>
            <div><label class="lbl">시간 (선택)</label><input id="et-${editKey}" type="text" value="${act.time||''}" placeholder="00:00" pattern="[0-2][0-9]:[0-5][0-9]" inputmode="numeric" maxlength="5" oninput="fmtTime(this)" autocomplete="off"></div>
            <div><label class="lbl">장소</label><input id="el-${editKey}" value="${act.location||''}" placeholder="한라산 국립공원" autocomplete="off"></div>
            <div><label class="lbl">메모</label><input id="em-${editKey}" value="${act.note||''}" placeholder="준비물, 예약번호..." autocomplete="off"></div>
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button class="bg" onclick="cancelEditAct('${editKey}')">취소</button>
              <button class="bp" style="width:auto;padding:12px 20px" onclick="saveEditAct('${day.id}','${act.id}','${editKey}')">저장</button>
            </div>
          </div>
        </div>`;
      } else {
        h += `<div class="act-row" data-act-id="${act.id}" data-day-id="${day.id}">
          <button class="drag-handle"
            onmousedown="startDrag('${day.id}','${act.id}',event)"
            ontouchstart="startDrag('${day.id}','${act.id}',event)"
            style="background:none;border:none;cursor:grab;padding:4px 2px;color:#ccc;font-size:18px;touch-action:none;flex-shrink:0;align-self:center">
            <i class="ti ti-grip-vertical"></i>
          </button>
          ${act.time ? `<span class="act-time">${act.time}</span>` : ''}
          <div style="flex:1;min-width:0">
            <p style="font-size:14px;font-weight:700">${act.title}</p>
            ${act.location ? `<p style="font-size:12px;color:var(--muted);margin-top:3px"><i class="ti ti-map-pin" style="font-size:11px;margin-right:2px"></i>${act.location}</p>` : ''}
            ${act.note ? `<p style="font-size:12px;color:var(--muted);margin-top:2px">${act.note}</p>` : ''}
          </div>
          <button class="bt" onclick="startEditAct('${editKey}')" style="color:var(--muted);padding:4px 6px"><i class="ti ti-pencil" style="font-size:15px"></i></button>
          <button class="bd" onclick="removeAct('${day.id}','${act.id}')"><i class="ti ti-x"></i></button>
        </div>`;
      }
    });

    if (actOpen) {
      const hasLoc = actMoreFields.has(day.id + '_loc');
      const hasNote = actMoreFields.has(day.id + '_note');
      let locBtn = hasLoc ? '' : '<button type="button" class="more-field-btn" onclick="toggleMoreFields(\'' + day.id + '_loc\')" style="flex:1;background:none;border:1.5px dashed var(--border);border-radius:8px;padding:8px;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px"><i class="ti ti-map-pin"></i>장소</button>';
      let noteBtn = hasNote ? '' : '<button type="button" class="more-field-btn" onclick="toggleMoreFields(\'' + day.id + '_note\')" style="flex:1;background:none;border:1.5px dashed var(--border);border-radius:8px;padding:8px;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px"><i class="ti ti-note"></i>메모</button>';
      let extraBtns = (locBtn || noteBtn) ? '<div style="display:flex;gap:8px">' + locBtn + noteBtn + '</div>' : '';
      h += '<div id="af-' + day.id + '" style="display:block;border-top:1px solid var(--border);padding-top:14px;margin-top:8px">'
        + '<p style="font-size:14px;font-weight:700;margin-bottom:12px">일정 추가</p>'
        + '<div class="col">'
        + '<div><label class="lbl">시간 (선택)</label><input id="at-' + day.id + '" type="text" placeholder="00:00" inputmode="numeric" maxlength="5" oninput="fmtTime(this)" autocomplete="off"></div>'
        + '<div><label class="lbl">내용 *</label><input id="an-' + day.id + '" placeholder="한라산 등반" autocomplete="off"></div>'
        + '<div id="loc-field-' + day.id + '" style="display:' + (hasLoc ? 'block' : 'none') + '"><label class="lbl">장소</label><input id="al-' + day.id + '" placeholder="한라산 국립공원" autocomplete="off"></div>'
        + '<div id="note-field-' + day.id + '" style="display:' + (hasNote ? 'block' : 'none') + '"><label class="lbl">메모</label><input id="am-' + day.id + '" placeholder="준비물, 예약번호..." autocomplete="off"></div>'
        + extraBtns
        + '<div style="display:flex;gap:8px;justify-content:flex-end">'
        + '<button class="bg" onclick="toggleAF(\'' + day.id + '\')">취소</button>'
        + '<button class="bp" style="width:auto;padding:12px 20px" onclick="addAct(\'' + day.id + '\')">추가</button>'
        + '</div></div></div>';
    } else {
      h += '<div id="af-' + day.id + '" style="display:none"></div>';
    }
    h += '</div>';
  });

  el.innerHTML = h;
}

function toggleDF() { openDayForm = !openDayForm; renderSchedule(); }
function toggleAF(id) {
  if (openActForms.has(id)) openActForms.delete(id); else openActForms.add(id);
  renderSchedule();
}
function addDay() {
  const lbl = document.getElementById('df-label').value.trim() || (S.trip.itinerary.length + 1) + '일차';
  S.trip.itinerary.push({ id: uid(), label: lbl, date: document.getElementById('df-date').value, activities: [] });
  // 날짜순 정렬 (날짜 없는 것은 뒤로)
  S.trip.itinerary.sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });
  openDayForm = false;
  dbSet('trip:' + S.code, S.trip); renderSchedule();
}
function removeDay(id) {
  openActForms.delete(id);
  S.trip.itinerary = S.trip.itinerary.filter(d => d.id !== id);
  dbSet('trip:' + S.code, S.trip); renderSchedule();
}
function addAct(dayId) {
  const title = document.getElementById('an-' + dayId)?.value.trim();
  if (!title) return;
  const day = S.trip.itinerary.find(d => d.id === dayId);
  if (day) day.activities.push({
    id: uid(),
    time: document.getElementById('at-' + dayId)?.value || '',
    title,
    location: document.getElementById('al-' + dayId)?.value || '',
    note: document.getElementById('am-' + dayId)?.value || ''
  });
  openActForms.delete(dayId);
  actMoreFields.delete(dayId + '_loc');
  actMoreFields.delete(dayId + '_note');
  dbSet('trip:' + S.code, S.trip); renderSchedule();
}
function fmtTime(input) {
  let v = input.value.replace(/[^0-9]/g, '');
  if (v.length >= 3) v = v.slice(0, 2) + ':' + v.slice(2, 4);
  input.value = v;
}

function toggleMoreFields(key) {
  actMoreFields.add(key);
  // 현재 입력값 보존 - DOM 직접 조작 (renderSchedule 호출 안 함)
  const dayId = key.replace('_loc','').replace('_note','');
  if (key.endsWith('_loc')) {
    const field = document.getElementById('loc-field-' + dayId);
    const btns = field?.parentElement?.querySelector('div[style*="display:flex"]');
    if (field) field.style.display = 'block';
    // 장소 버튼만 숨기기
    if (btns) {
      btns.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('장소')) btn.style.display = 'none';
      });
    }
  } else if (key.endsWith('_note')) {
    const field = document.getElementById('note-field-' + dayId);
    const btns = field?.parentElement?.querySelector('div[style*="display:flex"]');
    if (field) field.style.display = 'block';
    // 메모 버튼만 숨기기
    if (btns) {
      btns.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('메모')) btn.style.display = 'none';
      });
    }
  }
}

function startEditAct(key) { editActState[key] = true; renderSchedule(); }
function cancelEditAct(key) { delete editActState[key]; renderSchedule(); }
function saveEditAct(dayId, actId, key) {
  const title = document.getElementById('en-' + key)?.value.trim();
  if (!title) return;
  const day = S.trip.itinerary.find(d => d.id === dayId);
  const act = day?.activities.find(a => a.id === actId);
  if (act) {
    act.title = title;
    act.time = document.getElementById('et-' + key)?.value || '';
    act.location = document.getElementById('el-' + key)?.value || '';
    act.note = document.getElementById('em-' + key)?.value || '';
  }
  delete editActState[key];
  dbSet('trip:' + S.code, S.trip);
  renderSchedule();
}

function removeAct(dayId, actId) {
  const day = S.trip.itinerary.find(d => d.id === dayId);
  if (day) day.activities = day.activities.filter(a => a.id !== actId);
  dbSet('trip:' + S.code, S.trip); renderSchedule();
}

            <input id="ef-a" type="number" value="${EF.amount}" oninput="EF.amount=this.value;const p=document.getElementById('currency-preview');if(p)p.textContent=getCurrencyPreview()" placeholder="금액 입력" style="padding-right:90px">
            <span id="currency-preview" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--A);font-weight:700;pointer-events:none">${getCurrencyPreview()}</span>
          </div>
        </div>
        <div><label class="lbl">카테고리</label>
          <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:7px">
            ${['식비', '숙박', '교통', '관광', '쇼핑', '기타'].map(c => `<button class="chip${EF.cat === c ? ' on' : ''}" onclick="EF.cat='${c}';renderExpenses()"><i class="ti ti-${CI[c]}"></i>${c}</button>`).join('')}
          </div>
        </div>
        ${nicks.length ? `
        <div><label class="lbl">결제자</label>
          <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:7px">
            ${nicks.map(n => `<button class="chip${EF.paidBy === n ? ' on' : ''}" onclick="EF.paidBy='${n}';renderExpenses()">${getMemberName(n)}</button>`).join('')}
          </div>
        </div>
        <div><label class="lbl">분담 멤버</label>
          <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:7px">
            ${nicks.map(n => `<button class="chip${EF.split.includes(n) ? ' on' : ''}" onclick="toggleSplit('${n}')">${EF.split.includes(n) ? '<i class="ti ti-check" style="font-size:11px"></i>' : ''}${getMemberName(n)}</button>`).join('')}
          </div>
          ${per ? `<p style="font-size:13px;color:var(--muted);margin-top:7px">1인당 ${per}원</p>` : ''}
        </div>` : ''}
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="bg" onclick="EF.open=false;renderExpenses()">취소</button>
          <button class="bp" style="width:auto;padding:12px 20px" onclick="addExp()">추가</button>
        </div>
      </div>
    </div>`;
  }

  if (!exps.length && !EF.open) h += `<div class="card" style="border:2px dashed var(--border);background:transparent;cursor:pointer" onclick="openEF()">
    <div class="empty" style="padding:2rem 1rem">
      <i class="ti ti-plus" style="font-size:36px;display:block;margin-bottom:10px;opacity:.35;color:var(--A)"></i>
      <p style="font-size:15px;font-weight:700;color:var(--A)">지출 추가하기</p>
      <p style="font-size:13px;color:var(--muted);margin-top:4px">여행 중 발생한 비용을 기록해요</p>
    </div>
  </div>`;
  else if (!EF.open && exps.length > 0) h += `<button onclick="openEF()" style="width:100%;margin-top:4px;padding:14px;background:var(--AX);border:1.5px solid var(--AL);border-radius:var(--r);color:var(--A);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px"><i class="ti ti-plus"></i>지출 추가하기</button>`;

  exps.forEach(exp => {
    h += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0">
          <i class="ti ti-${CI[exp.cat] || 'credit-card'}" style="font-size:22px;color:var(--A);flex-shrink:0;padding-top:2px"></i>
          <div style="min-width:0">
            <p style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${exp.title}</p>
            ${exp.dayId ? `<p style="font-size:11px;color:var(--A);font-weight:700;margin-top:2px">${exp.dayId==='pre' ? '사전 예약' : (S.trip.itinerary||[]).find(d=>d.id===exp.dayId)?.label || ''}</p>` : ''}
            ${exp.origAmount ? `<p style="font-size:11px;color:var(--muted);margin-top:2px">${exp.origAmount.toLocaleString()} ${exp.origCurrency} → ${fmt(exp.amount)}원</p>` : ''}
            <p style="font-size:12px;color:var(--muted);margin-top:3px">${getMemberName(exp.paidBy)} 결제 · ${(exp.split || []).length}명 분담</p>
            <p style="font-size:11px;color:var(--muted);margin-top:2px">1인당 ${fmt(exp.amount / ((exp.split || []).length || 1))}원</p>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          <span style="font-weight:900;font-size:16px;color:var(--A);white-space:nowrap">${fmt(exp.amount)}원</span>
          <button class="bd" onclick="removeExp('${exp.id}')"><i class="ti ti-x"></i></button>
        </div>
      </div>
    </div>`;
  });
  el.innerHTML = h;
  // 날짜 칩 동적 생성 (onclick 버그 방지)
  if (EF.open) {
    const chipWrap = el.querySelector('#day-chips');
    if (chipWrap) {
      const preBtn = document.createElement('button');
      preBtn.className = 'chip' + ('pre' === EF.dayId ? ' on' : '');
      preBtn.innerHTML = '<i class="ti ti-calendar-event"></i> 사전 예약';
      preBtn.onclick = () => { EF.dayId = 'pre'; renderExpenses(); };
      chipWrap.appendChild(preBtn);
      (S.trip.itinerary || []).forEach(d => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (d.id === EF.dayId ? ' on' : '');
        btn.innerHTML = d.label + (d.date ? '<span style="font-size:11px;font-weight:400;margin-left:3px">' + d.date.slice(5).replace('-', '/') + '</span>' : '');
        btn.onclick = () => { EF.dayId = d.id; renderExpenses(); };
        chipWrap.appendChild(btn);
      });
    }
  }
}

function openEF() { const nicks = getNicks(); EF = { open: true, title: '', amount: '', paidBy: S.me || nicks[0] || '', split: [...nicks], cat: '식비', dayId: '', currency: 'KRW' }; renderExpenses(); }
function toggleSplit(n) {
  const amt = document.getElementById('ef-a');
  if (amt) EF.amount = amt.value;
  EF.split = EF.split.includes(n) ? EF.split.filter(x => x !== n) : [...EF.split, n];
  renderExpenses();
}
function addExp() {
  const t = document.getElementById('ef-t')?.value.trim();
  const a = parseFloat(document.getElementById('ef-a')?.value);
  if (!t || isNaN(a) || a <= 0) return;
  const nicks = getNicks();
  const krwAmt = EF.currency === 'KRW' ? a : (rateCache[EF.currency] ? Math.round(a * rateCache[EF.currency]) : a);
  S.trip.expenses.push({ id: uid(), title: t, amount: krwAmt, origAmount: EF.currency !== 'KRW' ? a : null, origCurrency: EF.currency !== 'KRW' ? EF.currency : null, paidBy: EF.paidBy, split: EF.split.length ? EF.split : nicks, cat: EF.cat, dayId: EF.dayId });
  dbSet('trip:' + S.code, S.trip); EF.open = false; renderExpenses();
}
function removeExp(id) { S.trip.expenses = S.trip.expenses.filter(e => e.id !== id); dbSet('trip:' + S.code, S.trip); renderExpenses(); }

// ══════════════════════════════════════════════════
// 정산 탭
// ══════════════════════════════════════════════════
function calcSettle(exps, nicks) {
  const bal = {}; nicks.forEach(n => bal[n] = 0);
  exps.forEach(({ amount, paidBy, split }) => {
    const am = split?.length ? split : nicks;
    const sh = amount / am.length;
    am.forEach(n => { if (n in bal) bal[n] -= sh; });
    if (paidBy in bal) bal[paidBy] += amount;
  });
  const pos = [], neg = [];
  for (const [n, v] of Object.entries(bal)) { if (v > 1) pos.push([n, v]); else if (v < -1) neg.push([n, -v]); }
  pos.sort((a, b) => b[1] - a[1]); neg.sort((a, b) => b[1] - a[1]);
  const out = [];
  while (pos.length && neg.length) {
    const [cn, ca] = pos[0], [dn, da] = neg[0], a = Math.min(ca, da);
    out.push({ from: dn, to: cn, amount: Math.round(a) });
    pos[0][1] -= a; neg[0][1] -= a;
    if (pos[0][1] < 1) pos.shift(); if (neg[0][1] < 1) neg.shift();
  }
  return out;
}

function renderSettle() {
  const el = document.getElementById('tab-settle');
  const nicks = getNicks(), exps = S.trip.expenses || [];
  if (nicks.length < 2 || !exps.length) {
    el.innerHTML = `<div class="card"><div class="empty"><i class="ti ti-receipt-off"></i><p>${!exps.length ? '지출 내역을 먼저 추가해주세요' : '멤버가 2명 이상이어야 정산할 수 있어요'}</p></div></div>`; return;
  }
  const total = exps.reduce((s, e) => s + e.amount, 0);
  const txns = calcSettle(exps, nicks);
  const paid = {}; nicks.forEach(n => paid[n] = 0);
  exps.forEach(e => { paid[e.paidBy] = (paid[e.paidBy] || 0) + e.amount; });
  let h = `<h3 style="font-size:17px;font-weight:900;margin-bottom:14px">정산 결과</h3>
  <div class="stat-grid">
    ${[['총 지출', fmt(total) + '원'], ['인원', nicks.length + '명'], ['1인당', fmt(total / nicks.length) + '원']].map(([l, v]) => `<div class="stat-card"><div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px">${l}</div><div style="font-size:15px;font-weight:900;color:var(--A)">${v}</div></div>`).join('')}
  </div>`;
  if (!txns.length) {
    h += `<div class="card" style="text-align:center;padding:2rem"><i class="ti ti-circle-check" style="font-size:40px;color:var(--ok);display:block;margin-bottom:10px"></i><p style="font-size:17px;font-weight:900;color:var(--ok)">정산 완료! 🎉</p><p style="font-size:14px;color:var(--muted);margin-top:5px">모두 균등하게 지불했어요</p></div>`;
  } else {
    h += `<p style="font-size:13px;color:var(--muted);margin-bottom:10px">아래와 같이 정산해주세요</p>`;
    txns.forEach(tx => {
      h += `<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-weight:700;font-size:15px">${getMemberName(tx.from)}</span>
        <i class="ti ti-arrow-right" style="color:var(--muted)"></i>
        <span style="font-weight:700;font-size:15px">${getMemberName(tx.to)}</span>
        <span style="margin-left:auto;font-weight:900;color:var(--A);font-size:16px;white-space:nowrap">${fmt(tx.amount)}원</span>
      </div></div>`;
    });
  }
  h += `<h3 style="font-size:16px;font-weight:900;margin:1.5rem 0 12px">멤버별 현황</h3>`;
  nicks.forEach(n => {
    const mp = paid[n] || 0, ms = total / nicks.length, diff = mp - ms;
    h += `<div class="card"><div class="bw">
      <span style="font-weight:700">${getMemberName(n)}</span>
      <div style="text-align:right">
        <p style="font-size:14px;color:var(--A);font-weight:700">${fmt(mp)}원 결제</p>
        <p style="font-size:12px;color:${diff >= 0 ? 'var(--ok)' : 'var(--no)'};margin-top:3px">${diff >= 0 ? '+' + fmt(diff) + '원 받아야 함' : fmt(diff) + '원 내야 함'}</p>
      </div>
    </div></div>`;
  });
  el.innerHTML = h;
}

// ══════════════════════════════════════════════════
// 멤버 탭
// ══════════════════════════════════════════════════
function renderMembers() {
  const el = document.getElementById('tab-members');
  const members = getMembers();
  let h = `<h3 style="font-size:17px;font-weight:900;margin-bottom:14px">멤버 ${members.length}명</h3>`;
  members.forEach(m => {
    const nick = typeof m === 'object' ? m.nickname : m;
    const name = typeof m === 'object' ? (m.name || m.nickname) : m;
    h += `<div class="card" style="display:flex;align-items:center;gap:12px">
      <div class="av">${nick[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <p style="font-weight:700;font-size:15px">${nick}</p>
        <p style="font-size:13px;color:var(--muted);margin-top:2px">${name}${nick === S.me ? ` · <span style="color:var(--A);font-weight:700">나</span>` : ''}</p>
      </div>
    </div>`;
  });
  h += `<div style="margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)">
    <button class="bg" style="width:100%" onclick="leaveTrip()"><i class="ti ti-logout"></i>여행에서 나가기</button>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">코드를 알면 언제든지 다시 참여할 수 있어요</p>
  </div>`;
  el.innerHTML = h;
}


// ══════════════════════════════════════════════════
// 드래그 앤 드롭
// ══════════════════════════════════════════════════
let dragState = null;
let dragGhost = null;
let dropTargetId = null;

function startDrag(dayId, actId, e) {
  e.preventDefault();
  e.stopPropagation();
  const day = S.trip.itinerary.find(d => d.id === dayId);
  const act = day?.activities.find(a => a.id === actId);
  if (!act) return;

  dragState = { dayId, actId, act };
  dropTargetId = null;

  // 고스트 생성
  dragGhost = document.createElement('div');
  dragGhost.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;opacity:.9;width:260px;background:#fff;border:2px solid var(--A);border-radius:12px;padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-family:inherit;transform:rotate(2deg)';
  dragGhost.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
    ${act.time ? `<span style="font-size:11px;color:var(--A);font-weight:700">${act.time}</span>` : ''}
    <span style="font-size:14px;font-weight:700">${act.title}</span>
  </div>
  ${act.location ? `<p style="font-size:12px;color:var(--muted);margin-top:4px"><i class="ti ti-map-pin" style="font-size:11px"></i> ${act.location}</p>` : ''}`;
  document.body.appendChild(dragGhost);

  // 모든 날 카드 드롭존 활성화
  document.querySelectorAll('.day-card').forEach(c => {
    if (c.dataset.dropDay !== dayId) {
      c.style.border = '2px dashed var(--AL)';
      c.style.background = '#fdf8ef';
    }
  });

  const pt = e.touches ? e.touches[0] : e;
  posGhost(pt.clientX, pt.clientY);

  if (e.touches) {
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd, { once: true });
  } else {
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd, { once: true });
  }
}

function posGhost(x, y) {
  if (!dragGhost) return;
  dragGhost.style.left = (x - 130) + 'px';
  dragGhost.style.top = (y - 24) + 'px';

  // 현재 포인터 아래 날 찾기
  dragGhost.style.display = 'none';
  const el = document.elementFromPoint(x, y);
  dragGhost.style.display = '';
  const zone = el?.closest('[data-drop-day]');
  const newId = zone?.dataset.dropDay || null;

  if (newId !== dropTargetId) {
    // 이전 강조 해제
    if (dropTargetId) {
      const prev = document.querySelector(`[data-drop-day="${dropTargetId}"]`);
      if (prev && dropTargetId !== dragState.dayId) {
        prev.style.border = '2px dashed var(--AL)';
        prev.style.background = '#fdf8ef';
      }
    }
    dropTargetId = newId;
    if (dropTargetId && dropTargetId !== dragState.dayId) {
      const cur = document.querySelector(`[data-drop-day="${dropTargetId}"]`);
      if (cur) { cur.style.border = '2px solid var(--A)'; cur.style.background = 'var(--AX)'; }
    }
  }
}

function onDragMove(e) {
  if (e.cancelable) e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  posGhost(pt.clientX, pt.clientY);
}

function onDragEnd(e) {
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('mousemove', onDragMove);

  if (dragGhost) { dragGhost.remove(); dragGhost = null; }

  // 날 카드 스타일 원래대로
  document.querySelectorAll('.day-card').forEach(c => {
    c.style.border = '';
    c.style.background = '';
  });

  // 실제 이동
  if (dragState && dropTargetId && dropTargetId !== dragState.dayId) {
    const srcDay = S.trip.itinerary.find(d => d.id === dragState.dayId);
    const dstDay = S.trip.itinerary.find(d => d.id === dropTargetId);
    if (srcDay && dstDay) {
      srcDay.activities = srcDay.activities.filter(a => a.id !== dragState.actId);
      dstDay.activities.push(dragState.act);
      dstDay.activities.sort((a, b) => {
        if (!a.time && !b.time) return 0;
        if (!a.time) return 1; if (!b.time) return -1;
        return a.time.localeCompare(b.time);
      });
      dbSet('trip:' + S.code, S.trip);
      renderSchedule();
      showToast('일정을 이동했어요 ✈️');
    }
  }

  dragState = null; dropTargetId = null;
}

function leaveTrip() {
  stopSync();
  S.trip = null; S.me = ''; S.myName = ''; S.code = ''; S.pendingCode = '';
  EF = { open: false, title: '', amount: '', paidBy: '', split: [], cat: '식비' };
  openDayForm = false; openActForms.clear(); actMoreFields.clear(); editActState = {};
  go('land');
}


// ── 환율 ──
const CURRENCIES = [
  { code: 'KRW', label: '₩ 원' },
  { code: 'JPY', label: '¥ 엔' },
  { code: 'CNY', label: '¥ 위안' },
  { code: 'USD', label: '$ 달러' },
  { code: 'EUR', label: '€ 유로' },
];
const EXTRA_CURRENCIES = [
  'GBP','AUD','CAD','CHF','HKD','SGD','THB','VND','TWD','MXN','AED','INR'
];

async function fetchRate(currency) {
  if (currency === 'KRW' || rateCache[currency]) return;
  try {
    const r = await fetch(`https://open.er-api.com/v6/latest/${currency}`);
    const d = await r.json();
    if (d.rates && d.rates.KRW) rateCache[currency] = d.rates.KRW;
  } catch {}
}

function getCurrencyPreview() {
  const a = parseFloat(EF.amount);
  if (!a || EF.currency === 'KRW' || !rateCache[EF.currency]) return '';
  const krw = Math.round(a * rateCache[EF.currency]);
  return `≈ ${fmt(krw)}원`;
}

function selectCurrency(code) {
  EF.currency = code;
  if (code !== 'KRW') fetchRate(code).then(() => {
    const preview = document.getElementById('currency-preview');
    if (preview) preview.textContent = getCurrencyPreview();
  });
  renderExpenses();
}

function pickCustomCurrency() {
  const code = prompt('통화 코드를 입력해주세요 (예: THB, VND, GBP)')?.trim().toUpperCase();
  if (!code) return;
  if (!CURRENCIES.find(c => c.code === code)) {
    CURRENCIES.push({ code, label: code });
  }
  selectCurrency(code);
}

// ── 실시간 동기화 (폴링) ──
let syncTimer = null;
function startSync(code) {
  stopSync();
  syncTimer = setInterval(async () => {
    if (!code) return;
    const focused = document.activeElement;
    if (focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA')) return;
    if (openDayForm || openActForms.size > 0 || EF.open) return;
    try {
      const r = await fetch(FB + '/trip_' + code + '.json');
      const t = await r.json();
      if (t && JSON.stringify(t) !== JSON.stringify(S.trip)) {
        S.trip = t;
        MEM.set('trip:' + code, JSON.stringify(t));
        lsSet('trip:' + code, t);
        renderTrip();
      }
    } catch(e) {}
  }, 5000);
}
function stopSync() {
  if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
}

renderRecent();
</script>
